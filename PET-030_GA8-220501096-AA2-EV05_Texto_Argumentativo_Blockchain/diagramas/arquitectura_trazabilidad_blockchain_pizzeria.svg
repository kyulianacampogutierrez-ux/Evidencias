  <text x="302" y="356" font-family="'Courier New', monospace" font-size="8.5" fill="#A7F3D0">  pagoEscrow(campesino);</text>
  <text x="302" y="373" font-family="'Courier New', monospace" font-size="8.5" fill="#E9D5FF">}</text>

