<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="stepGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="stepGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="stepGrad3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="stepGrad4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#bgGrad3)"/>

  <!-- Title Header -->
  <rect x="30" y="20" width="940" height="60" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadow3)"/>
  <rect x="30" y="20" width="8" height="60" rx="4" fill="#F59E0B"/>
  <text x="50" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#F8FAFC">CICLO DE VIDA DE LA TRANSACCIÓN, MEMPOOL Y MINERÍA POR CONSENSO (POW)</text>
  <text x="50" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8">De la Firma Criptográfica Asimétrica a la Inmutabilidad Definitiva en el Libro Mayor Distribuido</text>

  <!-- Step 1: Creación y Firma -->
  <rect x="30" y="100" width="215" height="365" rx="8" fill="#111827" stroke="#0284C7" stroke-width="1.5" filter="url(#shadow3)"/>
  <rect x="30" y="100" width="215" height="35" rx="8" fill="url(#stepGrad1)"/>
  <text x="137" y="123" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1. CREACIÓN Y FIRMA</text>

  <rect x="42" y="150" width="190" height="90" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="52" y="170" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#38BDF8">Usuario / Cliente</text>
  <text x="52" y="190" font-family="'Courier New', monospace" font-size="9.5" fill="#CBD5E1">Emisor: Pizzería Bella</text>
  <text x="52" y="208" font-family="'Courier New', monospace" font-size="9.5" fill="#CBD5E1">Receptor: Lácteos Silvia</text>
  <text x="52" y="226" font-family="'Courier New', monospace" font-size="9.5" fill="#FBBF24">Monto: 450,000 COP (Tokens)</text>

  <rect x="42" y="250" width="190" height="95" rx="6" fill="#0C4A6E" stroke="#0284C7"/>
  <text x="52" y="270" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#BAE6FD">Criptografía Asimétrica</text>
  <text x="52" y="290" font-family="'Courier New', monospace" font-size="9" fill="#E0F2FE">• Clave Privada (Firma)</text>
  <text x="52" y="308" font-family="'Courier New', monospace" font-size="9" fill="#E0F2FE">• Curva ECDSA secp256k1</text>
  <text x="52" y="328" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#38BDF8">• Firma Digital: Sig(Tx, Kpr)</text>

  <rect x="42" y="355" width="190" height="95" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="52" y="375" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#94A3B8">Garantías Matemáticas:</text>
  <text x="52" y="395" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">✓ Autenticidad de origen</text>
  <text x="52" y="413" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">✓ Integridad del mensaje</text>
  <text x="52" y="431" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">✓ No repudio de autoría</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="245" y1="280" x2="270" y2="280" stroke="#38BDF8" stroke-width="2.5"/>
  <polygon points="270,275 280,280 270,285" fill="#38BDF8"/>

  <!-- Step 2: Propagación y Mempool -->
  <rect x="275" y="100" width="215" height="365" rx="8" fill="#111827" stroke="#D97706" stroke-width="1.5" filter="url(#shadow3)"/>
  <rect x="275" y="100" width="215" height="35" rx="8" fill="url(#stepGrad2)"/>
  <text x="382" y="123" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2. DIFUSIÓN Y MEMPOOL</text>

  <rect x="287" y="150" width="190" height="90" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="297" y="170" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FBBF24">Protocolo de Chismes</text>
  <text x="297" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#CBD5E1">Gossip Protocol P2P:</text>
  <text x="297" y="208" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#E2E8F0">• Nodos verifican saldo y firma</text>
  <text x="297" y="226" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#E2E8F0">• Retransmiten a vecinos</text>

  <rect x="287" y="250" width="190" height="95" rx="6" fill="#78350F" fill-opacity="0.4" stroke="#D97706"/>
  <text x="297" y="270" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#FDE68A">Mempool (Sala de Espera)</text>
  <text x="297" y="290" font-family="'Courier New', monospace" font-size="9" fill="#FEF3C7">• TX_101 (Tarifa alta) ★</text>
  <text x="297" y="308" font-family="'Courier New', monospace" font-size="9" fill="#FEF3C7">• TX_102 (Nuestra tx) ★</text>
  <text x="297" y="328" font-family="'Courier New', monospace" font-size="9" fill="#FDE68A">• TX_103 (Tarifa media)</text>

  <rect x="287" y="355" width="190" height="95" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="297" y="375" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#94A3B8">Incentivo Económico:</text>
  <text x="297" y="395" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">• Mineros priorizan por gas / fee</text>
  <text x="297" y="413" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">• Protección anti-spam / DoS</text>
  <text x="297" y="431" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">• Transacción no confirmada aún</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="490" y1="280" x2="515" y2="280" stroke="#F59E0B" stroke-width="2.5"/>
  <polygon points="515,275 525,280 515,285" fill="#F59E0B"/>

  <!-- Step 3: Minería y Prueba de Trabajo -->
  <rect x="520" y="100" width="215" height="365" rx="8" fill="#111827" stroke="#7C3AED" stroke-width="1.5" filter="url(#shadow3)"/>
  <rect x="520" y="100" width="215" height="35" rx="8" fill="url(#stepGrad3)"/>
  <text x="627" y="123" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3. MINERÍA Y POW</text>

  <rect x="532" y="150" width="190" height="90" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="542" y="170" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#C084FC">Empaquetado y Merkle</text>
  <text x="542" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#CBD5E1">• Agrupa ~2,000 transacciones</text>
  <text x="542" y="208" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">• Calcula Raíz de Merkle</text>
  <text x="542" y="226" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">• Agrega Hash Bloque Anterior</text>

  <rect x="532" y="250" width="190" height="95" rx="6" fill="#4C1D95" fill-opacity="0.5" stroke="#A855F7"/>
  <text x="542" y="270" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#E9D5FF">Prueba de Trabajo (PoW)</text>
  <text x="542" y="290" font-family="'Courier New', monospace" font-size="9" fill="#F3E8FF">SHA256(H_prev + M + Nonce)</text>
  <text x="542" y="308" font-family="'Courier New', monospace" font-size="9" fill="#A7F3D0">&lt; Target (Dificultad)</text>
  <text x="542" y="328" font-family="'Courier New', monospace" font-size="9" fill="#FDE047">¡Nonce Encontrado tras 10^18 h!</text>

  <rect x="532" y="355" width="190" height="95" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="542" y="375" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#94A3B8">Recompensa Económica:</text>
  <text x="542" y="395" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">• Subsidio de Bloque (Coinbase)</text>
  <text x="542" y="413" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">• Suma de comisiones cobradas</text>
  <text x="542" y="431" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">• Difusión del nuevo bloque al P2P</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="735" y1="280" x2="760" y2="280" stroke="#A855F7" stroke-width="2.5"/>
  <polygon points="760,275 770,280 760,285" fill="#A855F7"/>

  <!-- Step 4: Consenso y Adición -->
  <rect x="765" y="100" width="205" height="365" rx="8" fill="#111827" stroke="#059669" stroke-width="1.8" filter="url(#shadow3)"/>
  <rect x="765" y="100" width="205" height="35" rx="8" fill="url(#stepGrad4)"/>
  <text x="867" y="123" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4. CONSENSO Y REGISTRO</text>

  <rect x="775" y="150" width="185" height="90" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="785" y="170" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#4ADE80">Verificación Independiente</text>
  <text x="785" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">Cada nodo de la red:</text>
  <text x="785" y="208" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">1. Recalcula el Hash en &lt;1 ms</text>
  <text x="785" y="226" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">2. Verifica validez de cada TX</text>

  <rect x="775" y="250" width="185" height="95" rx="6" fill="#064E3B" stroke="#059669"/>
  <text x="785" y="270" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#A7F3D0">Inclusión en la Cadena</text>
  <text x="785" y="290" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#D1FAE5">• Bloque #105 grabado</text>
  <text x="785" y="308" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#D1FAE5">• TX confirmada (1 Conf)</text>
  <text x="785" y="328" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#6EE7B7">¡Registro Inmutable y Público!</text>

  <rect x="775" y="355" width="185" height="95" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="785" y="375" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#94A3B8">Finalidad y Seguridad:</text>
  <text x="785" y="395" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">• Fondos acreditados al campesino</text>
  <text x="785" y="413" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">• Cada nuevo bloque aumenta la</text>
  <text x="785" y="431" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">  seguridad criptográfica exponencial</text>
</svg>
