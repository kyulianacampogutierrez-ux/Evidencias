<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="senaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39A900"/>
      <stop offset="100%" stop-color="#2D8000"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" fill="url(#bgGrad)"/>

  <!-- Header -->
  <rect x="30" y="20" width="940" height="60" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="20" width="8" height="60" rx="4" fill="url(#senaGrad)"/>
  <text x="50" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#F8FAFC">TOPOLOGÍA COMPARATIVA DE REDES Y ARQUITECTURA DISTRIBUIDA BLOCKCHAIN</text>
  <text x="50" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8">De la Centralización Vulnerable a la Malla entre Pares (Peer-to-Peer) Inmutable y Tolerante a Fallos</text>

  <!-- Panel 1: Red Centralizada -->
  <rect x="30" y="95" width="295" height="375" rx="8" fill="url(#cardGrad)" stroke="#EF4444" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="95" width="295" height="35" rx="8" fill="#EF4444" fill-opacity="0.15"/>
  <text x="177" y="118" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#F87171" text-anchor="middle">A. RED CENTRALIZADA</text>

  <!-- Centralized Graph -->
  <!-- Links -->
  <line x1="177" y1="210" x2="95" y2="175" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="177" y1="210" x2="260" y2="175" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="177" y1="210" x2="80" y2="245" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="177" y1="210" x2="275" y2="245" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="177" y1="210" x2="120" y2="295" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="177" y1="210" x2="235" y2="295" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Central Server Node -->
  <circle cx="177" cy="210" r="28" fill="#EF4444" filter="url(#shadow)"/>
  <text x="177" y="208" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SERVIDOR</text>
  <text x="177" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#FEE2E2" text-anchor="middle">CENTRAL</text>

  <!-- Peripheral Clients -->
  <circle cx="95" cy="175" r="14" fill="#334155" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="95" y="179" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#F8FAFC" text-anchor="middle">C1</text>
  <circle cx="260" cy="175" r="14" fill="#334155" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="260" y="179" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#F8FAFC" text-anchor="middle">C2</text>
  <circle cx="80" cy="245" r="14" fill="#334155" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="80" y="249" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#F8FAFC" text-anchor="middle">C3</text>
  <circle cx="275" cy="245" r="14" fill="#334155" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="275" y="249" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#F8FAFC" text-anchor="middle">C4</text>
  <circle cx="120" cy="295" r="14" fill="#334155" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="120" y="299" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#F8FAFC" text-anchor="middle">C5</text>
  <circle cx="235" cy="295" r="14" fill="#334155" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="235" y="299" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#F8FAFC" text-anchor="middle">C6</text>

  <!-- Text Details Panel 1 -->
  <rect x="45" y="335" width="265" height="120" rx="6" fill="#0F172A" stroke="#334155"/>
  <text x="55" y="355" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#EF4444">• Único Punto de Fallo (SPOF)</text>
  <text x="55" y="375" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#CBD5E1">Si cae el servidor, se detiene todo.</text>
  <text x="55" y="395" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#F59E0B">• Confianza Ciega en Intermediario</text>
  <text x="55" y="415" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#CBD5E1">El administrador puede alterar datos.</text>
  <text x="55" y="435" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94A3B8">Ejemplo: Banca tradicional, ERP local.</text>

  <!-- Panel 2: Red Descentralizada -->
  <rect x="350" y="95" width="295" height="375" rx="8" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="350" y="95" width="295" height="35" rx="8" fill="#F59E0B" fill-opacity="0.15"/>
  <text x="497" y="118" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#FBBF24" text-anchor="middle">B. RED DESCENTRALIZADA</text>

  <!-- Decentralized Graph -->
  <!-- Hub 1 -->
  <circle cx="430" cy="195" r="20" fill="#F59E0B" filter="url(#shadow)"/>
  <text x="430" y="199" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">HUB 1</text>
  <!-- Hub 2 -->
  <circle cx="560" cy="225" r="20" fill="#F59E0B" filter="url(#shadow)"/>
  <text x="560" y="229" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">HUB 2</text>
  <!-- Hub Interconnection -->
  <line x1="430" y1="195" x2="560" y2="225" stroke="#F59E0B" stroke-width="2.5"/>

  <!-- Satellite Nodes -->
  <line x1="430" y1="195" x2="385" y2="160" stroke="#64748B" stroke-width="1.2"/>
  <circle cx="385" cy="160" r="12" fill="#334155" stroke="#CBD5E1"/>
  <line x1="430" y1="195" x2="395" y2="255" stroke="#64748B" stroke-width="1.2"/>
  <circle cx="395" cy="255" r="12" fill="#334155" stroke="#CBD5E1"/>
  <line x1="430" y1="195" x2="480" y2="150" stroke="#64748B" stroke-width="1.2"/>
  <circle cx="480" cy="150" r="12" fill="#334155" stroke="#CBD5E1"/>

  <line x1="560" y1="225" x2="615" y2="185" stroke="#64748B" stroke-width="1.2"/>
  <circle cx="615" cy="185" r="12" fill="#334155" stroke="#CBD5E1"/>
  <line x1="560" y1="225" x2="610" y2="280" stroke="#64748B" stroke-width="1.2"/>
  <circle cx="610" cy="280" r="12" fill="#334155" stroke="#CBD5E1"/>
  <line x1="560" y1="225" x2="520" y2="295" stroke="#64748B" stroke-width="1.2"/>
  <circle cx="520" cy="295" r="12" fill="#334155" stroke="#CBD5E1"/>

  <!-- Text Details Panel 2 -->
  <rect x="365" y="335" width="265" height="120" rx="6" fill="#0F172A" stroke="#334155"/>
  <text x="375" y="355" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#F59E0B">• Jerarquía de Servidores / Hubs</text>
  <text x="375" y="375" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#CBD5E1">Múltiples centros de coordinación.</text>
  <text x="375" y="395" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#38BDF8">• Mayor Tolerancia Parcial</text>
  <text x="375" y="415" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#CBD5E1">Persisten islas dependientes del hub.</text>
  <text x="375" y="435" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94A3B8">Ejemplo: DNS raíz, correo SMTP.</text>

  <!-- Panel 3: Red Distribuida P2P Blockchain -->
  <rect x="670" y="95" width="300" height="375" rx="8" fill="url(#cardGrad)" stroke="#39A900" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="670" y="95" width="300" height="35" rx="8" fill="#39A900" fill-opacity="0.2"/>
  <text x="820" y="118" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#4ADE80" text-anchor="middle">C. RED DISTRIBUIDA (BLOCKCHAIN)</text>

  <!-- P2P Mesh Network -->
  <!-- Mesh Links -->
  <line x1="740" y1="165" x2="820" y2="150" stroke="#39A900" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="820" y1="150" x2="900" y2="175" stroke="#39A900" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="740" y1="165" x2="715" y2="235" stroke="#39A900" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="740" y1="165" x2="820" y2="225" stroke="#39A900" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="820" y1="150" x2="820" y2="225" stroke="#39A900" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="900" y1="175" x2="820" y2="225" stroke="#39A900" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="900" y1="175" x2="920" y2="250" stroke="#39A900" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="715" y1="235" x2="760" y2="295" stroke="#39A900" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="715" y1="235" x2="820" y2="225" stroke="#39A900" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="820" y1="225" x2="760" y2="295" stroke="#39A900" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="820" y1="225" x2="870" y2="295" stroke="#39A900" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="920" y1="250" x2="820" y2="225" stroke="#39A900" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="920" y1="250" x2="870" y2="295" stroke="#39A900" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="760" y1="295" x2="870" y2="295" stroke="#39A900" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- P2P Peer Nodes -->
  <circle cx="740" cy="165" r="15" fill="#39A900" stroke="#86EFAC" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="740" y="169" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">N1</text>

  <circle cx="820" cy="150" r="15" fill="#39A900" stroke="#86EFAC" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="820" y="154" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">N2</text>

  <circle cx="900" cy="175" r="15" fill="#39A900" stroke="#86EFAC" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="900" y="179" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">N3</text>

  <circle cx="715" cy="235" r="15" fill="#39A900" stroke="#86EFAC" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="715" y="239" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">N4</text>

  <circle cx="820" cy="225" r="18" fill="#22C55E" stroke="#DCFCE7" stroke-width="2" filter="url(#shadow)"/>
  <text x="820" y="229" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#052E16" text-anchor="middle">P2P</text>

  <circle cx="920" cy="250" r="15" fill="#39A900" stroke="#86EFAC" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="920" y="254" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">N5</text>

  <circle cx="760" cy="295" r="15" fill="#39A900" stroke="#86EFAC" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="760" y="299" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">N6</text>

  <circle cx="870" cy="295" r="15" fill="#39A900" stroke="#86EFAC" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="870" y="299" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">N7</text>

  <!-- Text Details Panel 3 -->
  <rect x="685" y="335" width="270" height="120" rx="6" fill="#0F172A" stroke="#334155"/>
  <text x="695" y="355" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#4ADE80">• Libro Mayor Distribuido Idéntico</text>
  <text x="695" y="375" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#CBD5E1">Cada nodo guarda copia completa.</text>
  <text x="695" y="395" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#38BDF8">• Consenso Criptográfico Sin Jefe</text>
  <text x="695" y="415" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#CBD5E1">Inmune a censura y ataques de caída.</text>
  <text x="695" y="435" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94A3B8">Ejemplo: Bitcoin, Ethereum, Hyperledger.</text>
</svg>
