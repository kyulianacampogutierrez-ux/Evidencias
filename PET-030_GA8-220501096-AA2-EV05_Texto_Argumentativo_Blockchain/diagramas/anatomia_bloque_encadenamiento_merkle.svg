<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="blockHeaderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="merkleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="hashGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1000" height="560" fill="url(#bgGrad2)"/>

  <!-- Main Header -->
  <rect x="25" y="15" width="950" height="55" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadow2)"/>
  <rect x="25" y="15" width="8" height="55" rx="4" fill="#10B981"/>
  <text x="45" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="bold" fill="#F8FAFC">ANATOMÍA DEL BLOQUE, ÁRBOL DE MERKLE Y ENCADENAMIENTO CRIPTOGRÁFICO</text>
  <text x="45" y="58" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94A3B8">Inmutabilidad Estricta por Funciones Hash Unidireccionales (SHA-256) y Raíz de Merkle</text>

  <!-- BLOQUE N-1 (Bloque Anterior) -->
  <rect x="25" y="85" width="260" height="450" rx="10" fill="#111827" stroke="#475569" stroke-width="1.5" filter="url(#shadow2)"/>
  <rect x="25" y="85" width="260" height="35" rx="10" fill="#374151"/>
  <text x="155" y="108" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#F3F4F6" text-anchor="middle">BLOQUE #104 (N-1)</text>

  <!-- Header Bloque N-1 -->
  <rect x="35" y="130" width="240" height="150" rx="6" fill="#1F2937" stroke="#374151"/>
  <text x="45" y="150" font-family="'Courier New', monospace" font-size="11" fill="#93C5FD">Version: 0x20000000</text>
  <text x="45" y="170" font-family="'Courier New', monospace" font-size="10" fill="#94A3B8">Prev Hash: 000000...e8f2</text>
  <text x="45" y="190" font-family="'Courier New', monospace" font-size="10" fill="#34D399">Merkle Root: 7a8c3...b14</text>
  <text x="45" y="210" font-family="'Courier New', monospace" font-size="10" fill="#CBD5E1">Time: 1731362400</text>
  <text x="45" y="230" font-family="'Courier New', monospace" font-size="10" fill="#FBBF24">Bits: 0x1d00ffff</text>
  <text x="45" y="250" font-family="'Courier New', monospace" font-size="10" fill="#F472B6">Nonce: 2,481,953</text>
  <rect x="42" y="258" width="225" height="18" rx="3" fill="#047857" fill-opacity="0.3"/>
  <text x="48" y="271" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#6EE7B7">Hash: 000000ab43f9...7c1a</text>

  <!-- Body Bloque N-1 -->
  <rect x="35" y="290" width="240" height="230" rx="6" fill="#1F2937" stroke="#374151"/>
  <text x="155" y="310" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#CBD5E1" text-anchor="middle">CUERPO: TRANSACCIONES (TX)</text>
  <rect x="45" y="325" width="220" height="35" rx="4" fill="#111827" stroke="#4B5563"/>
  <text x="52" y="345" font-family="'Courier New', monospace" font-size="9.5" fill="#E5E7EB">TX_0: Coinbase -&gt; Minero 6.25</text>
  <rect x="45" y="370" width="220" height="35" rx="4" fill="#111827" stroke="#4B5563"/>
  <text x="52" y="390" font-family="'Courier New', monospace" font-size="9.5" fill="#E5E7EB">TX_1: Granja Silvia -&gt; Pizzería</text>
  <rect x="45" y="415" width="220" height="35" rx="4" fill="#111827" stroke="#4B5563"/>
  <text x="52" y="435" font-family="'Courier New', monospace" font-size="9.5" fill="#E5E7EB">TX_2: Pizzería -&gt; Proveedor Gas</text>
  <rect x="45" y="460" width="220" height="45" rx="4" fill="#064E3B" stroke="#059669"/>
  <text x="52" y="478" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#A7F3D0">✓ Bloque Minado y Confirmado</text>
  <text x="52" y="495" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#D1FAE5">Consenso validado por la red</text>

  <!-- ENLACE CRIPTOGRÁFICO N-1 -> N -->
  <path d="M 285 267 C 325 267, 325 170, 365 170" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="4,4"/>
  <polygon points="365,165 375,170 365,175" fill="#F59E0B"/>
  <rect x="295" y="195" width="65" height="35" rx="4" fill="#0F172A" stroke="#F59E0B"/>
  <text x="327" y="210" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#FBBF24" text-anchor="middle">SHA-256</text>
  <text x="327" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" fill="#FDE68A" text-anchor="middle">Prev Hash</text>

  <!-- BLOQUE N (Bloque Actual en Profundidad con Árbol de Merkle) -->
  <rect x="375" y="85" width="310" height="450" rx="10" fill="#0F172A" stroke="#2563EB" stroke-width="2" filter="url(#shadow2)"/>
  <rect x="375" y="85" width="310" height="35" rx="10" fill="url(#blockHeaderGrad)"/>
  <text x="530" y="108" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">BLOQUE #105 (N) - ANATOMÍA</text>

  <!-- Cabecera Bloque N -->
  <rect x="385" y="125" width="290" height="150" rx="6" fill="#1E293B" stroke="#3B82F6"/>
  <text x="395" y="145" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#60A5FA">CABECERA DEL BLOQUE (80 BYTES)</text>
  <text x="395" y="165" font-family="'Courier New', monospace" font-size="10" fill="#CBD5E1">Version: 0x20000000</text>
  <rect x="392" y="172" width="275" height="20" rx="3" fill="#D97706" fill-opacity="0.25"/>
  <text x="395" y="186" font-family="'Courier New', monospace" font-size="9.5" font-weight="bold" fill="#FCD34D">Prev Hash: 000000ab43f9...7c1a</text>
  <rect x="392" y="196" width="275" height="20" rx="3" fill="#059669" fill-opacity="0.25"/>
  <text x="395" y="210" font-family="'Courier New', monospace" font-size="9.5" font-weight="bold" fill="#6EE7B7">Merkle Root: e3b0c442...98c1</text>
  <text x="395" y="230" font-family="'Courier New', monospace" font-size="10" fill="#E2E8F0">Timestamp: 1731363000 (Epoch)</text>
  <text x="395" y="247" font-family="'Courier New', monospace" font-size="10" fill="#E2E8F0">Difficulty Target: 0x1d00ffff</text>
  <text x="395" y="265" font-family="'Courier New', monospace" font-size="10.5" font-weight="bold" fill="#F472B6">Nonce: 1,847,129 (PoW)</text>

  <!-- Cuerpo de Bloque N: ÁRBOL DE MERKLE -->
  <rect x="385" y="285" width="290" height="235" rx="6" fill="#1E293B" stroke="#059669"/>
  <text x="530" y="303" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#34D399" text-anchor="middle">ÁRBOL DE MERKLE (CUERPO DEL BLOQUE)</text>

  <!-- Merkle Root Node -->
  <rect x="475" y="315" width="110" height="25" rx="4" fill="#059669" stroke="#6EE7B7"/>
  <text x="530" y="331" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">RAÍZ: H(AB+CD)</text>

  <!-- Merkle Branches -->
  <line x1="510" y1="340" x2="445" y2="365" stroke="#10B981" stroke-width="1.5"/>
  <line x1="550" y1="340" x2="615" y2="365" stroke="#10B981" stroke-width="1.5"/>

  <!-- Intermediate Hash Nodes -->
  <rect x="405" y="365" width="85" height="22" rx="4" fill="#047857"/>
  <text x="447" y="380" font-family="'Courier New', monospace" font-size="9" fill="#ECFDF5" text-anchor="middle">Hash AB</text>

  <rect x="575" y="365" width="85" height="22" rx="4" fill="#047857"/>
  <text x="617" y="380" font-family="'Courier New', monospace" font-size="9" fill="#ECFDF5" text-anchor="middle">Hash CD</text>

  <!-- Sub-branches -->
  <line x1="425" y1="387" x2="410" y2="415" stroke="#10B981" stroke-width="1.2"/>
  <line x1="465" y1="387" x2="475" y2="415" stroke="#10B981" stroke-width="1.2"/>
  <line x1="595" y1="387" x2="585" y2="415" stroke="#10B981" stroke-width="1.2"/>
  <line x1="635" y1="387" x2="650" y2="415" stroke="#10B981" stroke-width="1.2"/>

  <!-- Leaf Hashes -->
  <rect x="390" y="415" width="40" height="18" rx="3" fill="#065F46"/>
  <text x="410" y="427" font-family="'Courier New', monospace" font-size="8" fill="#D1FAE5" text-anchor="middle">H(A)</text>
  <rect x="455" y="415" width="40" height="18" rx="3" fill="#065F46"/>
  <text x="475" y="427" font-family="'Courier New', monospace" font-size="8" fill="#D1FAE5" text-anchor="middle">H(B)</text>
  <rect x="565" y="415" width="40" height="18" rx="3" fill="#065F46"/>
  <text x="585" y="427" font-family="'Courier New', monospace" font-size="8" fill="#D1FAE5" text-anchor="middle">H(C)</text>
  <rect x="630" y="415" width="40" height="18" rx="3" fill="#065F46"/>
  <text x="650" y="427" font-family="'Courier New', monospace" font-size="8" fill="#D1FAE5" text-anchor="middle">H(D)</text>

  <!-- Raw Transactions -->
  <rect x="390" y="445" width="60" height="22" rx="3" fill="#334155"/>
  <text x="420" y="459" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#F8FAFC" text-anchor="middle">TX_A (Queso)</text>
  <rect x="455" y="445" width="60" height="22" rx="3" fill="#334155"/>
  <text x="485" y="459" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#F8FAFC" text-anchor="middle">TX_B (Harina)</text>
  <rect x="555" y="445" width="60" height="22" rx="3" fill="#334155"/>
  <text x="585" y="459" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#F8FAFC" text-anchor="middle">TX_C (Tomate)</text>
  <rect x="620" y="445" width="60" height="22" rx="3" fill="#334155"/>
  <text x="650" y="459" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#F8FAFC" text-anchor="middle">TX_D (Leña)</text>

  <rect x="395" y="480" width="270" height="30" rx="4" fill="#0284C7" fill-opacity="0.2"/>
  <text x="530" y="499" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#BAE6FD" text-anchor="middle">Hash Bloque N: 0000004c19de...f510</text>

  <!-- ENLACE CRIPTOGRÁFICO N -> N+1 -->
  <path d="M 685 495 C 715 495, 715 170, 745 170" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="4,4"/>
  <polygon points="745,165 755,170 745,175" fill="#F59E0B"/>
  <rect x="690" y="280" width="60" height="35" rx="4" fill="#0F172A" stroke="#F59E0B"/>
  <text x="720" y="295" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#FBBF24" text-anchor="middle">SHA-256</text>
  <text x="720" y="307" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" fill="#FDE68A" text-anchor="middle">Prev Hash</text>

  <!-- BLOQUE N+1 (Bloque Siguiente) -->
  <rect x="755" y="85" width="220" height="450" rx="10" fill="#111827" stroke="#475569" stroke-width="1.5" filter="url(#shadow2)"/>
  <rect x="755" y="85" width="220" height="35" rx="10" fill="#374151"/>
  <text x="865" y="108" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#F3F4F6" text-anchor="middle">BLOQUE #106 (N+1)</text>

  <!-- Header Bloque N+1 -->
  <rect x="765" y="130" width="200" height="150" rx="6" fill="#1F2937" stroke="#374151"/>
  <text x="775" y="150" font-family="'Courier New', monospace" font-size="9.5" fill="#93C5FD">Version: 0x20000000</text>
  <rect x="770" y="158" width="190" height="20" rx="3" fill="#D97706" fill-opacity="0.3"/>
  <text x="775" y="172" font-family="'Courier New', monospace" font-size="8.5" font-weight="bold" fill="#FCD34D">Prev: 0000004c19de...f510</text>
  <text x="775" y="195" font-family="'Courier New', monospace" font-size="9" fill="#34D399">Merkle: 91fa0...17e</text>
  <text x="775" y="215" font-family="'Courier New', monospace" font-size="9" fill="#CBD5E1">Time: 1731363600</text>
  <text x="775" y="235" font-family="'Courier New', monospace" font-size="9" fill="#FBBF24">Bits: 0x1d00ffff</text>
  <text x="775" y="255" font-family="'Courier New', monospace" font-size="9" fill="#F472B6">Nonce: 4,109,382</text>

  <!-- Consecuencia de Inmutabilidad -->
  <rect x="765" y="295" width="200" height="225" rx="6" fill="#3F1D28" stroke="#E11D48"/>
  <text x="865" y="318" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FDA4AF" text-anchor="middle">EFECTO AVALANCHA</text>
  <text x="775" y="340" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#FECDD3">• Si un atacante altera 1</text>
  <text x="775" y="355" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#FECDD3">  bit en TX_A de Bloque N:</text>
  <text x="775" y="375" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#FECDD3">• H(A) cambia radicalmente.</text>
  <text x="775" y="395" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#FECDD3">• Merkle Root cambia.</text>
  <text x="775" y="415" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#FECDD3">• Hash Bloque N no cumple</text>
  <text x="775" y="430" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#FECDD3">  la dificultad de ceros.</text>
  <text x="775" y="450" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#FECDD3">• Bloque N+1 queda inválido.</text>
  <text x="775" y="475" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#F43F5E">La red P2P rechaza la cadena</text>
  <text x="775" y="490" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#FDA4AF">adulterada por falta de consenso.</text>
</svg>
