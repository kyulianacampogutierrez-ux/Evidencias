<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" style="background:#0f172a; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="gradCompUI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gradCompGW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="gradCompSvc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="gradCompDB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Filter for drop shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Title Header Bar -->
  <rect x="30" y="25" width="1140" height="70" rx="10" fill="url(#gradHeader)" filter="url(#shadow)"/>
  <text x="50" y="55" fill="#ffffff" font-size="20" font-weight="700">PIZZERÍA GOURMET BELLA ITALIA POPAYÁN - DIAGRAMA DE COMPONENTES UML</text>
  <text x="50" y="78" fill="#bae6fd" font-size="12.5">Evidencia GA10-220501097-AA10-EV01 | Aprendiz: Karen Yuliana Campo | Ficha: 3186681 | Estándar UML 2.5 &amp; ISO/IEC/IEEE 12207</text>

  <!-- TIER 1: PRESENTATION LAYER (Top) -->
  <g transform="translate(60, 120)" filter="url(#shadow)">
    <rect x="0" y="0" width="1080" height="130" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="25" fill="#38bdf8" font-size="12" font-weight="bold" letter-spacing="1">CAPA DE PRESENTACIÓN (CLIENTE FRONTEND)</text>

    <!-- Component 1: Web React SPA -->
    <g transform="translate(30, 38)">
      <rect x="0" y="0" width="310" height="75" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
      <rect x="-10" y="12" width="18" height="10" rx="2" fill="#38bdf8"/>
      <rect x="-10" y="32" width="18" height="10" rx="2" fill="#38bdf8"/>
      <text x="20" y="26" fill="#93c5fd" font-size="10">&lt;&lt;component&gt;&gt;</text>
      <text x="20" y="44" fill="#ffffff" font-size="13" font-weight="bold">Portal Web Clientes (SPA)</text>
      <text x="20" y="62" fill="#94a3b8" font-size="11">React 18 + Vite + Tailwind CSS</text>
    </g>

    <!-- Component 2: Mobile PWA / Salon -->
    <g transform="translate(385, 38)">
      <rect x="0" y="0" width="310" height="75" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
      <rect x="-10" y="12" width="18" height="10" rx="2" fill="#38bdf8"/>
      <rect x="-10" y="32" width="18" height="10" rx="2" fill="#38bdf8"/>
      <text x="20" y="26" fill="#93c5fd" font-size="10">&lt;&lt;component&gt;&gt;</text>
      <text x="20" y="44" fill="#ffffff" font-size="13" font-weight="bold">Módulo Salón &amp; Domicilios</text>
      <text x="20" y="62" fill="#94a3b8" font-size="11">PWA Móvil Responsiva + Geoloc</text>
    </g>

    <!-- Component 3: Admin Dashboard -->
    <g transform="translate(740, 38)">
      <rect x="0" y="0" width="310" height="75" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
      <rect x="-10" y="12" width="18" height="10" rx="2" fill="#38bdf8"/>
      <rect x="-10" y="32" width="18" height="10" rx="2" fill="#38bdf8"/>
      <text x="20" y="26" fill="#93c5fd" font-size="10">&lt;&lt;component&gt;&gt;</text>
      <text x="20" y="44" fill="#ffffff" font-size="13" font-weight="bold">Panel Administrativo &amp; KDS</text>
      <text x="20" y="62" fill="#94a3b8" font-size="11">Control Inventario &amp; Comandas</text>
    </g>
  </g>

  <!-- CONNECTING ARROWS TIER 1 TO TIER 2 -->
  <line x1="600" y1="250" x2="600" y2="290" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="615" y="275" fill="#38bdf8" font-size="11" font-weight="bold">HTTPS / WebSocket (:8099)</text>

  <!-- TIER 2: GATEWAY & SECURITY LAYER (Middle Top) -->
  <g transform="translate(60, 290)" filter="url(#shadow)">
    <rect x="0" y="0" width="1080" height="110" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="20" y="25" fill="#818cf8" font-size="12" font-weight="bold" letter-spacing="1">CAPA DE SEGURIDAD &amp; ENRUTAMIENTO PERIMETRAL</text>

    <!-- Component 4: Reverse Proxy & Gateway -->
    <g transform="translate(30, 34)">
      <rect x="0" y="0" width="480" height="62" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1"/>
      <rect x="-10" y="12" width="18" height="10" rx="2" fill="#818cf8"/>
      <rect x="-10" y="32" width="18" height="10" rx="2" fill="#818cf8"/>
      <text x="20" y="22" fill="#c7d2fe" font-size="10">&lt;&lt;component&gt;&gt; Reverse Proxy HTTPD</text>
      <text x="20" y="40" fill="#ffffff" font-size="13" font-weight="bold">Apache Web Server (Puerto 8099)</text>
      <text x="20" y="55" fill="#94a3b8" font-size="10">Balanceo de carga, terminación SSL, compresión gzip y headers HSTS</text>
    </g>

    <!-- Component 5: API Gateway & Router -->
    <g transform="translate(570, 34)">
      <rect x="0" y="0" width="480" height="62" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1"/>
      <rect x="-10" y="12" width="18" height="10" rx="2" fill="#818cf8"/>
      <rect x="-10" y="32" width="18" height="10" rx="2" fill="#818cf8"/>
      <text x="20" y="22" fill="#c7d2fe" font-size="10">&lt;&lt;component&gt;&gt; API Gateway Router</text>
      <text x="20" y="40" fill="#ffffff" font-size="13" font-weight="bold">Node.js Express / Dispatcher (Puerto 8085)</text>
      <text x="20" y="55" fill="#94a3b8" font-size="10">Control de rate limit (100 req/min), CORS policy e inyección de contexto</text>
    </g>
  </g>

  <!-- CONNECTING ARROWS TIER 2 TO TIER 3 -->
  <line x1="600" y1="400" x2="600" y2="440" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="615" y="425" fill="#818cf8" font-size="11" font-weight="bold">gRPC / Internal REST</text>

  <!-- TIER 3: MICROSERVICES & BUSINESS LOGIC (Middle Bottom) -->
  <g transform="translate(60, 440)" filter="url(#shadow)">
    <rect x="0" y="0" width="1080" height="145" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="20" y="25" fill="#34d399" font-size="12" font-weight="bold" letter-spacing="1">CAPA DE LÓGICA DE NEGOCIO (MICROSERVICIOS DESACOPLADOS)</text>

    <!-- Svc 1: Auth & RBAC -->
    <g transform="translate(25, 38)">
      <rect x="0" y="0" width="240" height="85" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
      <rect x="-10" y="12" width="18" height="10" rx="2" fill="#34d399"/>
      <rect x="-10" y="32" width="18" height="10" rx="2" fill="#34d399"/>
      <text x="18" y="22" fill="#6ee7b7" font-size="9">&lt;&lt;service&gt;&gt;</text>
      <text x="18" y="40" fill="#ffffff" font-size="12" font-weight="bold">Auth &amp; RBAC Service</text>
      <text x="18" y="56" fill="#cbd5e1" font-size="10">Go + Bcrypt + JWT (8083)</text>
      <text x="18" y="72" fill="#94a3b8" font-size="9">Validación claims y tokens</text>
    </g>

    <!-- Svc 2: Catalog & Stock -->
    <g transform="translate(285, 38)">
      <rect x="0" y="0" width="240" height="85" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
      <rect x="-10" y="12" width="18" height="10" rx="2" fill="#34d399"/>
      <rect x="-10" y="32" width="18" height="10" rx="2" fill="#34d399"/>
      <text x="18" y="22" fill="#6ee7b7" font-size="9">&lt;&lt;service&gt;&gt;</text>
      <text x="18" y="40" fill="#ffffff" font-size="12" font-weight="bold">Catalog &amp; Stock Service</text>
      <text x="18" y="56" fill="#cbd5e1" font-size="10">Go REST API (8084)</text>
      <text x="18" y="72" fill="#94a3b8" font-size="9">Recetas, precios e inventario</text>
    </g>

    <!-- Svc 3: Orders & POS -->
    <g transform="translate(545, 38)">
      <rect x="0" y="0" width="255" height="85" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
      <rect x="-10" y="12" width="18" height="10" rx="2" fill="#34d399"/>
      <rect x="-10" y="32" width="18" height="10" rx="2" fill="#34d399"/>
      <text x="18" y="22" fill="#6ee7b7" font-size="9">&lt;&lt;service&gt;&gt;</text>
      <text x="18" y="40" fill="#ffffff" font-size="12" font-weight="bold">Orders &amp; Checkout Service</text>
      <text x="18" y="56" fill="#cbd5e1" font-size="10">Go ACID Engine (8086)</text>
      <text x="18" y="72" fill="#94a3b8" font-size="9">Comandas, cocina y estados</text>
    </g>

    <!-- Svc 4: DIAN Electronic Billing -->
    <g transform="translate(820, 38)">
      <rect x="0" y="0" width="235" height="85" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
      <rect x="-10" y="12" width="18" height="10" rx="2" fill="#34d399"/>
      <rect x="-10" y="32" width="18" height="10" rx="2" fill="#34d399"/>
      <text x="18" y="22" fill="#6ee7b7" font-size="9">&lt;&lt;service&gt;&gt;</text>
      <text x="18" y="40" fill="#ffffff" font-size="12" font-weight="bold">DIAN Fiscal Service</text>
      <text x="18" y="56" fill="#cbd5e1" font-size="10">Node.js SOAP/XML (8087)</text>
      <text x="18" y="72" fill="#94a3b8" font-size="9">CUFE, QR y firma digital</text>
    </g>
  </g>

  <!-- CONNECTING ARROWS TIER 3 TO TIER 4 -->
  <line x1="600" y1="585" x2="600" y2="625" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="615" y="610" fill="#34d399" font-size="11" font-weight="bold">TCP Socket (:3314) / SQL Protocol</text>

  <!-- TIER 4: PERSISTENCE & STORAGE (Bottom) -->
  <g transform="translate(60, 625)" filter="url(#shadow)">
    <rect x="0" y="0" width="1080" height="185" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="20" y="25" fill="#f59e0b" font-size="12" font-weight="bold" letter-spacing="1">CAPA DE PERSISTENCIA RELACIONAL &amp; RESPALDOS 3-2-1</text>

    <!-- Component DB: MySQL 8.0 -->
    <g transform="translate(30, 38)">
      <rect x="0" y="0" width="480" height="125" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1"/>
      <rect x="-10" y="12" width="18" height="10" rx="2" fill="#fbbf24"/>
      <rect x="-10" y="32" width="18" height="10" rx="2" fill="#fbbf24"/>
      <text x="20" y="26" fill="#fde68a" font-size="10">&lt;&lt;database&gt;&gt; Motor Relacional</text>
      <text x="20" y="46" fill="#ffffff" font-size="14" font-weight="bold">MySQL Community Server 8.0 (Puerto 3314)</text>
      <text x="20" y="66" fill="#cbd5e1" font-size="11">• Base de Datos: <code>pizzeria_manual_tecnico_db</code></text>
      <text x="20" y="86" fill="#cbd5e1" font-size="11">• Motor Transaccional InnoDB con soporte ACID y Foreign Keys</text>
      <text x="20" y="106" fill="#38bdf8" font-size="10">8 Tablas: usuarios, roles, categorias, productos, pedidos, detalles, facturas, logs</text>
    </g>

    <!-- Component Storage: Backups 3-2-1 -->
    <g transform="translate(570, 38)">
      <rect x="0" y="0" width="480" height="125" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1"/>
      <rect x="-10" y="12" width="18" height="10" rx="2" fill="#fbbf24"/>
      <rect x="-10" y="32" width="18" height="10" rx="2" fill="#fbbf24"/>
      <text x="20" y="26" fill="#fde68a" font-size="10">&lt;&lt;storage&gt;&gt; Política de Respaldo</text>
      <text x="20" y="46" fill="#ffffff" font-size="14" font-weight="bold">Estrategia de Almacenamiento 3-2-1</text>
      <text x="20" y="66" fill="#cbd5e1" font-size="11">• Copia 1: Primaria Local NVMe Fast Disk (RTO &lt; 15 min)</text>
      <text x="20" y="86" fill="#cbd5e1" font-size="11">• Copia 2: Medio Secundario NAS / Docker Staging desacoplado</text>
      <text x="20" y="106" fill="#c084fc" font-size="10">• Copia 3: Cloud Offsite cifrado AES-256 (Retención 5 años Ley 1581)</text>
    </g>
  </g>
</svg>
