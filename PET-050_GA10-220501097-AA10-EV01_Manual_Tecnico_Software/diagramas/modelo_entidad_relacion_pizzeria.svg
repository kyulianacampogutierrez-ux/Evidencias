<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" style="background:#0f172a; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="gradEntityHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Filter for drop shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Title Header Bar -->
  <rect x="30" y="25" width="1140" height="70" rx="10" fill="url(#gradHeader)" filter="url(#shadow)"/>
  <text x="50" y="55" fill="#ffffff" font-size="20" font-weight="700">PIZZERÍA GOURMET BELLA ITALIA POPAYÁN - MODELO ENTIDAD-RELACIÓN (E-R)</text>
  <text x="50" y="78" fill="#bae6fd" font-size="12.5">Evidencia GA10-220501097-AA10-EV01 | Aprendiz: Karen Yuliana Campo | Ficha: 3186681 | Motor MySQL 8.0 InnoDB</text>

  <!-- ENTITY 1: tbl_roles_permisos (Top Left) -->
  <g transform="translate(40, 120)" filter="url(#shadow)">
    <rect x="0" y="0" width="230" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="32" rx="8" fill="#0369a1"/>
    <text x="12" y="21" fill="#ffffff" font-size="12" font-weight="bold">tbl_roles_permisos</text>
    <text x="12" y="52" fill="#ef4444" font-size="11" font-weight="bold">PK  id_rol : INT</text>
    <text x="12" y="72" fill="#cbd5e1" font-size="11">    nombre_rol : VARCHAR(50)</text>
    <text x="12" y="92" fill="#cbd5e1" font-size="11">    descripcion : VARCHAR(255)</text>
    <text x="12" y="112" fill="#cbd5e1" font-size="11">    nivel_acceso : INT</text>
    <text x="12" y="132" fill="#94a3b8" font-size="10">    fecha_creacion : TIMESTAMP</text>
  </g>

  <!-- ENTITY 2: tbl_usuarios (Center Left) -->
  <g transform="translate(320, 120)" filter="url(#shadow)">
    <rect x="0" y="0" width="250" height="210" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="32" rx="8" fill="#0284c7"/>
    <text x="12" y="21" fill="#ffffff" font-size="12" font-weight="bold">tbl_usuarios</text>
    <text x="12" y="52" fill="#ef4444" font-size="11" font-weight="bold">PK  id_usuario : INT</text>
    <text x="12" y="72" fill="#38bdf8" font-size="11" font-weight="bold">FK  id_rol : INT</text>
    <text x="12" y="92" fill="#cbd5e1" font-size="11">    nombre_completo : VARCHAR(120)</text>
    <text x="12" y="112" fill="#cbd5e1" font-size="11">    email : VARCHAR(100) (UQ)</text>
    <text x="12" y="132" fill="#cbd5e1" font-size="11">    telefono : VARCHAR(20)</text>
    <text x="12" y="152" fill="#cbd5e1" font-size="11">    password_hash : VARCHAR(255)</text>
    <text x="12" y="172" fill="#cbd5e1" font-size="11">    estado : ENUM('ACTIVO','...')</text>
    <text x="12" y="192" fill="#94a3b8" font-size="10">    fecha_creacion : TIMESTAMP</text>
  </g>

  <!-- ENTITY 3: tbl_auditoria_logs (Bottom Left) -->
  <g transform="translate(40, 360)" filter="url(#shadow)">
    <rect x="0" y="0" width="240" height="190" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="32" rx="8" fill="#0f766e"/>
    <text x="12" y="21" fill="#ffffff" font-size="12" font-weight="bold">tbl_auditoria_logs</text>
    <text x="12" y="52" fill="#ef4444" font-size="11" font-weight="bold">PK  id_log : BIGINT</text>
    <text x="12" y="72" fill="#38bdf8" font-size="11" font-weight="bold">FK  id_usuario : INT (NULL)</text>
    <text x="12" y="92" fill="#cbd5e1" font-size="11">    accion : VARCHAR(50)</text>
    <text x="12" y="112" fill="#cbd5e1" font-size="11">    tabla_afectada : VARCHAR(50)</text>
    <text x="12" y="132" fill="#cbd5e1" font-size="11">    id_registro_afectado : INT</text>
    <text x="12" y="152" fill="#cbd5e1" font-size="11">    ip_origen : VARCHAR(45)</text>
    <text x="12" y="172" fill="#94a3b8" font-size="10">    detalles_json : JSON</text>
  </g>

  <!-- ENTITY 4: tbl_pedidos (Center Middle) -->
  <g transform="translate(620, 120)" filter="url(#shadow)">
    <rect x="0" y="0" width="250" height="250" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="32" rx="8" fill="#0284c7"/>
    <text x="12" y="21" fill="#ffffff" font-size="12" font-weight="bold">tbl_pedidos</text>
    <text x="12" y="52" fill="#ef4444" font-size="11" font-weight="bold">PK  id_pedido : INT</text>
    <text x="12" y="72" fill="#38bdf8" font-size="11" font-weight="bold">FK  id_cliente : INT</text>
    <text x="12" y="92" fill="#cbd5e1" font-size="11">    codigo_orden : VARCHAR(30) (UQ)</text>
    <text x="12" y="112" fill="#cbd5e1" font-size="11">    canal_origen : ENUM('WEB','...')</text>
    <text x="12" y="132" fill="#cbd5e1" font-size="11">    estado_pedido : ENUM('RECIBIDO'..)</text>
    <text x="12" y="152" fill="#cbd5e1" font-size="11">    subtotal_cop : DECIMAL(12,2)</text>
    <text x="12" y="172" fill="#cbd5e1" font-size="11">    iva_cop : DECIMAL(12,2)</text>
    <text x="12" y="192" fill="#10b981" font-size="11" font-weight="bold">    total_cop : DECIMAL(12,2)</text>
    <text x="12" y="212" fill="#cbd5e1" font-size="11">    direccion_entrega : VARCHAR(200)</text>
    <text x="12" y="232" fill="#94a3b8" font-size="10">    fecha_pedido : TIMESTAMP</text>
  </g>

  <!-- ENTITY 5: tbl_facturas_dian (Top Right) -->
  <g transform="translate(920, 120)" filter="url(#shadow)">
    <rect x="0" y="0" width="240" height="200" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="32" rx="8" fill="#b91c1c"/>
    <text x="12" y="21" fill="#ffffff" font-size="12" font-weight="bold">tbl_facturas_dian</text>
    <text x="12" y="52" fill="#ef4444" font-size="11" font-weight="bold">PK  id_factura : INT</text>
    <text x="12" y="72" fill="#38bdf8" font-size="11" font-weight="bold">FK  id_pedido : INT (UQ)</text>
    <text x="12" y="92" fill="#cbd5e1" font-size="11">    numero_factura : VARCHAR(40) (UQ)</text>
    <text x="12" y="112" fill="#cbd5e1" font-size="11">    cufe : VARCHAR(100) (UQ)</text>
    <text x="12" y="132" fill="#cbd5e1" font-size="11">    qr_code_url : VARCHAR(255)</text>
    <text x="12" y="152" fill="#cbd5e1" font-size="11">    monto_total : DECIMAL(12,2)</text>
    <text x="12" y="172" fill="#cbd5e1" font-size="11">    estado_dian : ENUM('ACEPTADA'..)</text>
    <text x="12" y="190" fill="#94a3b8" font-size="10">    fecha_emision : TIMESTAMP</text>
  </g>

  <!-- ENTITY 6: tbl_categorias (Bottom Center-Left) -->
  <g transform="translate(320, 430)" filter="url(#shadow)">
    <rect x="0" y="0" width="240" height="160" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="32" rx="8" fill="#0369a1"/>
    <text x="12" y="21" fill="#ffffff" font-size="12" font-weight="bold">tbl_categorias</text>
    <text x="12" y="52" fill="#ef4444" font-size="11" font-weight="bold">PK  id_categoria : INT</text>
    <text x="12" y="72" fill="#cbd5e1" font-size="11">    nombre_categoria : VARCHAR(60)</text>
    <text x="12" y="92" fill="#cbd5e1" font-size="11">    descripcion : VARCHAR(255)</text>
    <text x="12" y="112" fill="#cbd5e1" font-size="11">    icono_url : VARCHAR(255)</text>
    <text x="12" y="132" fill="#cbd5e1" font-size="11">    orden_visualizacion : INT</text>
    <text x="12" y="150" fill="#94a3b8" font-size="10">    activo : BOOLEAN (TRUE)</text>
  </g>

  <!-- ENTITY 7: tbl_productos_menu (Bottom Center) -->
  <g transform="translate(620, 430)" filter="url(#shadow)">
    <rect x="0" y="0" width="250" height="240" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="32" rx="8" fill="#0284c7"/>
    <text x="12" y="21" fill="#ffffff" font-size="12" font-weight="bold">tbl_productos_menu</text>
    <text x="12" y="52" fill="#ef4444" font-size="11" font-weight="bold">PK  id_producto : INT</text>
    <text x="12" y="72" fill="#38bdf8" font-size="11" font-weight="bold">FK  id_categoria : INT</text>
    <text x="12" y="92" fill="#cbd5e1" font-size="11">    sku : VARCHAR(30) (UQ)</text>
    <text x="12" y="112" fill="#cbd5e1" font-size="11">    nombre_producto : VARCHAR(100)</text>
    <text x="12" y="132" fill="#cbd5e1" font-size="11">    descripcion : TEXT</text>
    <text x="12" y="152" fill="#10b981" font-size="11" font-weight="bold">    precio_unitario : DECIMAL(12,2)</text>
    <text x="12" y="172" fill="#cbd5e1" font-size="11">    tiempo_coccion_min : INT</text>
    <text x="12" y="192" fill="#cbd5e1" font-size="11">    disponible : BOOLEAN</text>
    <text x="12" y="212" fill="#cbd5e1" font-size="11">    stock_disponible : INT</text>
    <text x="12" y="230" fill="#94a3b8" font-size="10">    imagen_url : VARCHAR(255)</text>
  </g>

  <!-- ENTITY 8: tbl_detalle_pedido (Bottom Right) -->
  <g transform="translate(920, 430)" filter="url(#shadow)">
    <rect x="0" y="0" width="240" height="190" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="32" rx="8" fill="#0284c7"/>
    <text x="12" y="21" fill="#ffffff" font-size="12" font-weight="bold">tbl_detalle_pedido</text>
    <text x="12" y="52" fill="#ef4444" font-size="11" font-weight="bold">PK  id_detalle : INT</text>
    <text x="12" y="72" fill="#38bdf8" font-size="11" font-weight="bold">FK  id_pedido : INT</text>
    <text x="12" y="92" fill="#38bdf8" font-size="11" font-weight="bold">FK  id_producto : INT</text>
    <text x="12" y="112" fill="#cbd5e1" font-size="11">    cantidad : INT</text>
    <text x="12" y="132" fill="#cbd5e1" font-size="11">    precio_unitario : DECIMAL(12,2)</text>
    <text x="12" y="152" fill="#cbd5e1" font-size="11">    subtotal_linea : DECIMAL(12,2)</text>
    <text x="12" y="172" fill="#94a3b8" font-size="10">    notas_chef : VARCHAR(150)</text>
  </g>

  <!-- RELATIONSHIP LINES WITH CARDINALITIES -->
  <!-- tbl_roles_permisos (1) to tbl_usuarios (N) -->
  <path d="M 270 190 L 320 190" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="278" y="180" fill="#38bdf8" font-size="11" font-weight="bold">1</text>
  <text x="305" y="180" fill="#38bdf8" font-size="11" font-weight="bold">N</text>

  <!-- tbl_usuarios (1) to tbl_auditoria_logs (N) -->
  <path d="M 330 330 L 330 440 L 280 440" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="335" y="350" fill="#38bdf8" font-size="11" font-weight="bold">1</text>
  <text x="285" y="430" fill="#38bdf8" font-size="11" font-weight="bold">N</text>

  <!-- tbl_usuarios (1) to tbl_pedidos (N) -->
  <path d="M 570 190 L 620 190" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="578" y="180" fill="#38bdf8" font-size="11" font-weight="bold">1</text>
  <text x="605" y="180" fill="#38bdf8" font-size="11" font-weight="bold">N</text>

  <!-- tbl_pedidos (1) to tbl_facturas_dian (1) -->
  <path d="M 870 190 L 920 190" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="878" y="180" fill="#38bdf8" font-size="11" font-weight="bold">1</text>
  <text x="905" y="180" fill="#38bdf8" font-size="11" font-weight="bold">1 (UQ)</text>

  <!-- tbl_categorias (1) to tbl_productos_menu (N) -->
  <path d="M 560 510 L 620 510" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="568" y="500" fill="#38bdf8" font-size="11" font-weight="bold">1</text>
  <text x="605" y="500" fill="#38bdf8" font-size="11" font-weight="bold">N</text>

  <!-- tbl_productos_menu (1) to tbl_detalle_pedido (N) -->
  <path d="M 870 510 L 920 510" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="878" y="500" fill="#38bdf8" font-size="11" font-weight="bold">1</text>
  <text x="905" y="500" fill="#38bdf8" font-size="11" font-weight="bold">N</text>

  <!-- tbl_pedidos (1) to tbl_detalle_pedido (N) -->
  <path d="M 820 370 L 820 460 L 920 460" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="825" y="390" fill="#38bdf8" font-size="11" font-weight="bold">1</text>
  <text x="905" y="450" fill="#38bdf8" font-size="11" font-weight="bold">N</text>

  <!-- FOOTER LEGEND -->
  <rect x="40" y="730" width="1120" height="60" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="755" fill="#f8fafc" font-size="12" font-weight="bold">Convenciones:</text>
  <text x="160" y="755" fill="#ef4444" font-size="11">PK: Llave Primaria (Primary Key)</text>
  <text x="400" y="755" fill="#38bdf8" font-size="11">FK: Llave Foránea (Foreign Key)</text>
  <text x="640" y="755" fill="#f59e0b" font-size="11">UQ: Restricción Única (Unique Index)</text>
  <text x="880" y="755" fill="#10b981" font-size="11">InnoDB: Motor Transaccional ACID</text>
  <text x="60" y="775" fill="#94a3b8" font-size="11">Cumplimiento de la Ley 1581 de 2012: Contraseñas hasheadas con bcrypt e inmutabilidad de facturas electrónicas avaladas ante la DIAN.</text>
</svg>
