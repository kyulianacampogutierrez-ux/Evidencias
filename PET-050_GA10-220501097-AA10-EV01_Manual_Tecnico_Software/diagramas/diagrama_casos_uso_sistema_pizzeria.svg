<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" style="background:#0f172a; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="gradBoundary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gradUseCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="gradActor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Filter for drop shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title Header Bar -->
  <rect x="30" y="25" width="1140" height="70" rx="10" fill="url(#gradHeader)" filter="url(#shadow)"/>
  <text x="50" y="55" fill="#ffffff" font-size="20" font-weight="700">PIZZERÍA GOURMET BELLA ITALIA POPAYÁN - DIAGRAMA DE CASOS DE USO UML</text>
  <text x="50" y="78" fill="#bae6fd" font-size="12.5">Evidencia GA10-220501097-AA10-EV01 | Aprendiz: Karen Yuliana Campo | Ficha: 3186681 | Estándar UML 2.5 &amp; Guía DNP</text>

  <!-- System Boundary Box -->
  <rect x="280" y="120" width="640" height="700" rx="16" fill="url(#gradBoundary)" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
  <rect x="280" y="120" width="640" height="38" rx="16" fill="#1e293b"/>
  <text x="450" y="145" fill="#38bdf8" font-size="14" font-weight="bold" letter-spacing="1">LÍMITE DEL SISTEMA: ECOSISTEMA WEB BELLA ITALIA</text>

  <!-- ACTORS (Left Column) -->
  <!-- Actor 1: Cliente Comensal -->
  <g transform="translate(60, 200)" filter="url(#shadow)">
    <circle cx="80" cy="30" r="18" fill="url(#gradActor)" stroke="#ffffff" stroke-width="2"/>
    <line x1="80" y1="48" x2="80" y2="95" stroke="#38bdf8" stroke-width="4"/>
    <line x1="50" y1="65" x2="110" y2="65" stroke="#38bdf8" stroke-width="4"/>
    <line x1="80" y1="95" x2="55" y2="135" stroke="#38bdf8" stroke-width="4"/>
    <line x1="80" y1="95" x2="105" y2="135" stroke="#38bdf8" stroke-width="4"/>
    <text x="25" y="155" fill="#f8fafc" font-size="13" font-weight="bold">Cliente Comensal</text>
    <text x="35" y="172" fill="#94a3b8" font-size="11">(Web / Salón)</text>
  </g>

  <!-- Actor 2: Administrador -->
  <g transform="translate(60, 490)" filter="url(#shadow)">
    <circle cx="80" cy="30" r="18" fill="url(#gradActor)" stroke="#ffffff" stroke-width="2"/>
    <line x1="80" y1="48" x2="80" y2="95" stroke="#38bdf8" stroke-width="4"/>
    <line x1="50" y1="65" x2="110" y2="65" stroke="#38bdf8" stroke-width="4"/>
    <line x1="80" y1="95" x2="55" y2="135" stroke="#38bdf8" stroke-width="4"/>
    <line x1="80" y1="95" x2="105" y2="135" stroke="#38bdf8" stroke-width="4"/>
    <text x="35" y="155" fill="#f8fafc" font-size="13" font-weight="bold">Administrador</text>
    <text x="20" y="172" fill="#94a3b8" font-size="11">(Gestión Total / Gerencia)</text>
  </g>

  <!-- ACTORS (Right Column) -->
  <!-- Actor 3: Cajero / Facturador -->
  <g transform="translate(980, 160)" filter="url(#shadow)">
    <circle cx="80" cy="30" r="18" fill="url(#gradActor)" stroke="#ffffff" stroke-width="2"/>
    <line x1="80" y1="48" x2="80" y2="95" stroke="#38bdf8" stroke-width="4"/>
    <line x1="50" y1="65" x2="110" y2="65" stroke="#38bdf8" stroke-width="4"/>
    <line x1="80" y1="95" x2="55" y2="135" stroke="#38bdf8" stroke-width="4"/>
    <line x1="80" y1="95" x2="105" y2="135" stroke="#38bdf8" stroke-width="4"/>
    <text x="30" y="155" fill="#f8fafc" font-size="13" font-weight="bold">Cajero / Facturador</text>
    <text x="45" y="172" fill="#94a3b8" font-size="11">(Caja &amp; DIAN)</text>
  </g>

  <!-- Actor 4: Jefe de Cocina -->
  <g transform="translate(980, 390)" filter="url(#shadow)">
    <circle cx="80" cy="30" r="18" fill="url(#gradActor)" stroke="#ffffff" stroke-width="2"/>
    <line x1="80" y1="48" x2="80" y2="95" stroke="#38bdf8" stroke-width="4"/>
    <line x1="50" y1="65" x2="110" y2="65" stroke="#38bdf8" stroke-width="4"/>
    <line x1="80" y1="95" x2="55" y2="135" stroke="#38bdf8" stroke-width="4"/>
    <line x1="80" y1="95" x2="105" y2="135" stroke="#38bdf8" stroke-width="4"/>
    <text x="40" y="155" fill="#f8fafc" font-size="13" font-weight="bold">Jefe de Cocina</text>
    <text x="45" y="172" fill="#94a3b8" font-size="11">(KDS / Horno)</text>
  </g>

  <!-- Actor 5: Domiciliario -->
  <g transform="translate(980, 620)" filter="url(#shadow)">
    <circle cx="80" cy="30" r="18" fill="url(#gradActor)" stroke="#ffffff" stroke-width="2"/>
    <line x1="80" y1="48" x2="80" y2="95" stroke="#38bdf8" stroke-width="4"/>
    <line x1="50" y1="65" x2="110" y2="65" stroke="#38bdf8" stroke-width="4"/>
    <line x1="80" y1="95" x2="55" y2="135" stroke="#38bdf8" stroke-width="4"/>
    <line x1="80" y1="95" x2="105" y2="135" stroke="#38bdf8" stroke-width="4"/>
    <text x="45" y="155" fill="#f8fafc" font-size="13" font-weight="bold">Domiciliario</text>
    <text x="35" y="172" fill="#94a3b8" font-size="11">(Reparto Popayán)</text>
  </g>

  <!-- USE CASES (Ellipses inside Boundary) -->
  <!-- CU-01: Explorar Carta Web -->
  <g transform="translate(320, 180)" filter="url(#shadow)">
    <ellipse cx="140" cy="30" rx="130" ry="26" fill="url(#gradUseCase)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="45" y="34" fill="#ffffff" font-size="12" font-weight="bold">CU-01: Explorar Carta y Precios</text>
  </g>

  <!-- CU-02: Registrar Pedido & Carrito -->
  <g transform="translate(320, 260)" filter="url(#shadow)">
    <ellipse cx="140" cy="30" rx="130" ry="26" fill="url(#gradUseCase)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="38" y="34" fill="#ffffff" font-size="12" font-weight="bold">CU-02: Registrar Pedido y Carrito</text>
  </g>

  <!-- CU-03: Realizar Pago Electrónico -->
  <g transform="translate(320, 340)" filter="url(#shadow)">
    <ellipse cx="140" cy="30" rx="130" ry="26" fill="url(#gradUseCase)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="40" y="34" fill="#ffffff" font-size="12" font-weight="bold">CU-03: Pago Pasarela / Efectivo</text>
  </g>

  <!-- CU-04: Gestionar Comandas Cocina KDS -->
  <g transform="translate(620, 360)" filter="url(#shadow)">
    <ellipse cx="135" cy="30" rx="125" ry="26" fill="url(#gradUseCase)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="32" y="34" fill="#ffffff" font-size="12" font-weight="bold">CU-04: Gestionar Comandas KDS</text>
  </g>

  <!-- CU-05: Emitir Factura Electrónica DIAN -->
  <g transform="translate(620, 230)" filter="url(#shadow)">
    <ellipse cx="135" cy="30" rx="125" ry="26" fill="url(#gradUseCase)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="25" y="34" fill="#ffffff" font-size="12" font-weight="bold">CU-05: Emitir Factura DIAN CUFE</text>
  </g>

  <!-- CU-06: Despacho y Entrega Domicilio -->
  <g transform="translate(620, 520)" filter="url(#shadow)">
    <ellipse cx="135" cy="30" rx="125" ry="26" fill="url(#gradUseCase)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="30" y="34" fill="#ffffff" font-size="12" font-weight="bold">CU-06: Despacho Geolocalizado</text>
  </g>

  <!-- CU-07: Administrar Menú e Inventario -->
  <g transform="translate(320, 540)" filter="url(#shadow)">
    <ellipse cx="140" cy="30" rx="130" ry="26" fill="url(#gradUseCase)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="32" y="34" fill="#ffffff" font-size="12" font-weight="bold">CU-07: Gestionar Menú e Inventario</text>
  </g>

  <!-- CU-08: Auditoría y Cierre de Caja -->
  <g transform="translate(470, 680)" filter="url(#shadow)">
    <ellipse cx="140" cy="30" rx="130" ry="26" fill="url(#gradUseCase)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="35" y="34" fill="#ffffff" font-size="12" font-weight="bold">CU-08: Arqueo Caja y Reportes</text>
  </g>

  <!-- RELATION LINES (Actor to Use Cases) -->
  <!-- Cliente to CU-01, CU-02, CU-03 -->
  <line x1="200" y1="260" x2="330" y2="210" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="200" y1="260" x2="330" y2="285" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="200" y1="260" x2="330" y2="360" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Admin to CU-07, CU-08 -->
  <line x1="200" y1="560" x2="330" y2="565" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="200" y1="560" x2="480" y2="700" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Cajero to CU-02, CU-03, CU-05, CU-08 -->
  <line x1="1020" y1="230" x2="880" y2="250" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="1020" y1="230" x2="590" y2="360" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="1020" y1="230" x2="740" y2="690" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Cocina to CU-04 -->
  <line x1="1020" y1="460" x2="880" y2="390" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Domiciliario to CU-06 -->
  <line x1="1020" y1="690" x2="880" y2="550" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- <<include>> / <<extend>> dashed lines inside boundary -->
  <line x1="460" y1="290" x2="460" y2="340" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="470" y="320" fill="#94a3b8" font-size="10">&lt;&lt;include&gt;&gt;</text>

  <line x1="590" y1="285" x2="630" y2="260" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="560" y="260" fill="#94a3b8" font-size="10">&lt;&lt;include&gt;&gt;</text>

  <line x1="590" y1="300" x2="630" y2="375" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="580" y="345" fill="#94a3b8" font-size="10">&lt;&lt;include&gt;&gt;</text>
</svg>
