<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin:0; padding:0; box-sizing: border-box; }
    body {
      width: 800px;
      height: 500px;
      overflow: hidden;
      background: #FFFFFF;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body>

<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Top Banner -->
  <rect x="40" y="30" width="720" height="65" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="75" cy="62" r="18" fill="#7C3AED"/>
  <text x="75" y="68" font-family="'Segoe UI', sans-serif" font-size="18" text-anchor="middle">🌐</text>
  <text x="110" y="57" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#0F172A">Virtual SENA Learning &amp; Global Remote Collaboration</text>
  <text x="110" y="77" font-family="'Segoe UI', sans-serif" font-size="12" fill="#64748B">Popayán, Cauca, Colombia ➔ Connected Globally to Cloud Teams &amp; Digital Workspaces</text>

  <!-- Left: Popayán Cauca Hub -->
  <g transform="translate(40, 115)">
    <rect width="345" height="345" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="15" y="15" width="315" height="40" rx="8" fill="#F1F5F9"/>
    <text x="30" y="40" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#334155">📍 POPAYÁN, CAUCA (100% VIRTUAL)</text>

    <!-- Central City Icon / Graphic -->
    <circle cx="172" cy="120" r="45" fill="#ECFDF5" stroke="#00A86B" stroke-width="2"/>
    <text x="172" y="130" font-family="'Segoe UI', sans-serif" font-size="34" text-anchor="middle">🏡</text>
    <text x="172" y="185" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">SENA Regional Cauca</text>
    <text x="172" y="205" font-family="'Segoe UI', sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Ficha 228118 • Karen Yuliana Campo</text>

    <!-- Regional strengths -->
    <g transform="translate(15, 230)">
      <rect width="315" height="95" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="15" y="24" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#0F172A">✓ Zero Relocation Overhead</text>
      <text x="15" y="44" font-family="'Segoe UI', sans-serif" font-size="11" fill="#475569">Studying from home reduces living expenses.</text>
      <text x="15" y="66" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#0F172A">✓ High Productivity &amp; Autonomy</text>
      <text x="15" y="84" font-family="'Segoe UI', sans-serif" font-size="11" fill="#475569">Self-directed asynchronous research &amp; coding.</text>
    </g>
  </g>

  <!-- Right: Modern Remote Work Culture -->
  <g transform="translate(415, 115)">
    <rect width="345" height="345" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="15" y="15" width="315" height="40" rx="8" fill="#F1F5F9"/>
    <text x="30" y="40" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#334155">🚀 MODERN SOFTWARE CULTURE</text>

    <!-- Cultural Pillars -->
    <g transform="translate(15, 68)">
      <rect width="315" height="75" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
      <text x="15" y="25" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#1E40AF">1. Asynchronous Git &amp; CI/CD</text>
      <text x="15" y="45" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1D4ED8">Pull requests, code reviews, and automated</text>
      <text x="15" y="62" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1D4ED8">testing replace rigid office meetings.</text>
    </g>

    <g transform="translate(15, 155)">
      <rect width="315" height="75" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
      <text x="15" y="25" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#065F46">2. Agile Ceremonies Anywhere</text>
      <text x="15" y="45" font-family="'Segoe UI', sans-serif" font-size="11" fill="#047857">Daily standups, sprint retrospectives,</text>
      <text x="15" y="62" font-family="'Segoe UI', sans-serif" font-size="11" fill="#047857">and backlog grooming conducted virtually.</text>
    </g>

    <g transform="translate(15, 242)">
      <rect width="315" height="85" rx="10" fill="#FFFBEB" stroke="#FDE68A"/>
      <text x="15" y="25" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#92400E">3. Inclusive Tech Ecosystem</text>
      <text x="15" y="45" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B45309">Regional talents compete on global equal</text>
      <text x="15" y="62" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B45309">footing for high-impact engineering roles.</text>
    </g>
  </g>
</svg>

</body>
</html>
