<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin:0; padding:0; box-sizing: border-box; }
    body {
      width: 800px;
      height: 500px;
      overflow: hidden;
      background: #FFFFFF;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body>

<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Left Column: Evolutionary Tech -->
  <g transform="translate(40, 30)">
    <rect width="340" height="440" rx="16" fill="#FFFFFF" stroke="#00A86B" stroke-width="2"/>
    <rect x="0" y="0" width="340" height="55" rx="16" fill="#ECFDF5"/>
    <rect x="0" y="40" width="340" height="15" fill="#ECFDF5"/>
    <circle cx="35" cy="28" r="14" fill="#00A86B"/>
    <text x="35" y="33" font-family="'Segoe UI', sans-serif" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">📈</text>
    <text x="60" y="34" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#065F46">EVOLUTIONARY TECH</text>

    <!-- Content Items -->
    <g transform="translate(20, 80)">
      <rect width="300" height="70" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="15" y="28" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Incremental Enhancement</text>
      <text x="15" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#475569">Continuous optimizations &amp; gradual improvements</text>
    </g>

    <g transform="translate(20, 165)">
      <rect width="300" height="70" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="15" y="28" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Static HTML ➔ Reactive SPAs</text>
      <text x="15" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#475569">Smooth evolution of DOM manipulation tools</text>
    </g>

    <g transform="translate(20, 250)">
      <rect width="300" height="70" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="15" y="28" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#0F172A">CSS3 ➔ Design Systems</text>
      <text x="15" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#475569">Atomic CSS, 8dp grid, tokens &amp; accessible palettes</text>
    </g>

    <g transform="translate(20, 335)">
      <rect width="300" height="75" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
      <text x="15" y="26" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#065F46">KEY METRIC: Low Disruption Risk</text>
      <text x="15" y="46" font-family="'Segoe UI', sans-serif" font-size="11" fill="#047857">Preserves backwards compatibility and</text>
      <text x="15" y="62" font-family="'Segoe UI', sans-serif" font-size="11" fill="#047857">protects legacy investments.</text>
    </g>
  </g>

  <!-- Right Column: Revolutionary Tech -->
  <g transform="translate(420, 30)">
    <rect width="340" height="440" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <rect x="0" y="0" width="340" height="55" rx="16" fill="#EFF6FF"/>
    <rect x="0" y="40" width="340" height="15" fill="#EFF6FF"/>
    <circle cx="35" cy="28" r="14" fill="#2563EB"/>
    <text x="35" y="33" font-family="'Segoe UI', sans-serif" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">⚡</text>
    <text x="60" y="34" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#1E40AF">REVOLUTIONARY TECH</text>

    <!-- Content Items -->
    <g transform="translate(20, 80)">
      <rect width="300" height="70" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="15" y="28" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Paradigm Disruption</text>
      <text x="15" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#475569">Completely replaces obsolete workflows &amp; models</text>
    </g>

    <g transform="translate(20, 165)">
      <rect width="300" height="70" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="15" y="28" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Server Rooms ➔ Cloud Native</text>
      <text x="15" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#475569">Elastic serverless hosting and instant scaling</text>
    </g>

    <g transform="translate(20, 250)">
      <rect width="300" height="70" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="15" y="28" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#0F172A">Manual Coding ➔ Autonomous AI</text>
      <text x="15" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#475569">Agentic pairs, synthesis &amp; automated test suites</text>
    </g>

    <g transform="translate(20, 335)">
      <rect width="300" height="75" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
      <text x="15" y="26" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#1E40AF">KEY METRIC: Transformational ROI</text>
      <text x="15" y="46" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1D4ED8">Requires workforce reskilling and creates</text>
      <text x="15" y="62" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1D4ED8">unprecedented market velocity.</text>
    </g>
  </g>
</svg>

</body>
</html>
