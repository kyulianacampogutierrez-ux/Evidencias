<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin:0; padding:0; box-sizing: border-box; }
    body {
      width: 800px;
      height: 500px;
      overflow: hidden;
      background: #FFFFFF;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body>

<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Subtle decorative grid -->
  <g opacity="0.15">
    <path d="M 0 100 H 800 M 0 200 H 800 M 0 300 H 800 M 0 400 H 800" stroke="#00A86B" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M 160 0 V 500 M 320 0 V 500 M 480 0 V 500 M 640 0 V 500" stroke="#2563EB" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Central Visual Card: Tech Stack Evolution -->
  <rect x="50" y="40" width="700" height="420" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- SENA Institutional Ribbon -->
  <rect x="70" y="60" width="220" height="38" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
  <circle cx="90" cy="79" r="10" fill="#00A86B"/>
  <text x="110" y="85" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#065F46">SENA • REGIONAL CAUCA</text>

  <!-- Virtual Modality Pill -->
  <rect x="510" y="60" width="220" height="38" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <circle cx="530" cy="79" r="10" fill="#2563EB"/>
  <text x="548" y="85" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#1E40AF">100% VIRTUAL • POPAYÁN</text>

  <!-- Big Central Tech Evolution Diagram -->
  <g transform="translate(80, 130)">
    <!-- Stage 1: Legacy Code -->
    <rect x="0" y="0" width="180" height="190" rx="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="15" y="15" width="150" height="28" rx="6" fill="#E2E8F0"/>
    <text x="90" y="34" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">1. MONOLITHIC</text>
    <circle cx="90" cy="95" r="35" fill="#E2E8F0"/>
    <text x="90" y="103" font-family="'Segoe UI', sans-serif" font-size="28" text-anchor="middle">🏛️</text>
    <text x="90" y="155" font-family="'Segoe UI', sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Physical Servers</text>
    <text x="90" y="172" font-family="'Segoe UI', sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Rigid Architecture</text>

    <!-- Arrow 1 -->
    <g transform="translate(195, 80)">
      <circle cx="15" cy="15" r="18" fill="#ECFDF5" stroke="#10B981"/>
      <path d="M 8 15 H 22 M 16 9 L 22 15 L 16 21" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Stage 2: Reactive Web SPA -->
    <rect x="240" y="0" width="180" height="190" rx="14" fill="#ECFDF5" stroke="#34D399" stroke-width="1.5"/>
    <rect x="255" y="15" width="150" height="28" rx="6" fill="#D1FAE5"/>
    <text x="330" y="34" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#065F46" text-anchor="middle">2. REACTIVE SPA</text>
    <circle cx="330" cy="95" r="35" fill="#A7F3D0"/>
    <text x="330" y="103" font-family="'Segoe UI', sans-serif" font-size="28" text-anchor="middle">⚡</text>
    <text x="330" y="155" font-family="'Segoe UI', sans-serif" font-size="11" fill="#047857" text-anchor="middle">Bella Italia Web App</text>
    <text x="330" y="172" font-family="'Segoe UI', sans-serif" font-size="11" fill="#047857" text-anchor="middle">Component-Driven</text>

    <!-- Arrow 2 -->
    <g transform="translate(435, 80)">
      <circle cx="15" cy="15" r="18" fill="#EFF6FF" stroke="#3B82F6"/>
      <path d="M 8 15 H 22 M 16 9 L 22 15 L 16 21" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Stage 3: Autonomous Cloud & AI -->
    <rect x="480" y="0" width="180" height="190" rx="14" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
    <rect x="495" y="15" width="150" height="28" rx="6" fill="#DBEAFE"/>
    <text x="570" y="34" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#1E40AF" text-anchor="middle">3. CLOUD &amp; AI</text>
    <circle cx="570" cy="95" r="35" fill="#BFDBFE"/>
    <text x="570" y="103" font-family="'Segoe UI', sans-serif" font-size="28" text-anchor="middle">🤖</text>
    <text x="570" y="155" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1D4ED8" text-anchor="middle">Agentic Code &amp; Edge</text>
    <text x="570" y="172" font-family="'Segoe UI', sans-serif" font-size="11" fill="#1D4ED8" text-anchor="middle">Continuous Delivery</text>
  </g>

  <!-- Footer Banner inside Card -->
  <rect x="80" y="360" width="640" height="60" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="110" y="395" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#1E293B">APPRENTICE:</text>
  <text x="210" y="395" font-family="'Segoe UI', sans-serif" font-size="14" fill="#334155">Karen Yuliana Campo • Ficha 228118 • ADSO</text>
  <rect x="580" y="375" width="125" height="30" rx="6" fill="#00A86B"/>
  <text x="642" y="395" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">B1.2+ LEVEL</text>
</svg>

</body>
</html>
