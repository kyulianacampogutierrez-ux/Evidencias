<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin:0; padding:0; box-sizing: border-box; }
    body {
      width: 800px;
      height: 500px;
      overflow: hidden;
      background: #FFFFFF;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body>

<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Left: Traditional Workflow -->
  <g transform="translate(40, 30)">
    <rect width="340" height="440" rx="16" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="55" rx="16" fill="#FEF2F2"/>
    <circle cx="35" cy="28" r="14" fill="#EF4444"/>
    <text x="35" y="33" font-family="'Segoe UI', sans-serif" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">✕</text>
    <text x="60" y="34" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#991B1B">TRADITIONAL MANUAL PIZZERIA</text>

    <g transform="translate(20, 80)">
      <rect width="300" height="70" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="15" y="28" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#0F172A">📞 Phone Orders &amp; Busy Lines</text>
      <text x="15" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#475569">Customers wait on hold; lost peak-hour sales.</text>
    </g>

    <g transform="translate(20, 165)">
      <rect width="300" height="70" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="15" y="28" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#0F172A">📝 Handwritten Paper Slips</text>
      <text x="15" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#475569">Kitchen misreads toppings; cooking errors.</text>
    </g>

    <g transform="translate(20, 250)">
      <rect width="300" height="70" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="15" y="28" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#0F172A">⏱️ Blind Order Tracking</text>
      <text x="15" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#475569">Customers call repeatedly asking where pizza is.</text>
    </g>

    <g transform="translate(20, 335)">
      <rect width="300" height="75" rx="10" fill="#FEF2F2" stroke="#FECACA"/>
      <text x="15" y="26" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#991B1B">OUTCOME: Bottlenecks &amp; Waste</text>
      <text x="15" y="46" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B91C1C">High operational overhead, 25% order</text>
      <text x="15" y="62" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B91C1C">friction, and customer dissatisfaction.</text>
    </g>
  </g>

  <!-- Right: Bella Italia Modern SPA -->
  <g transform="translate(420, 30)">
    <rect width="340" height="440" rx="16" fill="#FFFFFF" stroke="#00A86B" stroke-width="2"/>
    <rect x="0" y="0" width="340" height="55" rx="16" fill="#ECFDF5"/>
    <circle cx="35" cy="28" r="14" fill="#00A86B"/>
    <text x="35" y="33" font-family="'Segoe UI', sans-serif" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">🍕</text>
    <text x="60" y="34" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#065F46">PIZZERÍA BELLA ITALIA SPA</text>

    <g transform="translate(20, 80)">
      <rect width="300" height="70" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="15" y="28" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#0F172A">🛒 Instant Cart &amp; Free Shipping</text>
      <text x="15" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#475569">Real-time calculations with $80,000 threshold.</text>
    </g>

    <g transform="translate(20, 165)">
      <rect width="300" height="70" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="15" y="28" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#0F172A">👨‍🍳 Kitchen Kanban Flow</text>
      <text x="15" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#475569">State machine: En Preparación ➔ Camino ➔ Entregado.</text>
    </g>

    <g transform="translate(20, 250)">
      <rect width="300" height="70" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="15" y="28" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#0F172A">🔒 Role-Based Access Control</text>
      <text x="15" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#475569">Dedicated client catalog vs admin metrics dashboard.</text>
    </g>

    <g transform="translate(20, 335)">
      <rect width="300" height="75" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
      <text x="15" y="26" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#065F46">OUTCOME: 99.8% Order Accuracy</text>
      <text x="15" y="46" font-family="'Segoe UI', sans-serif" font-size="11" fill="#047857">Zero lost tickets, instant status updates,</text>
      <text x="15" y="62" font-family="'Segoe UI', sans-serif" font-size="11" fill="#047857">and streamlined delivery dispatching.</text>
    </g>
  </g>
</svg>

</body>
</html>
