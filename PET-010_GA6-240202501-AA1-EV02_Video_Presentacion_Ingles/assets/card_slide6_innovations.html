<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin:0; padding:0; box-sizing: border-box; }
    body {
      width: 800px;
      height: 500px;
      overflow: hidden;
      background: #FFFFFF;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body>

<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Top Title -->
  <rect x="40" y="25" width="720" height="50" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="60" y="56" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#0F172A">🔭 Emerging Innovations &amp; Next-Gen Software Technologies</text>

  <!-- 4 Radar Cards -->
  <g transform="translate(40, 95)">
    <!-- Card 1: Agentic AI -->
    <rect width="345" height="175" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="15" y="15" width="315" height="35" rx="8" fill="#F5F3FF"/>
    <circle cx="35" cy="32" r="10" fill="#7C3AED"/>
    <text x="55" y="38" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#5B21B6">1. AGENTIC AI &amp; COPILOTS</text>
    <text x="20" y="75" font-family="'Segoe UI', sans-serif" font-size="12" fill="#1E293B">• Multi-agent orchestration for code creation</text>
    <text x="20" y="98" font-family="'Segoe UI', sans-serif" font-size="12" fill="#1E293B">• Autonomous unit test generation (TDD)</text>
    <text x="20" y="121" font-family="'Segoe UI', sans-serif" font-size="12" fill="#1E293B">• Real-time bug detection and refactoring</text>
    <rect x="20" y="136" width="305" height="25" rx="6" fill="#F5F3FF"/>
    <text x="30" y="153" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#6D28D9">Impact: 40% faster developer cycle velocity</text>
  </g>

  <g transform="translate(415, 95)">
    <!-- Card 2: Serverless & Edge -->
    <rect width="345" height="175" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <rect x="15" y="15" width="315" height="35" rx="8" fill="#EFF6FF"/>
    <circle cx="35" cy="32" r="10" fill="#2563EB"/>
    <text x="55" y="38" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#1E40AF">2. SERVERLESS &amp; EDGE COMPUTING</text>
    <text x="20" y="75" font-family="'Segoe UI', sans-serif" font-size="12" fill="#1E293B">• Zero idle infrastructure cost (Pay-per-use)</text>
    <text x="20" y="98" font-family="'Segoe UI', sans-serif" font-size="12" fill="#1E293B">• Edge CDN computing close to users (&lt;20ms)</text>
    <text x="20" y="121" font-family="'Segoe UI', sans-serif" font-size="12" fill="#1E293B">• Global high availability without sysadmin load</text>
    <rect x="20" y="136" width="305" height="25" rx="6" fill="#EFF6FF"/>
    <text x="30" y="153" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#1D4ED8">Impact: Ultra-low latency for Pizzeria apps</text>
  </g>

  <g transform="translate(40, 290)">
    <!-- Card 3: Code-Driven Vector Design -->
    <rect width="345" height="175" rx="14" fill="#FFFFFF" stroke="#00A86B" stroke-width="1.5"/>
    <rect x="15" y="15" width="315" height="35" rx="8" fill="#ECFDF5"/>
    <circle cx="35" cy="32" r="10" fill="#00A86B"/>
    <text x="55" y="38" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#065F46">3. CODE-DRIVEN DESIGN (CRAFT)</text>
    <text x="20" y="75" font-family="'Segoe UI', sans-serif" font-size="12" fill="#1E293B">• DesignCraft &amp; FigCraft programmatic vector</text>
    <text x="20" y="98" font-family="'Segoe UI', sans-serif" font-size="12" fill="#1E293B">• Design tokens synced directly to codebases</text>
    <text x="20" y="121" font-family="'Segoe UI', sans-serif" font-size="12" fill="#1E293B">• Automated presentation and slide rendering</text>
    <rect x="20" y="136" width="305" height="25" rx="6" fill="#ECFDF5"/>
    <text x="30" y="153" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#047857">Impact: Zero design-to-code friction</text>
  </g>

  <g transform="translate(415, 290)">
    <!-- Card 4: DevSecOps & Security -->
    <rect width="345" height="175" rx="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.5"/>
    <rect x="15" y="15" width="315" height="35" rx="8" fill="#FFF7ED"/>
    <circle cx="35" cy="32" r="10" fill="#EA580C"/>
    <text x="55" y="38" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#9A3412">4. DEVSECOPS &amp; AUTOMATED QA</text>
    <text x="20" y="75" font-family="'Segoe UI', sans-serif" font-size="12" fill="#1E293B">• Shift-left automated security vulnerability scans</text>
    <text x="20" y="98" font-family="'Segoe UI', sans-serif" font-size="12" fill="#1E293B">• 100% test coverage with automated runners</text>
    <text x="20" y="121" font-family="'Segoe UI', sans-serif" font-size="12" fill="#1E293B">• Continuous deployment with zero downtime</text>
    <rect x="20" y="136" width="305" height="25" rx="6" fill="#FFF7ED"/>
    <text x="30" y="153" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#C2410C">Impact: Reliable production stability</text>
  </g>
</svg>

</body>
</html>
