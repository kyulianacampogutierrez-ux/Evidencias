<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin:0; padding:0; box-sizing: border-box; }
    body {
      width: 800px;
      height: 500px;
      overflow: hidden;
      background: #FFFFFF;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body>

<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Top grammar title -->
  <rect x="40" y="30" width="720" height="60" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <circle cx="75" cy="60" r="18" fill="#2563EB"/>
  <text x="75" y="66" font-family="'Segoe UI', sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle">🎓</text>
  <text x="110" y="56" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#0F172A">English B1.2+ Grammar Structures in Tech Roadmaps</text>
  <text x="110" y="76" font-family="'Segoe UI', sans-serif" font-size="12" fill="#64748B">Expressing Completed Future Actions vs Ongoing Continuous Milestones</text>

  <!-- Left: Future Perfect -->
  <g transform="translate(40, 110)">
    <rect width="345" height="350" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <rect x="15" y="15" width="315" height="45" rx="8" fill="#EFF6FF"/>
    <text x="30" y="42" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#1E40AF">FUTURE PERFECT</text>
    <text x="210" y="42" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#3B82F6">will have + participle</text>

    <!-- Formula Box -->
    <g transform="translate(15, 75)">
      <rect width="315" height="65" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="12" y="24" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#475569">FORMULA &amp; USAGE:</text>
      <text x="12" y="45" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#1E40AF">Subject + will have + [Past Participle]</text>
    </g>

    <!-- Examples -->
    <g transform="translate(15, 155)">
      <rect width="315" height="85" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
      <text x="12" y="22" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#1E40AF">PROJECT MILESTONE EXAMPLE 1:</text>
      <text x="12" y="42" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#1E293B">"By next semester, our dev team</text>
      <text x="12" y="60" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="bold" fill="#2563EB">will have deployed the cloud API."</text>
      <text x="12" y="76" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748B">✓ Completed before a future deadline.</text>
    </g>

    <g transform="translate(15, 250)">
      <rect width="315" height="85" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="12" y="22" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#334155">CAREER EXAMPLE 2:</text>
      <text x="12" y="42" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#1E293B">"By graduation, Karen</text>
      <text x="12" y="60" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="bold" fill="#059669">will have developed 10 enterprise SPAs."</text>
      <text x="12" y="76" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748B">✓ Tangible achievement accomplished.</text>
    </g>
  </g>

  <!-- Right: Future Perfect Progressive -->
  <g transform="translate(415, 110)">
    <rect width="345" height="350" rx="16" fill="#FFFFFF" stroke="#00A86B" stroke-width="1.5"/>
    <rect x="15" y="15" width="315" height="45" rx="8" fill="#ECFDF5"/>
    <text x="30" y="42" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#065F46">FUTURE PERFECT PROGRESSIVE</text>
    <text x="235" y="42" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#10B981">will have been + -ing</text>

    <!-- Formula Box -->
    <g transform="translate(15, 75)">
      <rect width="315" height="65" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="12" y="24" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#475569">FORMULA &amp; USAGE:</text>
      <text x="12" y="45" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#065F46">Subject + will have been + [Verb-ing]</text>
    </g>

    <!-- Examples -->
    <g transform="translate(15, 155)">
      <rect width="315" height="85" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
      <text x="12" y="22" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#065F46">STUDY DURATION EXAMPLE 1:</text>
      <text x="12" y="42" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#1E293B">"By December, I</text>
      <text x="12" y="60" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="bold" fill="#059669">will have been studying for 18 months."</text>
      <text x="12" y="76" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748B">✓ Ongoing continuous duration emphasized.</text>
    </g>

    <g transform="translate(15, 250)">
      <rect width="315" height="85" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="12" y="22" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#334155">DEV SPRINT EXAMPLE 2:</text>
      <text x="12" y="42" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#1E293B">"By Friday, our team</text>
      <text x="12" y="60" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="bold" fill="#2563EB">will have been coding the UI for 3 weeks."</text>
      <text x="12" y="76" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748B">✓ Progress tracked across time.</text>
    </g>
  </g>
</svg>

</body>
</html>
