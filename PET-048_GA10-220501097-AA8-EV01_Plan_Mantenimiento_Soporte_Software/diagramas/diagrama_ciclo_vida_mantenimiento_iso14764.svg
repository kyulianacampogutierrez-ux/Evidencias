      <text x="15" y="26" fill="#c084fc" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">Mantenimiento Perfectivo</text>
      <text x="15" y="50" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5">• Optimización latencia de checkout</text>
      <text x="15" y="70" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5">• Mejoras de UX visual en catálogo</text>
      <text x="15" y="90" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5">• Compresión de imágenes WebP</text>
      <text x="15" y="110" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5">• Refactorización de código limpio</text>
      <text x="15" y="134" fill="#ddd6fe" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">Meta: Lighthouse Score &gt; 95</text>
