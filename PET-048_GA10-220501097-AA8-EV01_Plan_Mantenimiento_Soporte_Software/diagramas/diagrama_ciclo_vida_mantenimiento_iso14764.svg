      <rect width="170" height="30" rx="6" fill="#0284c7"/>
      <text x="85" y="20" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">1. IMPLEMENTACIÓN</text>
      <text x="10" y="52" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10">• Planes y políticas</text>
      <text x="10" y="70" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10">• Asignación de roles</text>
      <text x="10" y="88" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10">• Entornos Staging</text>
      <text x="10" y="106" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10">• Control de versiones</text>
      <text x="10" y="124" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10">• Bitácora de HelpDesk</text>
      <text x="10" y="152" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">Estado: Activo</text>
    </g>

    <!-- Flecha 1 -->
    <path d="M 200 130 L 214 130" stroke="#38bdf8" stroke-width="2.5" fill="none"/>

    <!-- Proceso 2 -->
    <g transform="translate(216, 45)">
      <rect width="170" height="170" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1.2"/>
      <rect width="170" height="30" rx="6" fill="#d97706"/>
      <text x="85" y="20" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">2. ANÁLISIS MODIFICACIÓN</text>
      <text x="10" y="52" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10">• Recepción de RFC</text>
      <text x="10" y="70" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10">• Clasificación de fallas</text>
      <text x="10" y="88" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10">• Matriz de severidad</text>
      <text x="10" y="106" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10">• Evaluación de impacto</text>
      <text x="10" y="124" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10">• Aprobación formal</text>
      <text x="10" y="152" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">Severidad: P1 a P4</text>
    </g>

    <!-- Flecha 2 -->
    <path d="M 392 130 L 406 130" stroke="#fbbf24" stroke-width="2.5" fill="none"/>

    <!-- Proceso 3 -->
    <g transform="translate(408, 45)">
