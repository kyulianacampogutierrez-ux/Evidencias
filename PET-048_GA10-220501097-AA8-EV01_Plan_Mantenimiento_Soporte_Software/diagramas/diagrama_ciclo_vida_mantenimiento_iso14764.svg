      <text x="15" y="50" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5">• Resolución de bugs e incidentes</text>
      <text x="15" y="70" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5">• Atención de tickets según SLA</text>
      <text x="15" y="90" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5">• Despliegue de hotfixes críticos</text>
      <text x="15" y="110" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5">• Pruebas de estrés y no-regresión</text>
      <text x="15" y="134" fill="#fca5a5" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">MTTR Objetivo: &lt; 2 horas (P1)</text>
    </g>

    <!-- Tarjeta Adaptativo -->
    <g transform="translate(24, 218)">
      <rect width="245" height="150" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1.2"/>
      <text x="15" y="26" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">Mantenimiento Adaptativo</text>
      <text x="15" y="50" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5">• Actualización normativa (Impoconsumo)</text>
      <text x="15" y="70" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5">• Nuevas versiones PHP 8.3+ y MySQL</text>
      <text x="15" y="90" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5">• Cambios en APIs pasarelas de pago</text>
      <text x="15" y="110" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5">• Adaptación a nuevos smartphones</text>
      <text x="15" y="134" fill="#fde68a" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">Ciclo: Releases semestrales</text>
    </g>

