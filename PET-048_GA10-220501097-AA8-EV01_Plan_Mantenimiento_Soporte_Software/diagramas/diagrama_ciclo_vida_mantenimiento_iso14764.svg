        <circle cx="25" cy="48" r="5" fill="#ef4444"/>
        <text x="38" y="52" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">P1 - Crítica (Caída total):</text>
        <text x="230" y="52" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5">Resp. &lt;15m | Solución &lt;2h (MTTR)</text>

        <circle cx="25" cy="78" r="5" fill="#f97316"/>
        <text x="38" y="82" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">P2 - Alta (Degradación/Pagos):</text>
        <text x="230" y="82" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5">Resp. &lt;30m | Solución &lt;4h</text>

        <circle cx="25" cy="108" r="5" fill="#eab308"/>
        <text x="38" y="112" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">P3 - Media (Falla UI parcial):</text>
        <text x="230" y="112" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5">Resp. &lt;2h  | Solución &lt;24h</text>

        <circle cx="25" cy="138" r="5" fill="#3b82f6"/>
        <text x="38" y="142" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">P4 - Baja (Mejora/Cosmético):</text>
        <text x="230" y="142" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5">Resp. &lt;8h  | Solución &lt;72h</text>

        <text x="15" y="168" fill="#10b981" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">
