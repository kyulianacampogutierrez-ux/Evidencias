      <text x="15" y="90" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5">• Optimización tablas MySQL</text>
      <text x="15" y="110" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5">• Renovación certbot TLS 1.3</text>
      <text x="15" y="134" fill="#a7f3d0" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">Frecuencia: Semanal / Quincenal</text>
    </g>

