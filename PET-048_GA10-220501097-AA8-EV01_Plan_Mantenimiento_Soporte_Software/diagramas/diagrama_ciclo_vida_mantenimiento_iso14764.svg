    CICLO DE VIDA DE MANTENIMIENTO Y SOPORTE DE SOFTWARE - NORMA ISO/IEC 14764
  </text>
  <text x="50" y="92" fill="#e0f2fe" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500">
    Evidencia GA10-220501097-AA8-EV01 | Pizzería Gourmet Bella Italia Popayán | Aprendiz: Karen Yuliana Campo - Ficha 3186681 (SENA CTPI)
  </text>

  <!-- FASE 1: LOS 6 PROCESOS DEL CICLO DE VIDA ISO/IEC 14764 -->
  <g transform="translate(30, 135)" filter="url(#shadowBox)">
