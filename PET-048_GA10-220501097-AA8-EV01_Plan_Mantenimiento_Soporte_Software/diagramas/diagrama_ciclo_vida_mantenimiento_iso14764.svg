      <text x="10" y="88" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10">• Retención Ley 1581</text>
      <text x="10" y="106" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10">• Borrado seguro</text>
      <text x="10" y="124" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10">• Notificación usuarios</text>
