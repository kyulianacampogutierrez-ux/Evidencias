      <rect width="170" height="30" rx="6" fill="#16a34a"/>
      <text x="85" y="20" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">3. IMPLEMENTACIÓN MOD.</text>
      <text x="10" y="52" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10">• Codificación hotfix</text>
      <text x="10" y="70" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10">• Optimización índices</text>
      <text x="10" y="88" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10">• Pruebas unitarias</text>
      <text x="10" y="106" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10">• Documentación técnica</text>
      <text x="10" y="124" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10">• Control de cambios Git</text>
      <text x="10" y="152" fill="#4ade80" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">Cero regresión</text>
