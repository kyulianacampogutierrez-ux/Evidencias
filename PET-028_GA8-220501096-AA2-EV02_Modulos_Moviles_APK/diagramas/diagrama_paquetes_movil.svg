<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI',system-ui,sans-serif;">
  <defs>
    <linearGradient id="pkgHeaderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="pkgShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="1060" height="60" rx="8" fill="url(#pkgHeaderGrad)" filter="url(#pkgShadow)"/>
  <text x="550" y="45" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">DIAGRAMA DE PAQUETES - ARQUITECTURA MODULAR APLICACIÓN MÓVIL</text>
  <text x="550" y="65" text-anchor="middle" fill="#ccfbf1" font-size="12">co.edu.sena.pizzeriabellaitalia | React Native 0.76+ (Hermes) &amp; Java Nativo Android 14+ (API 34)</text>

  <!-- Paquete Principal -->
  <g transform="translate(40, 100)" filter="url(#pkgShadow)">
    <rect width="1020" height="660" rx="10" fill="#f8fafc" stroke="#0d9488" stroke-width="2"/>
    <path d="M 0,0 L 280,0 L 300,30 L 1020,30 L 1020,660 L 0,660 Z" fill="#f8fafc" stroke="#0d9488" stroke-width="2"/>
    <rect x="15" y="5" width="260" height="25" fill="#0d9488" rx="4"/>
    <text x="145" y="22" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">package co.edu.sena.pizzeriabellaitalia</text>

    <!-- Subpaquete 1: presentation.screens -->
    <g transform="translate(30, 50)">
      <rect width="450" height="170" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
      <path d="M 0,0 L 200,0 L 215,22 L 450,22 L 450,170 L 0,170 Z" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
      <rect x="5" y="3" width="190" height="18" fill="#3b82f6" rx="3"/>
      <text x="100" y="16" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">package presentation.screens</text>
      <text x="20" y="45" fill="#1e293b" font-size="11">• <tspan font-weight="bold">SplashScreen:</tspan> Bienvenida, carga de fuentes y verificación JWT</text>
      <text x="20" y="68" fill="#1e293b" font-size="11">• <tspan font-weight="bold">HomeScreen:</tspan> Menú interactivo, categorías y pizzas destacadas</text>
      <text x="20" y="91" fill="#1e293b" font-size="11">• <tspan font-weight="bold">CartScreen:</tspan> Carrito, selector de porciones y cupón SENA2026</text>
      <text x="20" y="114" fill="#1e293b" font-size="11">• <tspan font-weight="bold">CheckoutScreen:</tspan> Pasarela de pagos Nequi/Daviplata/PSE</text>
      <text x="20" y="137" fill="#1e293b" font-size="11">• <tspan font-weight="bold">TrackingScreen:</tspan> Trazabilidad de estados de pedido en tiempo real</text>
      <text x="20" y="157" fill="#1e293b" font-size="11">• <tspan font-weight="bold">AdminDashboardScreen:</tspan> Métricas operativas y cambio de estado</text>
    </g>

    <!-- Subpaquete 2: presentation.components -->
    <g transform="translate(510, 50)">
      <rect width="480" height="170" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
      <path d="M 0,0 L 220,0 L 235,22 L 480,22 L 480,170 L 0,170 Z" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
      <rect x="5" y="3" width="210" height="18" fill="#3b82f6" rx="3"/>
      <text x="110" y="16" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">package presentation.components</text>
      <text x="20" y="45" fill="#1e293b" font-size="11">• <tspan font-weight="bold">PizzaCard:</tspan> Tarjeta con foto, precio dinámico y badges</text>
      <text x="20" y="68" fill="#1e293b" font-size="11">• <tspan font-weight="bold">PizzaModal:</tspan> Selector de tamaño (Personal/Mediana/Familiar)</text>
      <text x="20" y="91" fill="#1e293b" font-size="11">• <tspan font-weight="bold">CategoryTabs:</tspan> Filtros Clásicas, Gourmet, Especiales, Postres</text>
      <text x="20" y="114" fill="#1e293b" font-size="11">• <tspan font-weight="bold">OrderTimeline:</tspan> Componente visual de 5 etapas de preparación</text>
      <text x="20" y="137" fill="#1e293b" font-size="11">• <tspan font-weight="bold">AuthModal:</tspan> Formulario de inicio de sesión y registro de clientes</text>
      <text x="20" y="157" fill="#1e293b" font-size="11">• <tspan font-weight="bold">PaymentMethodSelector:</tspan> Opciones de pago seguras</text>
    </g>

    <!-- Subpaquete 3: business.context & hooks -->
    <g transform="translate(30, 240)">
      <rect width="450" height="160" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
      <path d="M 0,0 L 200,0 L 215,22 L 450,22 L 450,160 L 0,160 Z" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
      <rect x="5" y="3" width="190" height="18" fill="#10b981" rx="3"/>
      <text x="100" y="16" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">package business.context_hooks</text>
      <text x="20" y="45" fill="#1e293b" font-size="11">• <tspan font-weight="bold">AuthContext:</tspan> Token JWT, usuario actual, rol ADMIN/CLIENTE</text>
      <text x="20" y="70" fill="#1e293b" font-size="11">• <tspan font-weight="bold">CartContext:</tspan> Lista de items, cálculo de subtotal y cupón</text>
      <text x="20" y="95" fill="#1e293b" font-size="11">• <tspan font-weight="bold">useLiveTracking:</tspan> Polling y actualización de estados del pedido</text>
      <text x="20" y="120" fill="#1e293b" font-size="11">• <tspan font-weight="bold">usePizzasCatalog:</tspan> Consulta, filtrado y caché local de carta</text>
      <text x="20" y="145" fill="#1e293b" font-size="11">• <tspan font-weight="bold">Validators:</tspan> Validaciones de teléfono, cédula y cupón</text>
    </g>

    <!-- Subpaquete 4: data.services & storage -->
    <g transform="translate(510, 240)">
      <rect width="480" height="160" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
      <path d="M 0,0 L 210,0 L 225,22 L 480,22 L 480,160 L 0,160 Z" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="5" y="3" width="200" height="18" fill="#f59e0b" rx="3"/>
      <text x="105" y="16" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">package data.services_storage</text>
      <text x="20" y="45" fill="#1e293b" font-size="11">• <tspan font-weight="bold">ApiClient:</tspan> Cliente HTTP Axios/Fetch configurado con timeouts</text>
      <text x="20" y="70" fill="#1e293b" font-size="11">• <tspan font-weight="bold">AuthService:</tspan> Endpoints /api/auth/login, /register, /profile</text>
      <text x="20" y="95" fill="#1e293b" font-size="11">• <tspan font-weight="bold">OrderService:</tspan> Endpoints /api/pedidos, /pagos/procesar, /cupones</text>
      <text x="20" y="120" fill="#1e293b" font-size="11">• <tspan font-weight="bold">LocalStorageManager:</tspan> Wrapper de AsyncStorage para carrito</text>
      <text x="20" y="145" fill="#1e293b" font-size="11">• <tspan font-weight="bold">SecureStorage:</tspan> Almacén de token JWT en keychain móvil</text>
    </g>

    <!-- Subpaquete 5: Java Nativo Android (app_nativa_android) -->
    <g transform="translate(30, 420)">
      <rect width="960" height="210" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
      <path d="M 0,0 L 320,0 L 335,22 L 960,22 L 960,210 L 0,210 Z" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
      <rect x="5" y="3" width="310" height="18" fill="#64748b" rx="3"/>
      <text x="160" y="16" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">package co.edu.sena.pizzerianativa (Java Nativo)</text>
      <g transform="translate(20, 35)">
        <text x="0" y="15" fill="#0f172a" font-size="12" font-weight="bold">co.edu.sena.pizzerianativa.MainActivity</text>
        <text x="0" y="32" fill="#475569" font-size="11">Actividad principal de ciclo de vida Android, inicialización de RecyclerView y Toolbar institucional.</text>
        <text x="0" y="60" fill="#0f172a" font-size="12" font-weight="bold">co.edu.sena.pizzerianativa.adapter.PizzaAdapter</text>
        <text x="0" y="77" fill="#475569" font-size="11">Patrón Adapter para el reciclado de vistas CardView y enlace de datos POO en memoria.</text>
        <text x="0" y="105" fill="#0f172a" font-size="12" font-weight="bold">co.edu.sena.pizzerianativa.model.Pizza</text>
        <text x="0" y="122" fill="#475569" font-size="11">Clase POO Java encapsulada con getters, setters y cálculo de moneda COP.</text>
        <text x="0" y="150" fill="#0369a1" font-size="11" font-weight="bold">Distribución: pizzeria-bella-italia-nativa.apk (12 MB) | minSdk 34 (Android 14+) | targetSdk 34</text>
      </g>
    </g>
  </g>
</svg>
