<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600">
  <defs>
    <linearGradient id="bgGradEnvIshi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="headEnvGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadowEnvIshi" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1100" height="600" fill="url(#bgGradEnvIshi)"/>

  <!-- Main Header -->
  <rect x="30" y="15" width="1040" height="60" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadowEnvIshi)"/>
  <rect x="30" y="15" width="8" height="60" rx="4" fill="#10B981"/>
  <text x="50" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="bold" fill="#F8FAFC">DIAGRAMA DE ISHIKAWA AMBIENTAL - ANÁLISIS DE IMPACTOS EN EL PROCESO TEXTIL</text>
  <text x="50" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94A3B8">Causas Raíz del Deterioro Ambiental: Energía, Residuos Peligrosos (RESPEL) y Economía Circular</text>

  <!-- Backbone -->
  <line x1="50" y1="320" x2="840" y2="320" stroke="#10B981" stroke-width="6" stroke-linecap="round"/>
  <polygon points="840,308 865,320 840,332" fill="#10B981"/>

  <!-- Fish Head (Efecto Ambiental) -->
  <path d="M 865 320 L 910 220 L 1070 220 L 1070 420 L 910 420 Z" fill="url(#headEnvGrad)" stroke="#B45309" stroke-width="2" filter="url(#shadowEnvIshi)"/>
  <text x="990" y="260" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">EFECTO / IMPACTO:</text>
  <text x="990" y="285" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FEF08A" text-anchor="middle">HUELLA DE CARBONO</text>
  <text x="990" y="305" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FEF08A" text-anchor="middle">Y CONTAMINACIÓN</text>
  <text x="990" y="330" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">Consumo de energía fósil,</text>
  <text x="990" y="348" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">vertido de retazos y</text>
  <text x="990" y="366" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">riesgo por mercurio</text>
  <rect x="925" y="380" width="130" height="25" rx="4" fill="#78350F"/>
  <text x="990" y="397" font-family="'Courier New', monospace" font-size="8.5" font-weight="bold" fill="#FDE68A" text-anchor="middle">DEC. 1076 DE 2015</text>

  <!-- Top Spine 1: ENERGÍA -->
  <line x1="280" y1="320" x2="160" y2="120" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
  <rect x="80" y="85" width="160" height="32" rx="6" fill="#047857" stroke="#34D399"/>
  <text x="160" y="106" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1. ENERGÍA ELÉCTRICA</text>
  <line x1="220" y1="220" x2="110" y2="220" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="105" y="215" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#E2E8F0">• Iluminación fluorescente obsoleta</text>
  <line x1="250" y1="270" x2="130" y2="270" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="125" y="265" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#E2E8F0">• Sin sensores de presencia en sótano</text>

  <!-- Top Spine 2: RESIDUOS PELIGROSOS (RESPEL) -->
  <line x1="530" y1="320" x2="410" y2="120" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
  <rect x="320" y="85" width="180" height="32" rx="6" fill="#B91C1C" stroke="#F87171"/>
  <text x="410" y="106" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2. RESPEL (MERCURIO) ⚠</text>
  <line x1="470" y1="220" x2="350" y2="220" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="345" y="215" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#FECDD3">• Lámparas quemadas sin plan de manejo</text>
  <line x1="500" y1="270" x2="370" y2="270" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="365" y="265" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#FECDD3">• Riesgo de rotura y lixiviación tóxica</text>

  <!-- Top Spine 3: RESIDUOS TEXTILES -->
  <line x1="770" y1="320" x2="650" y2="120" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
  <rect x="570" y="85" width="160" height="32" rx="6" fill="#047857" stroke="#34D399"/>
  <text x="650" y="106" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3. RESIDUOS SÓLIDOS</text>
  <line x1="710" y1="220" x2="590" y2="220" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="585" y="215" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#E2E8F0">• Retazos mezclados en basura común</text>
  <line x1="740" y1="270" x2="610" y2="270" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="605" y="265" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#E2E8F0">• Omisión del código Res. 2184/2019</text>

  <!-- Bottom Spine 4: RUIDO Y VIBRACIONES -->
  <line x1="280" y1="320" x2="160" y2="500" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
  <rect x="80" y="505" width="160" height="32" rx="6" fill="#047857" stroke="#34D399"/>
  <text x="160" y="526" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4. RUIDO / EMISIONES</text>
  <line x1="220" y1="410" x2="110" y2="410" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="105" y="425" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#E2E8F0">• Ruido reverberante en sótano cerrado</text>
  <line x1="250" y1="365" x2="130" y2="365" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="125" y="380" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#E2E8F0">• Carencia de paneles fonoabsorbentes</text>

  <!-- Bottom Spine 5: QUÍMICOS / ACEITES -->
  <line x1="530" y1="320" x2="410" y2="500" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
  <rect x="320" y="505" width="180" height="32" rx="6" fill="#047857" stroke="#34D399"/>
  <text x="410" y="526" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5. ACEITES / LUBRICANTES</text>
  <line x1="470" y1="410" x2="350" y2="410" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="345" y="425" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#E2E8F0">• Estopas con grasa textil sin recolectar</text>
  <line x1="500" y1="365" x2="370" y2="365" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="365" y="380" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#E2E8F0">• Riesgo de derrame hacia alcantarillado</text>

  <!-- Bottom Spine 6: GESTIÓN AMBIENTAL PIGA -->
  <line x1="770" y1="320" x2="650" y2="500" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
  <rect x="560" y="505" width="180" height="32" rx="6" fill="#B91C1C" stroke="#F87171"/>
  <text x="650" y="526" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6. GESTIÓN PIGA ⚠</text>
  <line x1="710" y1="410" x2="590" y2="410" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="585" y="425" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#FECDD3">• Inexistencia de metas de ecoeficiencia</text>
  <line x1="740" y1="365" x2="610" y2="365" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="605" y="380" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#FECDD3">• Falta de capacitación en segregación</text>

  <!-- Footer -->
  <rect x="30" y="560" width="1040" height="26" rx="4" fill="#047857" fill-opacity="0.3"/>
  <text x="550" y="577" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#86EFAC" text-anchor="middle">SENA ADSO Ficha 3186681 • Aprendiz: Karen Yuliana Campo • Prevención y Control de Impactos Ambientales</text>
</svg>
