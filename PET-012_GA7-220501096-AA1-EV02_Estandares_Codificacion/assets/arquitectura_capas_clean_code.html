<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin:0; padding:0; box-sizing: border-box; }
    body {
      width: 900px;
      height: 550px;
      overflow: hidden;
      background: #FFFFFF;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body>

<svg width="900" height="550" viewBox="0 0 900 550" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="550" rx="20" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Top Title -->
  <rect x="30" y="25" width="840" height="75" rx="14" fill="#0F172A"/>
  <rect x="45" y="40" width="8" height="45" rx="4" fill="#00A86B"/>
  <text x="68" y="55" fill="#00A86B" font-size="12" font-weight="bold" letter-spacing="2">ARQUITECTURA DE SOFTWARE LIMPIA • CLEAN ARCHITECTURE</text>
  <text x="68" y="82" fill="#FFFFFF" font-size="20" font-weight="900">FLUJO MODULAR EN CAPAS &amp; SEPARACIÓN DE RESPONSABILIDADES</text>

  <!-- 4 Layer Horizontal Bars -->
  <!-- Layer 1: Presentación / Frontend -->
  <g transform="translate(30, 115)">
    <rect width="840" height="75" rx="12" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
    <rect x="15" y="15" width="220" height="45" rx="8" fill="#E0F2FE"/>
    <text x="25" y="35" fill="#0284C7" font-size="11" font-weight="800">CAPA 1: PRESENTACIÓN</text>
    <text x="25" y="52" fill="#0369A1" font-size="14" font-weight="bold">React SPA &amp; UI Components</text>
    
    <text x="260" y="38" fill="#334155" font-size="12" font-weight="600">Vistas modulares: <tspan fill="#0284C7" font-family="monospace">MenuPizzasView</tspan>, <tspan fill="#0284C7" font-family="monospace">CarritoDrawer</tspan>, <tspan fill="#0284C7" font-family="monospace">CheckoutModal</tspan></text>
    <text x="260" y="56" fill="#64748B" font-size="11">Valida interfaz en cliente, gestiona eventos DOM y consume REST API vía Axios/Fetch.</text>
  </g>

  <!-- Down Arrow 1 -->
  <path d="M450 195 L450 205 M445 200 L450 205 L455 200" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Layer 2: Controladores / API REST -->
  <g transform="translate(30, 210)">
    <rect width="840" height="75" rx="12" fill="#FFFFFF" stroke="#818CF8" stroke-width="2"/>
    <rect x="15" y="15" width="220" height="45" rx="8" fill="#EEF2FF"/>
    <text x="25" y="35" fill="#4F46E5" font-size="11" font-weight="800">CAPA 2: CONTROLADORES</text>
    <text x="25" y="52" fill="#3730A3" font-size="14" font-weight="bold">Express Routers &amp; DTOs</text>
    
    <text x="260" y="38" fill="#334155" font-size="12" font-weight="600">Rutas HTTP: <tspan fill="#4F46E5" font-family="monospace">POST /api/pedidos</tspan>, <tspan fill="#4F46E5" font-family="monospace">GET /api/pizzas/catalogo</tspan></text>
    <text x="260" y="56" fill="#64748B" font-size="11">Desempaqueta HTTP request, valida esquemas DTO (Joi/Zod), responde códigos 200/400/500.</text>
  </g>

  <!-- Down Arrow 2 -->
  <path d="M450 290 L450 300 M445 295 L450 300 L455 295" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Layer 3: Servicios de Dominio / Negocio -->
  <g transform="translate(30, 305)">
    <rect width="840" height="75" rx="12" fill="#FFFFFF" stroke="#34D399" stroke-width="2"/>
    <rect x="15" y="15" width="220" height="45" rx="8" fill="#ECFDF5"/>
    <text x="25" y="35" fill="#059669" font-size="11" font-weight="800">CAPA 3: SERVICIOS DE DOMINIO</text>
    <text x="25" y="52" fill="#065F46" font-size="14" font-weight="bold">Core Business Logic (POO)</text>
    
    <text x="260" y="38" fill="#334155" font-size="12" font-weight="600">Lógica pura: <tspan fill="#059669" font-family="monospace">PedidoService.crearPedido()</tspan>, <tspan fill="#059669" font-family="monospace">validarStockIngredientes()</tspan></text>
    <text x="260" y="56" fill="#64748B" font-size="11">Reglas de negocio aisladas de la infraestructura. Cálculo de impuestos, combos y promociones.</text>
  </g>

  <!-- Down Arrow 3 -->
  <path d="M450 385 L450 395 M445 390 L450 395 L455 390" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Layer 4: Repositorios & Acceso a Datos -->
  <g transform="translate(30, 400)">
    <rect width="840" height="75" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <rect x="15" y="15" width="220" height="45" rx="8" fill="#FFFBEB"/>
    <text x="25" y="35" fill="#D97706" font-size="11" font-weight="800">CAPA 4: PERSISTENCIA</text>
    <text x="25" y="52" fill="#92400E" font-size="14" font-weight="bold">Repositories &amp; Database</text>
    
    <text x="260" y="38" fill="#334155" font-size="12" font-weight="600">Queries &amp; ORM: <tspan fill="#D97706" font-family="monospace">PedidoRepository.guardar()</tspan>, SQL Scripts, Transacciones ACID</text>
    <text x="260" y="56" fill="#64748B" font-size="11">Conexión a MariaDB/SQLite. Los servicios no saben qué base de datos se usa físicamente.</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="30" y="490" width="840" height="40" rx="10" fill="#0F172A"/>
  <text x="50" y="515" fill="#38BDF8" font-size="12" font-weight="bold">🛡️ PRINCIPIO BOY SCOUT:</text>
  <text x="230" y="515" fill="#FFFFFF" font-size="12" font-weight="500">"Deja siempre el archivo de código más limpio y legible de lo que lo encontraste."</text>
</svg>

</body>
</html>
