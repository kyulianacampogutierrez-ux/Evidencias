<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin:0; padding:0; box-sizing: border-box; }
    body {
      width: 900px;
      height: 550px;
      overflow: hidden;
      background: #FFFFFF;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body>

<svg width="900" height="550" viewBox="0 0 900 550" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="550" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Top Title -->
  <rect x="30" y="25" width="840" height="75" rx="14" fill="#0F172A"/>
  <rect x="45" y="40" width="8" height="45" rx="4" fill="#7C3AED"/>
  <text x="68" y="55" fill="#A78BFA" font-size="12" font-weight="bold" letter-spacing="2">AUTOMATIZACIÓN DE CALIDAD DE CÓDIGO &amp; INTEGRACIÓN CONTINUA</text>
  <text x="68" y="82" fill="#FFFFFF" font-size="20" font-weight="900">PIPELINE AUTOMÁTICO DE PRE-COMMIT HOOKS &amp; LINTERS</text>

  <!-- Flow 5 Steps -->
  <!-- Step 1 -->
  <g transform="translate(30, 120)">
    <rect width="150" height="230" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="18" fill="#3B82F6"/>
    <text x="30" y="41" fill="#FFFFFF" font-size="16" font-weight="bold">1</text>
    <text x="15" y="75" fill="#0F172A" font-size="13" font-weight="bold">Codificación</text>
    <text x="15" y="92" fill="#2563EB" font-size="11" font-weight="600">Desarrollador</text>
    
    <text x="15" y="120" fill="#475569" font-size="11" font-weight="500">Escribe código en VS Code o IDE.</text>
    <text x="15" y="145" fill="#475569" font-size="11" font-weight="500">Ejecuta:</text>
    <rect x="10" y="155" width="130" height="30" rx="6" fill="#0F172A"/>
    <text x="16" y="175" fill="#38BDF8" font-family="monospace" font-size="10">git commit -m "..."</text>
    <text x="15" y="210" fill="#64748B" font-size="10.5">Dispara hook local.</text>
  </g>

  <!-- Arrow 1-2 -->
  <path d="M185 235 L200 235 M195 230 L200 235 L195 240" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Step 2 -->
  <g transform="translate(205, 120)">
    <rect width="150" height="230" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="18" fill="#6366F1"/>
    <text x="30" y="41" fill="#FFFFFF" font-size="16" font-weight="bold">2</text>
    <text x="15" y="75" fill="#0F172A" font-size="13" font-weight="bold">Husky Hook</text>
    <text x="15" y="92" fill="#4F46E5" font-size="11" font-weight="600">Pre-commit Interceptor</text>
    
    <text x="15" y="120" fill="#475569" font-size="11" font-weight="500">Intercepta el comando git antes de crear el objeto commit.</text>
    <rect x="10" y="155" width="130" height="30" rx="6" fill="#0F172A"/>
    <text x="16" y="175" fill="#A5B4FC" font-family="monospace" font-size="10">npx lint-staged</text>
    <text x="15" y="210" fill="#059669" font-size="10.5" font-weight="bold">Filtra archivos en staged.</text>
  </g>

  <!-- Arrow 2-3 -->
  <path d="M360 235 L375 235 M370 230 L375 235 L370 240" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Step 3 -->
  <g transform="translate(380, 120)">
    <rect width="150" height="230" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="18" fill="#F59E0B"/>
    <text x="30" y="41" fill="#FFFFFF" font-size="16" font-weight="bold">3</text>
    <text x="15" y="75" fill="#0F172A" font-size="13" font-weight="bold">Linters &amp; Format</text>
    <text x="15" y="92" fill="#D97706" font-size="11" font-weight="600">ESLint + Prettier</text>
    
    <text x="15" y="120" fill="#475569" font-size="11" font-weight="500">Valida reglas de sintaxis, variables sin uso, y formatea con 2 espacios.</text>
    <rect x="10" y="160" width="130" height="26" rx="6" fill="#FEE2E2"/>
    <text x="16" y="178" fill="#B91C1C" font-size="10" font-weight="bold">¿Error? Bloquea commit</text>
    <text x="15" y="210" fill="#059669" font-size="10.5" font-weight="bold">¿OK? Formatea auto.</text>
  </g>

  <!-- Arrow 3-4 -->
  <path d="M535 235 L550 235 M545 230 L550 235 L545 240" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Step 4 -->
  <g transform="translate(555, 120)">
    <rect width="150" height="230" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="18" fill="#10B981"/>
    <text x="30" y="41" fill="#FFFFFF" font-size="16" font-weight="bold">4</text>
    <text x="15" y="75" fill="#0F172A" font-size="13" font-weight="bold">Pruebas TDD</text>
    <text x="15" y="92" fill="#059669" font-size="11" font-weight="600">Node Test Runner</text>
    
    <text x="15" y="120" fill="#475569" font-size="11" font-weight="500">Ejecuta las pruebas unitarias relacionadas con los cambios.</text>
    <rect x="10" y="155" width="130" height="30" rx="6" fill="#0F172A"/>
    <text x="16" y="175" fill="#34D399" font-family="monospace" font-size="10">pnpm test:staged</text>
    <text x="15" y="210" fill="#059669" font-size="10.5" font-weight="bold">Cero regresiones.</text>
  </g>

  <!-- Arrow 4-5 -->
  <path d="M710 235 L725 235 M720 230 L725 235 L720 240" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Step 5 -->
  <g transform="translate(730, 120)">
    <rect width="140" height="230" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
    <circle cx="35" cy="35" r="18" fill="#00A86B"/>
    <text x="30" y="41" fill="#FFFFFF" font-size="16" font-weight="bold">5</text>
    <text x="15" y="75" fill="#065F46" font-size="13" font-weight="bold">Commit Válido</text>
    <text x="15" y="92" fill="#047857" font-size="11" font-weight="600">Repositorio Seguro</text>
    
    <text x="15" y="120" fill="#14532D" font-size="11" font-weight="500">El commit se crea con mensaje según Conventional Commits.</text>
    <rect x="10" y="160" width="120" height="30" rx="6" fill="#00A86B"/>
    <text x="18" y="180" fill="#FFFFFF" font-size="11" font-weight="bold">✔ READY TO PUSH</text>
    <text x="15" y="210" fill="#047857" font-size="10.5">Hacia rama feature/*</text>
  </g>

  <!-- Bottom Comparison Card -->
  <rect x="30" y="375" width="840" height="145" rx="14" fill="#0F172A"/>
  <text x="50" y="405" fill="#00A86B" font-size="14" font-weight="bold">📋 MATRIZ DE CONFIGURACIÓN AUTOMÁTICA RECOMENDADA:</text>
  
  <rect x="50" y="420" width="245" height="85" rx="8" fill="#1E293B"/>
  <text x="65" y="445" fill="#38BDF8" font-size="13" font-weight="bold">ESLint v9+</text>
  <text x="65" y="465" fill="#94A3B8" font-size="11">• Reglas Airbnb / Recommended</text>
  <text x="65" y="480" fill="#94A3B8" font-size="11">• Prohibir variables no usadas</text>
  <text x="65" y="495" fill="#94A3B8" font-size="11">• Igualdad estricta (===)</text>

  <rect x="315" y="420" width="245" height="85" rx="8" fill="#1E293B"/>
  <text x="330" y="445" fill="#F472B6" font-size="13" font-weight="bold">Prettier v3+</text>
  <text x="330" y="465" fill="#94A3B8" font-size="11">• TabWidth: 2 espacios</text>
  <text x="330" y="480" fill="#94A3B8" font-size="11">• SingleQuote: true</text>
  <text x="330" y="495" fill="#94A3B8" font-size="11">• Semicolons: true obligatorio</text>

  <rect x="580" y="420" width="270" height="85" rx="8" fill="#1E293B"/>
  <text x="595" y="445" fill="#34D399" font-size="13" font-weight="bold">Husky + Lint-staged</text>
  <text x="595" y="465" fill="#94A3B8" font-size="11">• Hook pre-commit ultra rápido</text>
  <text x="595" y="480" fill="#94A3B8" font-size="11">• Solo analiza archivos modificados</text>
  <text x="595" y="495" fill="#94A3B8" font-size="11">• Bloqueo inmediato de commits rotos</text>
</svg>

</body>
</html>
