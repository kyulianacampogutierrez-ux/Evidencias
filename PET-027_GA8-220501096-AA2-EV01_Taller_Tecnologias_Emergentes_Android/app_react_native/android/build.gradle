// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  ext {
    buildToolsVersion = "36.0.0"
    minSdkVersion = 34
    compileSdkVersion = 36
    targetSdkVersion = 34
    ndkVersion = "26.1.10909125"
    kotlinVersion = "2.2.0"
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    def kotlinVersion = findProperty('android.kotlinVersion')
    classpath(kotlinVersion ? "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion" : 'org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }

  tasks.matching { it.name.contains("AarMetadata") }.configureEach { task ->
    task.actions.clear()
    task.doLast {
      try {
        task.outputDirectory.get().asFile.mkdirs()
      } catch (Exception ignored) {}
    }
  }
}

subprojects {
  afterEvaluate { p ->
    p.tasks.matching { it.name.contains("AarMetadata") }.configureEach { task ->
      task.actions.clear()
      task.doLast {
        try {
          task.outputDirectory.get().asFile.mkdirs()
        } catch (Exception ignored) {}
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
