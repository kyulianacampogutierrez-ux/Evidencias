  </text>
  <text x="920" y="315" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#047857">
    [✓] Consumo: ~180 MB RAM
  </text>

  <!-- Red Bridge Interna Docker -->
  <rect x="640" y="335" width="510" height="40" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4,4" />
  <text x="660" y="360" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#0369a1">
    Red Bridge Aislada: red-servicios-cliente-sena (Resolución DNS automática)
  </text>

  <!-- Capa Docker Engine / Runtime -->
  <rect x="640" y="385" width="510" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text x="660" y="412" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">
