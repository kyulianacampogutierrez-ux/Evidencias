  </text>
  <text x="655" y="275" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#155e75">
    • Puerto: 8090:80 (Host:Cont)
  </text>
  <text x="655" y="295" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#155e75">
