  </text>
  <text x="660" y="435" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#1e3a8a">
    Aislamiento a nivel de Kernel mediante Namespaces (PID, NET, IPC) y Control Groups (cgroups)
  </text>

  <!-- Capa Kernel Compartido del Host -->
  <rect x="640" y="465" width="510" height="42" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2" />
  <text x="660" y="491" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#1e293b">
    Kernel Linux Compartido (Sin sobrecarga de emulación de hardware)
  </text>

  <!-- Capa Hardware Físico Subyacente -->
  <rect x="640" y="517" width="510" height="42" rx="8" fill="#cbd5e1" stroke="#475569" stroke-width="1.2" />
  <text x="660" y="543" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">
    Infraestructura de Hardware Físico (CPU, Memoria RAM y Almacenamiento NVMe)
  </text>

  <!-- Métricas Clave Docker -->
  <rect x="640" y="570" width="510" height="38" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="650" y="594" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#047857">
    Métricas Docker: Arranque: ~2-3s | Consumo Total: ~220 MB RAM | Espacio Imagen: ~550 MB
  </text>

  <!-- ========================================================================= -->
  <!-- TABLA COMPARATIVA INFERIOR (RESUMEN EJECUTIVO)                            -->
  <!-- ========================================================================= -->
  <rect x="30" y="635" width="1140" height="140" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
  
  <text x="50" y="660" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#064e3b">
    CUADRO COMPARATIVO TÉCNICO: VIRTUALIZACIÓN BASADA EN HIPERVISOR VS. CONTENEDORES LIGEROS DOCKER
  </text>

  <!-- Fila Encabezados -->
  <rect x="50" y="670" width="1100" height="24" fill="#f1f5f9" />
  <text x="60" y="686" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#334155">CRITERIO EVALUATIVO</text>
  <text x="280" y="686" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a">MÁQUINA VIRTUAL UBUNTU (VIRTUALBOX)</text>
  <text x="650" y="686" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#0e7490">CONTENEDORES DOCKER (APACHE + MYSQL)</text>
  <text x="980" y="686" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#047857">IMPACTO EN CLIENTE</text>

  <!-- Fila 1 -->
  <text x="60" y="710" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#0f172a">Aislamiento y Kernel</text>
  <text x="280" y="710" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#475569">Kernel independiente completo (Fuerte)</text>
  <text x="650" y="710" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#475569">Kernel compartido con Namespaces / cgroups</text>
  <text x="980" y="710" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#047857">Máxima eficiencia</text>

  <!-- Fila 2 -->
  <text x="60" y="730" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#0f172a">Consumo y Eficiencia</text>
  <text x="280" y="730" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#475569">Alto (Asignación rígida 2 GB RAM)</text>
  <text x="650" y="730" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#475569">Mínimo (Demanda dinámica ~220 MB RAM)</text>
  <text x="980" y="730" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#047857">90% Ahorro Recursos</text>

  <!-- Fila 3 -->
  <text x="60" y="750" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#0f172a">Despliegue y Portabilidad</text>
  <text x="280" y="750" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#475569">Lenta (Exportación OVA de 5-15 GB)</text>
  <text x="650" y="750" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#475569">Inmediata (docker compose up -d en segundos)</text>
  <text x="980" y="750" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#047857">100% Cero Polución</text>

  <!-- Fila 4 -->
  <text x="60" y="768" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#64748b">
    ADSO Ficha 3186681 • Centro de Teleinformática y Producción Industrial (CTPI Popayán) • Karen Yuliana Campo
  </text>
</svg>
