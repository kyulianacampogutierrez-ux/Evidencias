  </text>
  <text x="655" y="315" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#047857">
    [✓] Consumo: ~38 MB RAM
  </text>

  <!-- Contenedor 2: MySQL 8.0 -->
  <rect x="905" y="210" width="245" height="115" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5" />
  <text x="920" y="235" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="bold" fill="#047857">
    Contenedor MySQL 8.0
  </text>
  <text x="920" y="255" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#166534">
    • Imagen: mysql:8.0 oficial
  </text>
  <text x="920" y="275" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#166534">
    • Puerto: 3308:3306
  </text>
  <text x="920" y="295" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#166534">
