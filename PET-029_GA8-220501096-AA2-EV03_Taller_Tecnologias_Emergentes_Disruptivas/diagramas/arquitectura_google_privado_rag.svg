<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI',system-ui,sans-serif;">
  <defs>
    <linearGradient id="ragGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="rShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="1060" height="60" rx="8" fill="url(#ragGrad)" filter="url(#rShadow)"/>
  <text x="550" y="45" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">BASES DE CONOCIMIENTO (GOOGLES PRIVADOS): ARQUITECTURA RAG PARA EMPRESAS</text>
  <text x="550" y="65" text-anchor="middle" fill="#ccfbf1" font-size="12">Búsqueda Semántica Vectorial y LLMs Locales | Confidencialidad de Recetas, Costos y Normas Sanitarias</text>

  <!-- Fase 1: Ingestión y Embeddings -->
  <g transform="translate(40, 100)" filter="url(#rShadow)">
    <rect width="280" height="230" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <rect width="280" height="32" rx="8" fill="#059669"/>
    <text x="140" y="22" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">FASE 1: INGESTIÓN Y VECTORIZACIÓN</text>

    <rect x="15" y="45" width="250" height="45" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="25" y="63" fill="#166534" font-size="10" font-weight="bold">Documentos Privados Bella Italia</text>
    <text x="25" y="78" fill="#475569" font-size="9">Manual de Recetas, Protocolos BPM, Costeo</text>

    <text x="140" y="107" text-anchor="middle" font-size="14">⬇</text>
    <rect x="15" y="115" width="250" height="40" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="140" y="132" text-anchor="middle" fill="#166534" font-size="10" font-weight="bold">Chunking &amp; Tokenización</text>
    <text x="140" y="146" text-anchor="middle" fill="#475569" font-size="9">Segmentos de 512 tokens con solapamiento</text>

    <text x="140" y="172" text-anchor="middle" font-size="14">⬇</text>
    <rect x="15" y="180" width="250" height="38" rx="4" fill="#dcfce7" stroke="#86efac"/>
    <text x="140" y="196" text-anchor="middle" fill="#15803d" font-size="10" font-weight="bold">Modelo de Embeddings (BGE / all-MiniLM)</text>
    <text x="140" y="210" text-anchor="middle" fill="#166534" font-size="8.5">Vectores densos de 384 o 768 dimensiones</text>
  </g>

  <!-- Flecha 1 -> Vector DB -->
  <line x1="320" y1="215" x2="380" y2="215" stroke="#059669" stroke-width="2"/>
  <polygon points="375,210 385,215 375,220" fill="#059669"/>

  <!-- Fase 2: Almacén Vectorial -->
  <g transform="translate(390, 100)" filter="url(#rShadow)">
    <rect width="320" height="230" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect width="320" height="32" rx="8" fill="#0284c7"/>
    <text x="160" y="22" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">FASE 2: BASE VECTORIAL ("GOOGLE PRIVADO")</text>

    <circle cx="160" cy="85" r="35" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <text x="160" y="85" text-anchor="middle" font-size="20">🗄️</text>
    <text x="160" y="100" text-anchor="middle" fill="#0369a1" font-size="9" font-weight="bold">Índice HNSW</text>

    <text x="160" y="140" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="bold">ChromaDB / MongoDB Atlas Vector</text>
    <text x="160" y="160" text-anchor="middle" fill="#475569" font-size="10">Búsqueda por Similaridad de Coseno</text>
    <text x="160" y="178" text-anchor="middle" fill="#0284c7" font-size="9.5">Espacio k-NN (k-Nearest Neighbors)</text>

    <rect x="20" y="195" width="280" height="25" rx="4" fill="#e0f2fe"/>
    <text x="160" y="211" text-anchor="middle" fill="#0369a1" font-size="9" font-weight="bold">100% On-Premise: Ningún dato sale a la nube</text>
  </g>

  <!-- Flecha Vector DB -> Fase 3 -->
  <line x1="710" y1="215" x2="770" y2="215" stroke="#0284c7" stroke-width="2"/>
  <polygon points="765,210 775,215 765,220" fill="#0284c7"/>

  <!-- Fase 3: Consulta RAG y LLM -->
  <g transform="translate(780, 100)" filter="url(#rShadow)">
    <rect width="280" height="230" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <rect width="280" height="32" rx="8" fill="#7c3aed"/>
    <text x="140" y="22" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">FASE 3: GENERACIÓN AUMENTADA (RAG)</text>

    <rect x="15" y="45" width="250" height="42" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="25" y="62" fill="#6b21a8" font-size="9.5" font-weight="bold">Pregunta del Empleado o Chef:</text>
    <text x="25" y="78" fill="#334155" font-size="8.5">"¿Cuál es la temperatura y tiempo para masa madre?"</text>

    <text x="140" y="105" text-anchor="middle" font-size="14">⬇</text>
    <rect x="15" y="112" width="250" height="42" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="140" y="128" text-anchor="middle" fill="#6b21a8" font-size="9.5" font-weight="bold">Prompt Aumentado con Fragmentos</text>
    <text x="140" y="144" text-anchor="middle" fill="#475569" font-size="8.5">Contexto verificado + Pregunta</text>

    <text x="140" y="170" text-anchor="middle" font-size="14">⬇</text>
    <rect x="15" y="178" width="250" height="42" rx="4" fill="#ede9fe" stroke="#c084fc"/>
    <text x="140" y="195" text-anchor="middle" fill="#581c87" font-size="9.5" font-weight="bold">LLM Local (Llama 3 / Mistral 7B)</text>
    <text x="140" y="210" text-anchor="middle" fill="#16a34a" font-size="8.5">Respuesta verídica sin alucinaciones</text>
  </g>

  <!-- Comparativa: Google Público vs Google Privado -->
  <g transform="translate(40, 350)" filter="url(#rShadow)">
    <rect width="1020" height="260" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="1020" height="35" rx="8" fill="#0f172a"/>
    <text x="510" y="23" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">COMPARATIVA TÉCNICA: MOTOR PÚBLICO (GOOGLE) VS. MOTOR PRIVADO EMPRESARIAL (RAG)</text>

    <g transform="translate(30, 50)">
      <rect width="460" height="190" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
      <rect width="460" height="28" rx="6" fill="#ef4444"/>
      <text x="230" y="19" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Buscador Público Tradicional (Google)</text>
      <text x="20" y="55" fill="#334155" font-size="10">• <tspan font-weight="bold">Indexación:</tspan> Páginas web públicas indexadas mediante PageRank.</text>
      <text x="20" y="80" fill="#334155" font-size="10">• <tspan font-weight="bold">Confidencialidad:</tspan> NULA. Si se sube una receta secreta, queda expuesta.</text>
      <text x="20" y="105" fill="#334155" font-size="10">• <tspan font-weight="bold">Comprensión:</tspan> Búsqueda basada en palabras clave léxicas (BM25).</text>
      <text x="20" y="130" fill="#334155" font-size="10">• <tspan font-weight="bold">Alucinaciones:</tspan> Respuestas generales que no conocen el negocio local.</text>
      <text x="20" y="155" fill="#334155" font-size="10">• <tspan font-weight="bold">Costo:</tspan> Gratuito a cambio de datos y publicidad comercial.</text>
    </g>

    <g transform="translate(530, 50)">
      <rect width="460" height="190" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
      <rect width="460" height="28" rx="6" fill="#10b981"/>
      <text x="230" y="19" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Base de Conocimiento Privada RAG (Pizzería Bella Italia)</text>
      <text x="20" y="55" fill="#334155" font-size="10">• <tspan font-weight="bold">Indexación:</tspan> Vectores semánticos densos de documentos internos de la empresa.</text>
      <text x="20" y="80" fill="#334155" font-size="10">• <tspan font-weight="bold">Confidencialidad:</tspan> TOTAL. Ejecución en servidores locales y MongoDB cerrado.</text>
      <text x="20" y="105" fill="#334155" font-size="10">• <tspan font-weight="bold">Comprensión:</tspan> Búsqueda por significado, sinónimos y contexto de cocina.</text>
      <text x="20" y="130" fill="#334155" font-size="10">• <tspan font-weight="bold">Alucinaciones:</tspan> CERO. Solo responde con base en las citas textuales de la pizzería.</text>
      <text x="20" y="155" fill="#334155" font-size="10">• <tspan font-weight="bold">Costo:</tspan> Inversión en servidor local sin mensualidades recurrentes a terceros.</text>
    </g>
  </g>
</svg>
