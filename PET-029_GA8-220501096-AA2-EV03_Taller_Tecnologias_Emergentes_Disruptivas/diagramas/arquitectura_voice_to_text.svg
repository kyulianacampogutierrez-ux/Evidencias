<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI',system-ui,sans-serif;">
  <defs>
    <linearGradient id="voiceGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="vShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="1060" height="60" rx="8" fill="url(#voiceGrad)" filter="url(#vShadow)"/>
  <text x="550" y="45" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">ARQUITECTURA VOICE-TO-TEXT: COMANDO DE VOZ PARA PEDIDOS EN TIEMPO REAL</text>
  <text x="550" y="65" text-anchor="middle" fill="#c7d2fe" font-size="12">Integración en Pizzería Gourmet Bella Italia Popayán | Asistente de Voz y Manos Libres en Cocina</text>

  <!-- Paso 1: Captura -->
  <g transform="translate(40, 110)" filter="url(#vShadow)">
    <rect width="180" height="180" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
    <rect width="180" height="30" rx="8" fill="#4f46e5"/>
    <text x="90" y="20" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">1. Captura de Audio</text>
    <circle cx="90" cy="75" r="28" fill="#e0e7ff"/>
    <text x="90" y="82" text-anchor="middle" font-size="24">🎤</text>
    <text x="90" y="125" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="bold">Micrófono Móvil / Auricular</text>
    <text x="90" y="145" text-anchor="middle" fill="#64748b" font-size="10">PCM 16 kHz / 16-bit Mono</text>
    <text x="90" y="160" text-anchor="middle" fill="#4f46e5" font-size="9" font-weight="bold">Cliente o Chef</text>
  </g>

  <!-- Flecha 1 -> 2 -->
  <line x1="220" y1="200" x2="260" y2="200" stroke="#4f46e5" stroke-width="2"/>
  <polygon points="255,195 265,200 255,205" fill="#4f46e5"/>

  <!-- Paso 2: Procesamiento y ASR -->
  <g transform="translate(270, 110)" filter="url(#vShadow)">
    <rect width="240" height="180" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect width="240" height="30" rx="8" fill="#0284c7"/>
    <text x="120" y="20" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">2. Motor ASR (Speech-to-Text)</text>
    <rect x="20" y="45" width="200" height="40" rx="4" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="120" y="62" text-anchor="middle" fill="#0369a1" font-size="11" font-weight="bold">Whisper / Vosk Engine</text>
    <text x="120" y="77" text-anchor="middle" fill="#64748b" font-size="9">Modelo Acústico + Encoder Conformer</text>
    <text x="120" y="110" text-anchor="middle" fill="#0f172a" font-size="10" font-style="italic">"Quiero una pizza Margarita</text>
    <text x="120" y="125" text-anchor="middle" fill="#0f172a" font-size="10" font-style="italic">familiar con borde de queso"</text>
    <text x="120" y="150" text-anchor="middle" fill="#0284c7" font-size="10" font-weight="bold">Transcripción Texto Crudo</text>
  </g>

  <!-- Flecha 2 -> 3 -->
  <line x1="510" y1="200" x2="550" y2="200" stroke="#0284c7" stroke-width="2"/>
  <polygon points="545,195 555,200 545,205" fill="#0284c7"/>

  <!-- Paso 3: NLP & Extracción de Entidades -->
  <g transform="translate(560, 110)" filter="url(#vShadow)">
    <rect width="240" height="180" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <rect width="240" height="30" rx="8" fill="#10b981"/>
    <text x="120" y="20" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">3. NLP &amp; Extracción NER</text>
    <rect x="15" y="45" width="210" height="120" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="25" y="65" fill="#15803d" font-size="10" font-weight="bold">Intent: CREAR_ITEM_PEDIDO</text>
    <text x="25" y="85" fill="#334155" font-size="9">• Entidad Producto: "Margarita"</text>
    <text x="25" y="103" fill="#334155" font-size="9">• Entidad Tamaño: "familiar"</text>
    <text x="25" y="121" fill="#334155" font-size="9">• Entidad Adición: "borde_queso"</text>
    <text x="25" y="139" fill="#334155" font-size="9">• Entidad Cantidad: 1</text>
    <text x="25" y="155" fill="#059669" font-size="9" font-weight="bold">Confianza de Entidad: 98.4%</text>
  </g>

  <!-- Flecha 3 -> 4 -->
  <line x1="800" y1="200" x2="840" y2="200" stroke="#10b981" stroke-width="2"/>
  <polygon points="835,195 845,200 835,205" fill="#10b981"/>

  <!-- Paso 4: Inyección en Carrito y Backend -->
  <g transform="translate(850, 110)" filter="url(#vShadow)">
    <rect width="210" height="180" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <rect width="210" height="30" rx="8" fill="#f59e0b"/>
    <text x="105" y="20" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">4. Despacho al Sistema</text>
    <rect x="15" y="45" width="180" height="85" rx="4" fill="#fffbeb" stroke="#fde68a"/>
    <text x="25" y="65" fill="#b45309" font-size="9" font-family="monospace">POST /api/pedidos</text>
    <text x="25" y="80" fill="#334155" font-size="8" font-family="monospace">&#123;</text>
    <text x="35" y="93" fill="#334155" font-size="8" font-family="monospace">"pizza": "PIZ-001",</text>
    <text x="35" y="106" fill="#334155" font-size="8" font-family="monospace">"tamano": "familiar"</text>
    <text x="25" y="119" fill="#334155" font-size="8" font-family="monospace">&#125;</text>
    <text x="105" y="150" text-anchor="middle" fill="#b45309" font-size="10" font-weight="bold">Go Fiber Backend :8085</text>
    <text x="105" y="165" text-anchor="middle" fill="#16a34a" font-size="9">Actualización UI Carrito</text>
  </g>

  <!-- Caja Inferior: Casos de Uso y Beneficios -->
  <g transform="translate(40, 320)" filter="url(#vShadow)">
    <rect width="1020" height="290" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="1020" height="35" rx="8" fill="#334155"/>
    <text x="510" y="23" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">CASOS DE USO DISRUPTIVOS EN LA PIZZERÍA BELLA ITALIA POPAYÁN</text>

    <g transform="translate(30, 50)">
      <rect width="460" height="105" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="20" y="25" fill="#4338ca" font-size="12" font-weight="bold">A. Modo Accesible y Manos Libres para Clientes</text>
      <text x="20" y="48" fill="#334155" font-size="10.5">El cliente puede ordenar su pizza simplemente hablando desde la aplicación móvil.</text>
      <text x="20" y="68" fill="#334155" font-size="10.5">Elimina fricción en personas con limitaciones motoras, adultos mayores o usuarios</text>
      <text x="20" y="88" fill="#334155" font-size="10.5">que conducen o caminan por Popayán. Tiempo de pedido reducido de 2 min a 15 seg.</text>
    </g>

    <g transform="translate(530, 50)">
      <rect width="460" height="105" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="20" y="25" fill="#0284c7" font-size="12" font-weight="bold">B. Operación Manos Libres en Cocina (Pizzaiolos)</text>
      <text x="20" y="48" fill="#334155" font-size="10.5">Los pizzeros con guantes o harina pueden decir comandos de voz como:</text>
      <text x="20" y="68" fill="#0f172a" font-size="10" font-weight="bold">"Bella Italia, pasar pedido 8191 a EN HORNO" o "Tiempo restante"</text>
      <text x="20" y="88" fill="#334155" font-size="10.5">Evita tocar pantallas sucias, garantizando máxima inocuidad y normas BPM sanitarias.</text>
    </g>

    <g transform="translate(30, 170)">
      <rect width="960" height="100" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="20" y="25" fill="#15803d" font-size="12" font-weight="bold">C. Recursos Requeridos para Implementación Local</text>
      <text x="20" y="48" fill="#334155" font-size="10">• <tspan font-weight="bold">Librería Cliente:</tspan> <code>@react-native-voice/voice</code> o <code>expo-speech</code> en la app móvil para captura de stream de audio.</text>
      <text x="20" y="68" fill="#334155" font-size="10">• <tspan font-weight="bold">Microservicio ASR:</tspan> Contenedor Docker con <code>Faster-Whisper (small / base)</code> o <code>Vosk-Server</code> en servidor local Go/Python.</text>
      <text x="20" y="88" fill="#334155" font-size="10">• <tspan font-weight="bold">Hardware:</tspan> Servidor local con GPU NVIDIA RTX 3060 (12GB VRAM) o CPU Intel i7/Ryzen 7 (inferencia cuantizada int8 &lt; 250ms).</text>
    </g>
  </g>
</svg>
