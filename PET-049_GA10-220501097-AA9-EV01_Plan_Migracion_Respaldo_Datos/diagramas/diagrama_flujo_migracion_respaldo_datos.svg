<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" style="background:#0f172a; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="gradPre" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="grad321" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="gradDuring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="gradPost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="gradRollback" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Filter for drop shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Marker Arrow -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>

  <!-- Background decorative grid lines -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="820" />
    <line x1="200" y1="0" x2="200" y2="820" />
    <line x1="350" y1="0" x2="350" y2="820" />
    <line x1="500" y1="0" x2="500" y2="820" />
    <line x1="650" y1="0" x2="650" y2="820" />
    <line x1="800" y1="0" x2="800" y2="820" />
    <line x1="950" y1="0" x2="950" y2="820" />
    <line x1="1100" y1="0" x2="1100" y2="820" />
  </g>

  <!-- Title Header Bar -->
  <rect x="30" y="25" width="1140" height="75" rx="12" fill="url(#gradHeader)" filter="url(#shadow)"/>
  <text x="50" y="55" fill="#ffffff" font-size="20" font-weight="700">PIZZERÍA GOURMET BELLA ITALIA POPAYÁN - ARQUITECTURA DE MIGRACIÓN Y RESPALDO 3-2-1</text>
  <text x="50" y="80" fill="#bae6fd" font-size="13">Evidencia GA10-220501097-AA9-EV01 | Aprendiz: Karen Yuliana Campo | Ficha: 3186681 | Estándar ISO/IEC/IEEE 14764 &amp; Ley 1581</text>

  <!-- SECTION 1: PRE-MIGRACIÓN & BASELINE (Left Column) -->
  <g transform="translate(40, 125)" filter="url(#shadow)">
    <rect x="0" y="0" width="340" height="310" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="0" width="340" height="42" rx="10" fill="url(#gradPre)"/>
    <text x="15" y="27" fill="#ffffff" font-size="15" font-weight="bold">FASE 1: PRE-MIGRACIÓN &amp; BASELINE</text>
    
    <!-- Item 1 -->
    <rect x="15" y="55" width="310" height="52" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="25" y="75" fill="#e2e8f0" font-size="12" font-weight="bold">1. Congelamiento Operativo (Maintenance Window)</text>
    <text x="25" y="93" fill="#94a3b8" font-size="11">Cierre de sesiones activas y lock de escritura DB</text>

    <!-- Item 2 -->
    <rect x="15" y="117" width="310" height="52" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="25" y="137" fill="#e2e8f0" font-size="12" font-weight="bold">2. Auditoría Previa (Checklist Pre-Migración)</text>
    <text x="25" y="155" fill="#94a3b8" font-size="11">Compatibilidad motor MySQL 8.0, charset utf8mb4</text>

    <!-- Item 3 -->
    <rect x="15" y="179" width="310" height="52" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="25" y="199" fill="#e2e8f0" font-size="12" font-weight="bold">3. Extracción mysqldump Determinístico</text>
    <text x="25" y="217" fill="#94a3b8" font-size="11">--single-transaction --quick --hex-blob --routines</text>

    <!-- Item 4 -->
    <rect x="15" y="241" width="310" height="55" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="25" y="261" fill="#e2e8f0" font-size="12" font-weight="bold">4. Huella Criptográfica SHA-256</text>
    <text x="25" y="280" fill="#38bdf8" font-size="10" font-family="monospace">SHA-256: 4a9e2f... (Inmutabilidad garantizada)</text>
  </g>

  <!-- SECTION 2: ESTRATEGIA DE RESPALDO 3-2-1 (Middle Column) -->
  <g transform="translate(430, 125)" filter="url(#shadow)">
    <rect x="0" y="0" width="340" height="310" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="0" width="340" height="42" rx="10" fill="url(#grad321)"/>
    <text x="15" y="27" fill="#ffffff" font-size="15" font-weight="bold">POLÍTICA DE RESPALDO 3-2-1</text>

    <!-- Copy 1: Primary Local -->
    <rect x="15" y="55" width="310" height="72" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
    <circle cx="35" cy="80" r="12" fill="#8b5cf6"/>
    <text x="31" y="85" fill="#ffffff" font-size="12" font-weight="bold">3</text>
    <text x="58" y="75" fill="#f1f5f9" font-size="12" font-weight="bold">Copia 1: Primaria Local (NVMe Fast Disk)</text>
    <text x="58" y="93" fill="#cbd5e1" font-size="11">RTO &lt; 15 min | RPO &lt; 24h | /backups/local</text>
    <text x="58" y="111" fill="#c084fc" font-size="10">Acceso inmediato para recuperación operativa rápida</text>

    <!-- Copy 2: Secondary Media -->
    <rect x="15" y="137" width="310" height="72" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
    <circle cx="35" cy="162" r="12" fill="#7c3aed"/>
    <text x="31" y="167" fill="#ffffff" font-size="12" font-weight="bold">2</text>
    <text x="58" y="157" fill="#f1f5f9" font-size="12" font-weight="bold">Copia 2: Medio Secundario (NAS / Staging)</text>
    <text x="58" y="175" fill="#cbd5e1" font-size="11">Aislamiento de hardware físico diferente</text>
    <text x="58" y="193" fill="#c084fc" font-size="10">Protege ante fallo de disco primario del host</text>

    <!-- Copy 3: Offsite Cold Storage -->
    <rect x="15" y="219" width="310" height="75" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
    <circle cx="35" cy="246" r="12" fill="#6d28d9"/>
    <text x="31" y="251" fill="#ffffff" font-size="12" font-weight="bold">1</text>
    <text x="58" y="239" fill="#f1f5f9" font-size="12" font-weight="bold">Copia 3: Fuera de Sitio (Cloud Offsite AES-256)</text>
    <text x="58" y="257" fill="#cbd5e1" font-size="11">Almacenamiento geográficamente distante</text>
    <text x="58" y="275" fill="#c084fc" font-size="10">Retención 5 años según Ley 1581 Habeas Data</text>
  </g>

  <!-- SECTION 3: DURANTE LA MIGRACIÓN & INGESTA (Right Column) -->
  <g transform="translate(820, 125)" filter="url(#shadow)">
    <rect x="0" y="0" width="340" height="310" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="0" width="340" height="42" rx="10" fill="url(#gradDuring)"/>
    <text x="15" y="27" fill="#ffffff" font-size="15" font-weight="bold">FASE 2: DURANTE LA MIGRACIÓN (ETL)</text>

    <!-- Step 1 -->
    <rect x="15" y="55" width="310" height="52" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
    <text x="25" y="75" fill="#e2e8f0" font-size="12" font-weight="bold">1. Aprovisionamiento Ambiente Staging</text>
    <text x="25" y="93" fill="#94a3b8" font-size="11">Docker Compose aislado en puertos 8098 / 3313</text>

    <!-- Step 2 -->
    <rect x="15" y="117" width="310" height="52" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
    <text x="25" y="137" fill="#e2e8f0" font-size="12" font-weight="bold">2. Ingesta de Esquemas y Transacciones</text>
    <text x="25" y="155" fill="#94a3b8" font-size="11">Carga sin pérdida de llaves primarias ni foráneas</text>

    <!-- Step 3 -->
    <rect x="15" y="179" width="310" height="52" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
    <text x="25" y="199" fill="#e2e8f0" font-size="12" font-weight="bold">3. Reindexación y Optimización InnoDB</text>
    <text x="25" y="217" fill="#94a3b8" font-size="11">Actualización de estadísticas de índices</text>

    <!-- Step 4 -->
    <rect x="15" y="241" width="310" height="55" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
    <text x="25" y="261" fill="#e2e8f0" font-size="12" font-weight="bold">4. Verificación de Transición sin Fuga</text>
    <text x="25" y="280" fill="#fbbf24" font-size="10">Auditoría en tiempo real de logs de migración</text>
  </g>

  <!-- CONNECTING ARROWS BETWEEN COLUMNS -->
  <line x1="380" y1="280" x2="430" y2="280" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="770" y1="280" x2="820" y2="280" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- FLOW DOWN TO POST-MIGRACIÓN & ROLLBACK -->
  <line x1="990" y1="435" x2="990" y2="480" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- SECTION 4: POST-MIGRACIÓN & AUDITORÍA DE CONCILIACIÓN (Bottom Left/Center) -->
  <g transform="translate(40, 480)" filter="url(#shadow)">
    <rect x="0" y="0" width="730" height="300" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="0" width="730" height="42" rx="10" fill="url(#gradPost)"/>
    <text x="20" y="27" fill="#ffffff" font-size="15" font-weight="bold">FASE 3: POST-MIGRACIÓN, AUDITORÍA Y CONTROL DE CAMBIOS</text>

    <!-- Sub Card 1: Row Count & Hash Check -->
    <rect x="20" y="55" width="335" height="105" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
    <text x="35" y="78" fill="#34d399" font-size="13" font-weight="bold">A. Conciliación de Filas &amp; Integridad</text>
    <text x="35" y="98" fill="#cbd5e1" font-size="11">• Usuarios: 15 / 15 registros idénticos (100%)</text>
    <text x="35" y="116" fill="#cbd5e1" font-size="11">• Productos del Menú: 30 / 30 items activos (100%)</text>
    <text x="35" y="134" fill="#cbd5e1" font-size="11">• Pedidos y Facturas: 120 / 120 comprobantes (100%)</text>
    <text x="35" y="150" fill="#34d399" font-size="10" font-weight="bold">Delta de Discrepancia: 0 filas faltantes (ÉXITO)</text>

    <!-- Sub Card 2: Financial Reconciliation -->
    <rect x="375" y="55" width="335" height="105" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
    <text x="390" y="78" fill="#34d399" font-size="13" font-weight="bold">B. Conciliación Financiera (Ventas COP)</text>
    <text x="390" y="98" fill="#cbd5e1" font-size="11">• Total Ventas Origen: $14.850.000 COP</text>
    <text x="390" y="116" fill="#cbd5e1" font-size="11">• Total Ventas Destino: $14.850.000 COP</text>
    <text x="390" y="134" fill="#cbd5e1" font-size="11">• Diferencia monetaria: $0 COP exacto</text>
    <text x="390" y="150" fill="#34d399" font-size="10" font-weight="bold">Cero inconsistencias en saldos y facturación</text>

    <!-- Sub Card 3: Smoke & Functional Testing -->
    <rect x="20" y="175" width="690" height="105" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
    <text x="35" y="198" fill="#34d399" font-size="13" font-weight="bold">C. Checklist de Revisión de Modificaciones &amp; Pruebas de Humo</text>
    <text x="35" y="218" fill="#cbd5e1" font-size="11">• Autenticación de roles (Admin, Cajero, Cocinero, Domiciliario): Validado OK</text>
    <text x="35" y="236" fill="#cbd5e1" font-size="11">• Inyección de pedidos desde la web (Carrito &amp; Checkout): Validado OK</text>
    <text x="35" y="254" fill="#cbd5e1" font-size="11">• Tiempos de respuesta de base de datos: &lt; 25 ms en queries complejas</text>
    <text x="35" y="270" fill="#10b981" font-size="11" font-weight="bold">Veredicto de Aprobación: APTO PARA PRODUCCIÓN (Go-Live Definitivo)</text>
  </g>

  <!-- SECTION 5: PLAN DE CONTINGENCIA & PROTOCOLO DE ROLLBACK (Bottom Right) -->
  <g transform="translate(800, 480)" filter="url(#shadow)">
    <rect x="0" y="0" width="360" height="300" rx="10" fill="#1e293b" stroke="#7f1d1d" stroke-width="2"/>
    <rect x="0" y="0" width="360" height="42" rx="10" fill="url(#gradRollback)"/>
    <text x="15" y="27" fill="#ffffff" font-size="15" font-weight="bold">PLAN DE CONTINGENCIA &amp; ROLLBACK</text>

    <rect x="15" y="55" width="330" height="225" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
    
    <text x="25" y="80" fill="#f87171" font-size="13" font-weight="bold">¿Fallo Crítico / Corrupción Detectada?</text>
    
    <text x="25" y="105" fill="#e2e8f0" font-size="11" font-weight="bold">1. Decisión de Aborto Inmediato</text>
    <text x="25" y="122" fill="#94a3b8" font-size="10">Si delta de datos &gt; 0 o latencia &gt; 2.0s</text>

    <text x="25" y="145" fill="#e2e8f0" font-size="11" font-weight="bold">2. Desconexión de Tráfico Nuevo</text>
    <text x="25" y="162" fill="#94a3b8" font-size="10">Redirección a pantalla de mantenimiento</text>

    <text x="25" y="185" fill="#e2e8f0" font-size="11" font-weight="bold">3. Restauración Snapshot SHA-256</text>
    <text x="25" y="202" fill="#94a3b8" font-size="10">mysqldump restore desde almacenamiento seguro</text>

    <text x="25" y="225" fill="#e2e8f0" font-size="11" font-weight="bold">4. Retorno a Producción Anterior</text>
    <text x="25" y="242" fill="#94a3b8" font-size="10">Tiempo total de Rollback: 8.5 min (RTO &lt; 15m)</text>

    <rect x="25" y="252" width="310" height="22" rx="4" fill="#7f1d1d"/>
    <text x="35" y="267" fill="#fecaca" font-size="10" font-weight="bold">Pérdida de datos garantizada: 0% (RPO &lt; 24h)</text>
  </g>

  <!-- Connect Post-Migration with Rollback decision -->
  <path d="M 770 530 L 800 530" stroke="#f87171" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-red)"/>
  <text x="772" y="522" fill="#f87171" font-size="10" font-weight="bold">SI FALLA</text>
</svg>
