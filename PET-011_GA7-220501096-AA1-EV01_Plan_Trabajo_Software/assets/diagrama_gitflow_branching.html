<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin:0; padding:0; box-sizing: border-box; }
    body {
      width: 900px;
      height: 550px;
      overflow: hidden;
      background: #FFFFFF;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body>

<svg width="900" height="550" viewBox="0 0 900 550" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="550" rx="20" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Top Title -->
  <rect x="30" y="24" width="840" height="60" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <circle cx="65" cy="54" r="18" fill="#2563EB"/>
  <text x="65" y="60" font-family="'Segoe UI', sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">🌿</text>
  <text x="98" y="49" font-family="'Segoe UI', sans-serif" font-size="17" font-weight="bold" fill="#0F172A">Estrategia de Ramificación GitFlow: Pizzería Bella Italia</text>
  <text x="98" y="70" font-family="'Segoe UI', sans-serif" font-size="12" fill="#64748B">Aislamiento de ramas, Pull Requests protegidos y despliegue continuo controlado</text>

  <!-- Git Branch Tracks -->
  <!-- Track 1: main (Production) -->
  <g transform="translate(40, 110)">
    <rect width="130" height="34" rx="8" fill="#DC2626"/>
    <text x="65" y="22" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">main (v1.0.0)</text>
    <line x1="140" y1="17" x2="820" y2="17" stroke="#DC2626" stroke-width="4" stroke-dasharray="0"/>
    
    <!-- Commits on main -->
    <circle cx="180" cy="17" r="12" fill="#DC2626" stroke="#FFFFFF" stroke-width="3"/>
    <text x="180" y="21" font-family="'Segoe UI', sans-serif" font-size="10" fill="#FFFFFF" font-weight="bold" text-anchor="middle">C1</text>
    <circle cx="580" cy="17" r="12" fill="#DC2626" stroke="#FFFFFF" stroke-width="3"/>
    <text x="580" y="21" font-family="'Segoe UI', sans-serif" font-size="10" fill="#FFFFFF" font-weight="bold" text-anchor="middle">C6</text>
    <circle cx="780" cy="17" r="14" fill="#DC2626" stroke="#FCA5A5" stroke-width="3"/>
    <text x="780" y="22" font-family="'Segoe UI', sans-serif" font-size="11" fill="#FFFFFF" font-weight="bold" text-anchor="middle">v1.1</text>
  </g>

  <!-- Track 2: release / hotfix -->
  <g transform="translate(40, 185)">
    <rect width="130" height="34" rx="8" fill="#EA580C"/>
    <text x="65" y="22" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">release / hotfix</text>
    <line x1="140" y1="17" x2="820" y2="17" stroke="#EA580C" stroke-width="3" stroke-dasharray="6 6"/>

    <circle cx="480" cy="17" r="10" fill="#EA580C" stroke="#FFFFFF" stroke-width="2"/>
    <text x="480" y="40" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#C2410C" text-anchor="middle">RC-1 Testing</text>
    
    <path d="M 480 17 L 580 -58" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Track 3: develop (Integration) -->
  <g transform="translate(40, 260)">
    <rect width="130" height="34" rx="8" fill="#2563EB"/>
    <text x="65" y="22" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">develop</text>
    <line x1="140" y1="17" x2="820" y2="17" stroke="#2563EB" stroke-width="4"/>

    <!-- Commits on develop -->
    <circle cx="240" cy="17" r="11" fill="#2563EB" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="390" cy="17" r="11" fill="#2563EB" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="530" cy="17" r="11" fill="#2563EB" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="700" cy="17" r="11" fill="#2563EB" stroke="#FFFFFF" stroke-width="2.5"/>

    <!-- Connection from main C1 to develop -->
    <path d="M 180 -133 L 240 17" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Track 4: feature/auth & feature/catalogo -->
  <g transform="translate(40, 335)">
    <rect width="130" height="34" rx="8" fill="#00A86B"/>
    <text x="65" y="22" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">feature/auth-rbac</text>
    <line x1="140" y1="17" x2="420" y2="17" stroke="#00A86B" stroke-width="3"/>

    <!-- Commits -->
    <circle cx="290" cy="17" r="9" fill="#00A86B" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="350" cy="17" r="9" fill="#00A86B" stroke="#FFFFFF" stroke-width="2"/>

    <path d="M 240 -58 L 290 17" stroke="#00A86B" stroke-width="2"/>
    <path d="M 350 17 L 390 -58" stroke="#00A86B" stroke-width="2.5"/>
    <text x="370" y="-20" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#065F46">PR Merge</text>
  </g>

  <g transform="translate(40, 410)">
    <rect width="130" height="34" rx="8" fill="#7C3AED"/>
    <text x="65" y="22" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">feature/orders-kanban</text>
    <line x1="140" y1="17" x2="600" y2="17" stroke="#7C3AED" stroke-width="3"/>

    <!-- Commits -->
    <circle cx="430" cy="17" r="9" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="490" cy="17" r="9" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2"/>

    <path d="M 390 -133 L 430 17" stroke="#7C3AED" stroke-width="2"/>
    <path d="M 490 17 L 530 -133" stroke="#7C3AED" stroke-width="2.5"/>
    <text x="510" y="-95" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#5B21B6">PR Merge</text>
  </g>

  <!-- Legend Bottom Card -->
  <g transform="translate(40, 475)">
    <rect width="820" height="55" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="25" cy="28" r="7" fill="#DC2626"/>
    <text x="40" y="32" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#334155">Main: Código de Producción Estable</text>

    <circle cx="260" cy="28" r="7" fill="#2563EB"/>
    <text x="275" y="32" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#334155">Develop: Integración de Sprint</text>

    <circle cx="470" cy="28" r="7" fill="#00A86B"/>
    <text x="485" y="32" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#334155">Feature: Nuevos Módulos</text>

    <circle cx="650" cy="28" r="7" fill="#EA580C"/>
    <text x="665" y="32" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#334155">Release: Pruebas y Auditoría</text>
  </g>
</svg>

</body>
</html>
