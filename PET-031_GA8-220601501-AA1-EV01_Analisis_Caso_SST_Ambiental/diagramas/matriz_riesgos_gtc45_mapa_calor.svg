<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <linearGradient id="bgHeat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadowHeat" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1000" height="520" fill="url(#bgHeat)"/>

  <!-- Title Header -->
  <rect x="30" y="20" width="940" height="60" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadowHeat)"/>
  <rect x="30" y="20" width="8" height="60" rx="4" fill="#EF4444"/>
  <text x="50" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="bold" fill="#F8FAFC">EVALUACIÓN Y MAPA DE CALOR DEL RIESGO - METODOLOGÍA GTC 45</text>
  <text x="50" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8">Caso "Vestidos y Costuras S.A.S.": Caída a Diferente Nivel y Déficit Lumínico en Escaleras al Sótano</text>

  <!-- Left: Heatmap Matrix GTC 45 -->
  <!-- Axis Labels -->
  <text x="250" y="105" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#38BDF8" text-anchor="middle">NIVEL DE PROBABILIDAD (NP = ND × NE)</text>
  <text x="45" y="280" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#F87171" transform="rotate(-90, 45, 280)" text-anchor="middle">NIVEL DE CONSECUENCIA (NC)</text>

  <!-- Columns Header (Probabilidad) -->
  <!-- Col 1: Bajo (2-4) -->
  <rect x="90" y="120" width="85" height="30" fill="#334155" stroke="#475569"/>
  <text x="132" y="139" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#E2E8F0" text-anchor="middle">Bajo (2-4)</text>

  <!-- Col 2: Medio (6-8) -->
  <rect x="175" y="120" width="85" height="30" fill="#334155" stroke="#475569"/>
  <text x="217" y="139" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#E2E8F0" text-anchor="middle">Medio (6-8)</text>

  <!-- Col 3: Alto (10-20) -->
  <rect x="260" y="120" width="85" height="30" fill="#334155" stroke="#475569"/>
  <text x="302" y="139" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#E2E8F0" text-anchor="middle">Alto (10-20)</text>

  <!-- Col 4: M. Alto (24-40) -->
  <rect x="345" y="120" width="85" height="30" fill="#334155" stroke="#475569"/>
  <text x="387" y="139" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#E2E8F0" text-anchor="middle">M.Alto (24-40)</text>

  <!-- Rows Header & Cells -->
  <!-- Row 1: Mortal / Catastrófico (100) -->
  <rect x="55" y="150" width="35" height="60" fill="#1E293B" stroke="#475569"/>
  <text x="72" y="185" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#EF4444" text-anchor="middle">100</text>
  <!-- Cells Row 1 -->
  <rect x="90" y="150" width="85" height="60" fill="#DC2626" fill-opacity="0.8" stroke="#0F172A"/>
  <text x="132" y="185" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">I (400-200)</text>

  <rect x="175" y="150" width="85" height="60" fill="#B91C1C" stroke="#0F172A"/>
  <text x="217" y="185" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">I (800-600)</text>

  <rect x="260" y="150" width="85" height="60" fill="#991B1B" stroke="#0F172A"/>
  <text x="302" y="185" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">I (2000-1000)</text>

  <rect x="345" y="150" width="85" height="60" fill="#7F1D1D" stroke="#0F172A"/>
  <text x="387" y="185" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">I (4000-2400)</text>

  <!-- Row 2: Muy Grave (60) - DONDE ESTÁ EL CASO ACTUAL -->
  <rect x="55" y="210" width="35" height="60" fill="#1E293B" stroke="#475569"/>
  <text x="72" y="245" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#F87171" text-anchor="middle">60</text>
  <!-- Cells Row 2 -->
  <rect x="90" y="210" width="85" height="60" fill="#D97706" fill-opacity="0.85" stroke="#0F172A"/>
  <text x="132" y="245" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">II (240-120)</text>

  <rect x="175" y="210" width="85" height="60" fill="#DC2626" fill-opacity="0.8" stroke="#0F172A"/>
  <text x="217" y="245" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">I (480-360)</text>

  <!-- TARGET CELL: CASO VESTIDOS Y COSTURAS S.A.S. -->
  <rect x="260" y="210" width="85" height="60" fill="#EF4444" stroke="#FDE047" stroke-width="3" filter="url(#shadowHeat)"/>
  <text x="302" y="238" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">NIVEL I</text>
  <text x="302" y="254" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#FEF08A" text-anchor="middle">NR = 1080 ★</text>

  <rect x="345" y="210" width="85" height="60" fill="#991B1B" stroke="#0F172A"/>
  <text x="387" y="245" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">I (2400-1440)</text>

  <!-- Row 3: Grave (25) -->
  <rect x="55" y="270" width="35" height="60" fill="#1E293B" stroke="#475569"/>
  <text x="72" y="305" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#FBBF24" text-anchor="middle">25</text>
  <!-- Cells Row 3 -->
  <!-- TARGET RESIDUAL RISK CELL AFTER INTERVENTION -->
  <rect x="90" y="270" width="85" height="60" fill="#059669" stroke="#34D399" stroke-width="2.5"/>
  <text x="132" y="298" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">NIVEL III ✓</text>
  <text x="132" y="314" font-family="'Courier New', monospace" font-size="9" fill="#D1FAE5" text-anchor="middle">Post-Control: 50</text>

  <rect x="175" y="270" width="85" height="60" fill="#D97706" fill-opacity="0.85" stroke="#0F172A"/>
  <text x="217" y="305" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">II (200-150)</text>

  <rect x="260" y="270" width="85" height="60" fill="#D97706" fill-opacity="0.85" stroke="#0F172A"/>
  <text x="302" y="305" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">II (500-250)</text>

  <rect x="345" y="270" width="85" height="60" fill="#DC2626" fill-opacity="0.8" stroke="#0F172A"/>
  <text x="387" y="305" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">I (1000-600)</text>

  <!-- Row 4: Leve (10) -->
  <rect x="55" y="330" width="35" height="60" fill="#1E293B" stroke="#475569"/>
  <text x="72" y="365" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#34D399" text-anchor="middle">10</text>
  <!-- Cells Row 4 -->
  <rect x="90" y="330" width="85" height="60" fill="#047857" stroke="#0F172A"/>
  <text x="132" y="365" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">IV (40-20)</text>

  <rect x="175" y="330" width="85" height="60" fill="#059669" stroke="#0F172A"/>
  <text x="217" y="365" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">III (80-60)</text>

  <rect x="260" y="330" width="85" height="60" fill="#D97706" fill-opacity="0.85" stroke="#0F172A"/>
  <text x="302" y="365" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">II (200-100)</text>

  <rect x="345" y="330" width="85" height="60" fill="#D97706" fill-opacity="0.85" stroke="#0F172A"/>
  <text x="387" y="365" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">II (400-240)</text>

  <!-- Legend Below Matrix -->
  <rect x="55" y="405" width="375" height="85" rx="6" fill="#111827" stroke="#334155"/>
  <text x="65" y="425" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#CBD5E1">ESCALA DE ACEPTABILIDAD GTC 45:</text>
  <rect x="65" y="435" width="12" height="12" fill="#EF4444" rx="2"/>
  <text x="82" y="445" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#FCA5A5">Nivel I: No Aceptable (Situación Crítica Urgente)</text>
  <rect x="65" y="453" width="12" height="12" fill="#D97706" rx="2"/>
  <text x="82" y="463" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#FDE68A">Nivel II: No Aceptable o Aceptable con control específico</text>
  <rect x="65" y="471" width="12" height="12" fill="#059669" rx="2"/>
  <text x="82" y="481" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#A7F3D0">Nivel III: Mejorable | Nivel IV: Aceptable</text>

  <!-- Right: Mathematical Assessment Details for Case -->
  <rect x="460" y="105" width="510" height="385" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5" filter="url(#shadowHeat)"/>
  <rect x="460" y="105" width="510" height="35" rx="8" fill="#1E293B"/>
  <text x="715" y="128" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FBBF24" text-anchor="middle">VALORACIÓN CUANTITATIVA DEL CASO (GTC 45)</text>

  <rect x="475" y="150" width="480" height="150" rx="6" fill="#1F2937" stroke="#EF4444"/>
  <text x="490" y="172" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#F87171">ESTADO INICIAL: CONDICIÓN INSEGURA CRÍTICA</text>
  
  <text x="490" y="195" font-family="'Courier New', monospace" font-size="10" fill="#CBD5E1">• Nivel de Deficiencia (ND) : 6 (Se han detectado factores de riesgo significativos)</text>
  <text x="490" y="215" font-family="'Courier New', monospace" font-size="10" fill="#CBD5E1">• Nivel de Exposición (NE)   : 3 (Frecuente: tránsito diario continuo de operarios)</text>
  <text x="490" y="235" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#FBBF24">• Nivel de Probabilidad (NP): 18 = ND (6) × NE (3) -> [MUY ALTO]</text>
  <text x="490" y="255" font-family="'Courier New', monospace" font-size="10" fill="#CBD5E1">• Nivel de Consecuencia (NC): 60 (Grave: fracturas, trauma craneal por caída en escalera)</text>
  <rect x="485" y="265" width="460" height="25" rx="4" fill="#7F1D1D"/>
  <text x="715" y="282" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#FEE2E2" text-anchor="middle">NIVEL DE RIESGO: NR = 18 × 60 = 1080 -> [NIVEL I: NO ACEPTABLE]</text>

  <rect x="475" y="315" width="480" height="160" rx="6" fill="#1F2937" stroke="#10B981"/>
  <text x="490" y="337" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#4ADE80">ESTADO RESIDUAL: DESPUÉS DEL PLAN DE CONTROLES</text>
  
  <text x="490" y="360" font-family="'Courier New', monospace" font-size="10" fill="#CBD5E1">• Nivel de Deficiencia (ND) : 2 (Luminarias LED 300 lux + bandas antideslizantes)</text>
  <text x="490" y="380" font-family="'Courier New', monospace" font-size="10" fill="#CBD5E1">• Nivel de Exposición (NE)   : 1 (Ocasional / controlado)</text>
  <text x="490" y="400" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#6EE7B7">• Nivel de Probabilidad (NP): 2 = ND (2) × NE (1) -> [BAJO]</text>
  <text x="490" y="420" font-family="'Courier New', monospace" font-size="10" fill="#CBD5E1">• Nivel de Consecuencia (NC): 25 (Lesiones leves con incapacidad temporal breve)</text>
  <rect x="485" y="435" width="460" height="25" rx="4" fill="#064E3B"/>
  <text x="715" y="452" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#A7F3D0" text-anchor="middle">NIVEL DE RIESGO RESIDUAL: NR = 2 × 25 = 50 -> [NIVEL III: MEJORABLE]</text>
</svg>
