<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="bgGradFlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <filter id="shadowFlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#bgGradFlow)"/>

  <!-- Header -->
  <rect x="30" y="20" width="940" height="60" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadowFlow)"/>
  <rect x="30" y="20" width="8" height="60" rx="4" fill="#38BDF8"/>
  <text x="50" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="bold" fill="#F8FAFC">RUTA DE GESTIÓN DEL SG-SST Y SUBSANACIÓN DE OMISIÓN ADMINISTRATIVA</text>
  <text x="50" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8">Ciclo PHVA y Tratamiento de No Conformidades según Decreto 1072 de 2015 (Art. 2.2.4.6.26)</text>

  <!-- Step 1: Detección y Reporte -->
  <rect x="30" y="105" width="215" height="360" rx="8" fill="#111827" stroke="#38BDF8" stroke-width="1.5" filter="url(#shadowFlow)"/>
  <rect x="30" y="105" width="215" height="35" rx="8" fill="#0284C7"/>
  <text x="137" y="128" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1. REPORTE DEL TRABAJADOR</text>

  <rect x="42" y="155" width="190" height="90" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="52" y="175" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#38BDF8">Evento Identificado</text>
  <text x="52" y="195" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">• Tropiezos y caídas en</text>
  <text x="52" y="210" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">  escaleras al sótano bordador</text>
  <text x="52" y="228" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94A3B8">Incidente con potencial de daño</text>

  <rect x="42" y="255" width="190" height="95" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="52" y="275" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FBBF24">Notificación Formal</text>
  <text x="52" y="295" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">• Reportado al Responsable</text>
  <text x="52" y="310" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">  del SG-SST "hace días atrás"</text>
  <text x="52" y="328" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#86EFAC">✓ Deber cumplido del empleado</text>

  <rect x="42" y="360" width="190" height="90" rx="6" fill="#0C4A6E" stroke="#0284C7"/>
  <text x="52" y="380" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#BAE6FD">Norma Aplicable:</text>
  <text x="52" y="400" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#E0F2FE">Decreto 1072/2015 Art. 2.2.4.6.10:</text>
  <text x="52" y="415" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#E0F2FE">Responsabilidad de reportar</text>
  <text x="52" y="430" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#E0F2FE">peligros y condiciones inseguras.</text>

  <!-- Arrow 1 -> 2 (Falla Administrativa) -->
  <line x1="245" y1="280" x2="270" y2="280" stroke="#EF4444" stroke-width="2.5"/>
  <polygon points="270,275 280,280 270,285" fill="#EF4444"/>

  <!-- Step 2: Falla y Quiebre de Gestión -->
  <rect x="275" y="105" width="215" height="360" rx="8" fill="#111827" stroke="#EF4444" stroke-width="2" filter="url(#shadowFlow)"/>
  <rect x="275" y="105" width="215" height="35" rx="8" fill="#DC2626"/>
  <text x="382" y="128" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2. QUIEBRE / INACCIÓN ⚠</text>

  <rect x="287" y="155" width="190" height="110" rx="6" fill="#450A0A" stroke="#EF4444"/>
  <text x="297" y="175" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FCA5A5">Falla en la Organización</text>
  <text x="297" y="195" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#FECDD3">• "Hasta la fecha no se ha</text>
  <text x="297" y="210" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#FECDD3">   atendido la situación"</text>
  <text x="297" y="230" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#F87171">• Inobservancia negligente</text>
  <text x="297" y="248" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#FCA5A5">Incrementa la probabilidad a M.Alto</text>

  <rect x="287" y="275" width="190" height="175" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="297" y="295" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#FBBF24">Consecuencias Legales:</text>
  <text x="297" y="315" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#CBD5E1">• Culpa Patronal (Art. 216 CST)</text>
  <text x="297" y="330" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#CBD5E1">  por omisión de prevención.</text>
  <text x="297" y="350" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#CBD5E1">• Sanciones del MinTrabajo:</text>
  <text x="297" y="365" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#CBD5E1">  Multas de hasta 500 SMMLV</text>
  <text x="297" y="380" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#CBD5E1">  por Resolución 0312 de 2019.</text>
  <text x="297" y="400" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#F87171">• Riesgo de Accidente Grave:</text>
  <text x="297" y="418" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#FECDD3">Trauma craneoencefálico / fracturas.</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="490" y1="280" x2="515" y2="280" stroke="#F59E0B" stroke-width="2.5"/>
  <polygon points="515,275 525,280 515,285" fill="#F59E0B"/>

  <!-- Step 3: Subsanación y Controles -->
  <rect x="520" y="105" width="215" height="360" rx="8" fill="#111827" stroke="#D97706" stroke-width="1.5" filter="url(#shadowFlow)"/>
  <rect x="520" y="105" width="215" height="35" rx="8" fill="#D97706"/>
  <text x="627" y="128" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3. INTERVENCIÓN INMEDIATA</text>

  <rect x="532" y="155" width="190" height="95" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="542" y="175" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FBBF24">Convocatoria COPASST</text>
  <text x="542" y="195" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">• Inspección técnica locativa</text>
  <text x="542" y="210" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">• Medición de luxometría</text>
  <text x="542" y="228" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94A3B8">Aprobación de orden de compra</text>

  <rect x="532" y="260" width="190" height="95" rx="6" fill="#78350F" fill-opacity="0.4" stroke="#D97706"/>
  <text x="542" y="280" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#FDE68A">Ejecución en Obra</text>
  <text x="542" y="300" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#FEF3C7">• 4 Luminarias LED 300 lux</text>
  <text x="542" y="315" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#FEF3C7">• Bandas antideslizantes</text>
  <text x="542" y="332" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#A7F3D0">• Pasamanos reforzado</text>

  <rect x="532" y="365" width="190" height="85" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="542" y="385" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#94A3B8">Plazo de Ejecución:</text>
  <text x="542" y="405" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="bold" fill="#6EE7B7">Máximo 48 a 72 horas</text>
  <text x="542" y="423" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#CBD5E1">Control provisional mientras obra.</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="735" y1="280" x2="760" y2="280" stroke="#10B981" stroke-width="2.5"/>
  <polygon points="760,275 770,280 760,285" fill="#10B981"/>

  <!-- Step 4: Verificación y Cierre -->
  <rect x="765" y="105" width="205" height="360" rx="8" fill="#111827" stroke="#059669" stroke-width="1.8" filter="url(#shadowFlow)"/>
  <rect x="765" y="105" width="205" height="35" rx="8" fill="#059669"/>
  <text x="867" y="128" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4. CIERRE Y AUDITORÍA</text>

  <rect x="775" y="155" width="185" height="95" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="785" y="175" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#4ADE80">Re-evaluación GTC 45</text>
  <text x="785" y="195" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">• Probabilidad: de 18 a 2</text>
  <text x="785" y="210" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">• Nivel Riesgo: Nivel III (50)</text>
  <text x="785" y="228" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#A7F3D0">Riesgo residual controlado</text>

  <rect x="775" y="260" width="185" height="95" rx="6" fill="#064E3B" stroke="#059669"/>
  <text x="785" y="280" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#A7F3D0">Cierre de Acción</text>
  <text x="785" y="300" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#D1FAE5">• Firma de conformidad de</text>
  <text x="785" y="315" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#D1FAE5">  los operarios bordadores</text>
  <text x="785" y="332" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#6EE7B7">✓ No conformidad cerrada</text>

  <rect x="775" y="365" width="185" height="85" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="785" y="385" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#94A3B8">Mejora Continua (PHVA):</text>
  <text x="785" y="405" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#CBD5E1">• Inspección mensual periódica</text>
  <text x="785" y="420" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#CBD5E1">• Canal digital de reportes</text>
</svg>
