<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="bgEnv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadowEnv" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1000" height="500" fill="url(#bgEnv)"/>

  <!-- Header -->
  <rect x="30" y="20" width="940" height="60" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadowEnv)"/>
  <rect x="30" y="20" width="8" height="60" rx="4" fill="#10B981"/>
  <text x="50" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="bold" fill="#F8FAFC">MATRIZ DE IDENTIFICACIÓN DE ASPECTOS E IMPACTOS AMBIENTALES</text>
  <text x="50" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8">Ciclo de Vida del Proceso Textil y Plan de Mitigación según Decreto 1076 de 2015 y Res. 2184/2019</text>

  <!-- Step 1: Entradas -->
  <rect x="30" y="105" width="215" height="360" rx="8" fill="#111827" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadowEnv)"/>
  <rect x="30" y="105" width="215" height="35" rx="8" fill="#1D4ED8"/>
  <text x="137" y="128" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1. ENTRADAS / RECURSOS</text>

  <rect x="42" y="155" width="190" height="95" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="52" y="175" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#60A5FA">Energía Eléctrica</text>
  <text x="52" y="195" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">• Red de alumbrado continuo</text>
  <text x="52" y="210" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">• Motores trifásicos bordado</text>
  <text x="52" y="228" font-family="'Courier New', monospace" font-size="9" fill="#93C5FD">Consumo: ~1,850 kWh/mes</text>

  <rect x="42" y="260" width="190" height="95" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="52" y="280" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FBBF24">Materias Primas</text>
  <text x="52" y="300" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">• Telas (algodón, poliéster)</text>
  <text x="52" y="315" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">• Hilos sintéticos y tintes</text>
  <text x="52" y="332" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#E2E8F0">• Aceites de lubricación ISO 68</text>

  <rect x="42" y="365" width="190" height="85" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="52" y="385" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#F87171">Luminarias Fluorescentes</text>
  <text x="52" y="405" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#CBD5E1">• Tubos T8 con vapor de mercurio</text>
  <text x="52" y="420" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#CBD5E1">• Balastros electromagnéticos</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="245" y1="280" x2="270" y2="280" stroke="#3B82F6" stroke-width="2.5"/>
  <polygon points="270,275 280,280 270,285" fill="#3B82F6"/>

  <!-- Step 2: Proceso y Aspectos -->
  <rect x="275" y="105" width="215" height="360" rx="8" fill="#111827" stroke="#D97706" stroke-width="1.5" filter="url(#shadowEnv)"/>
  <rect x="275" y="105" width="215" height="35" rx="8" fill="#B45309"/>
  <text x="382" y="128" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2. ASPECTOS AMBIENTALES</text>

  <rect x="287" y="155" width="190" height="95" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="297" y="175" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FBBF24">Consumo de Energía</text>
  <text x="297" y="195" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">• Alumbrado ineficiente en sótano</text>
  <text x="297" y="210" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">• Pérdida térmica por balastros</text>
  <text x="297" y="228" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94A3B8">Generación indirecta de CO₂</text>

  <rect x="287" y="260" width="190" height="95" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="297" y="280" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#F87171">Residuos Sólidos y Peligrosos</text>
  <text x="297" y="300" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">• Retazos textiles y conos de hilo</text>
  <text x="297" y="315" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">• Bombillos fundidos con mercurio</text>
  <text x="297" y="332" font-family="'Courier New', monospace" font-size="8.5" fill="#FCA5A5">RESPEL: Residuos Peligrosos</text>

  <rect x="287" y="365" width="190" height="85" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="297" y="385" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#CBD5E1">Emisión de Ruido</text>
  <text x="297" y="405" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#CBD5E1">• Ruido continuo de bordadoras en</text>
  <text x="297" y="420" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#CBD5E1">  espacio cerrado subterráneo (78 dB)</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="490" y1="280" x2="515" y2="280" stroke="#F59E0B" stroke-width="2.5"/>
  <polygon points="515,275 525,280 515,285" fill="#F59E0B"/>

  <!-- Step 3: Impactos Ambientales -->
  <rect x="520" y="105" width="215" height="360" rx="8" fill="#111827" stroke="#DC2626" stroke-width="1.5" filter="url(#shadowEnv)"/>
  <rect x="520" y="105" width="215" height="35" rx="8" fill="#B91C1C"/>
  <text x="627" y="128" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3. IMPACTOS AMBIENTALES</text>

  <rect x="532" y="155" width="190" height="95" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="542" y="175" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#F87171">Agotamiento de Recursos</text>
  <text x="542" y="195" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">• Mayor huella de carbono por</text>
  <text x="542" y="210" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">  demanda de energía eléctrica</text>
  <text x="542" y="228" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#FCA5A5">Emisiones GEI en generación</text>

  <rect x="532" y="260" width="190" height="95" rx="6" fill="#450A0A" stroke="#EF4444"/>
  <text x="542" y="280" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#FCA5A5">Contaminación de Suelos/Agua</text>
  <text x="542" y="300" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#FECDD3">• Lixiviación de mercurio si se tiran</text>
  <text x="542" y="315" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#FECDD3">  lámparas en basura ordinaria</text>
  <text x="542" y="332" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#F87171">Toxicidad crónica ecosistémica</text>

  <rect x="532" y="365" width="190" height="85" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="542" y="385" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#FBBF24">Saturación de Rellenos</text>
  <text x="542" y="405" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#CBD5E1">• Retazos sintéticos tardan 200</text>
  <text x="542" y="420" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#CBD5E1">  años en degradarse en vertederos.</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="735" y1="280" x2="760" y2="280" stroke="#10B981" stroke-width="2.5"/>
  <polygon points="760,275 770,280 760,285" fill="#10B981"/>

  <!-- Step 4: Medidas de Mitigación -->
  <rect x="765" y="105" width="205" height="360" rx="8" fill="#111827" stroke="#059669" stroke-width="1.8" filter="url(#shadowEnv)"/>
  <rect x="765" y="105" width="205" height="35" rx="8" fill="#047857"/>
  <text x="867" y="128" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4. PLAN DE MITIGACIÓN</text>

  <rect x="775" y="155" width="185" height="95" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="785" y="175" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#4ADE80">Eficiencia Energética LED</text>
  <text x="785" y="195" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">• Reducción del 65% de kWh</text>
  <text x="785" y="210" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#CBD5E1">• Sensores de apagado auto</text>
  <text x="785" y="228" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#A7F3D0">Mayor iluminación, menos calor</text>

  <rect x="775" y="260" width="185" height="95" rx="6" fill="#064E3B" stroke="#059669"/>
  <text x="785" y="280" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold" fill="#A7F3D0">Economía Circular y PIGA</text>
  <text x="785" y="300" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#D1FAE5">• Código colores Res. 2184/19</text>
  <text x="785" y="315" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#D1FAE5">• Donación de retazos a talleres</text>
  <text x="785" y="332" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#6EE7B7">Aprovechamiento textil 80%</text>

  <rect x="775" y="365" width="185" height="85" rx="6" fill="#1E293B" stroke="#334155"/>
  <text x="785" y="385" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#FBBF24">Gestión RESPEL Legal</text>
  <text x="785" y="405" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#CBD5E1">• Entrega de bombillos viejos</text>
  <text x="785" y="420" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#CBD5E1">  al programa posconsumo Lumina.</text>
</svg>
