version: '3.8'

services:
  # ==========================================================
  # SERVICIO 1: Base de Datos Relacional MariaDB (Pizzería)
  # ==========================================================
  db:
    image: mariadb:10.5
    container_name: sena-pizzeria-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: choco
      MYSQL_DATABASE: pizzeria
      MYSQL_USER: karen
      MYSQL_PASSWORD: choco
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pizzeria_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pchoco"]
      interval: 4s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - sena-net

  # ==========================================================
  # SERVICIO 2: Backend Java Servlets / Apache Tomcat 10
  # ==========================================================
  tomcat:
    image: tomcat:10.1-jdk17
    container_name: sena-tomcat-pizzeria
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./PizzeriaWeb/target/pizzeria-web.war:/usr/local/tomcat/webapps/pizzeria-web.war:ro
    networks:
      - sena-net

  # ==========================================================
  # SERVICIO 3: Spring Boot REST API (Microservicio Pizzería)
  # ==========================================================
  springboot:
    image: maven:3.9.6-eclipse-temurin-17-alpine
    container_name: sena-springboot-pizzeria
    working_dir: /app/PizzeriaSpringBoot
    ports:
      - "8082:8082"
    environment:
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - .:/app
      - maven_m2_cache:/root/.m2
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sena-net

  # ==========================================================
  # SERVICIO 4: Frontend React SPA (Pizzería Bella Italia)
  # ==========================================================
  frontend-react:
    image: node:20-alpine
    container_name: sena-frontend-react
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./Evidencias/PET-021_GA7-220501096-AA4-EV03_Componente_Frontend_Proyecto/pizzeria-frontend-react:/app
    networks:
      - sena-net
    command: >
      node -e "
      const http = require('http');
      const fs = require('fs');
      const path = require('path');
      const mimeTypes = {
        '.html': 'text/html',
        '.js': 'text/javascript',
        '.jsx': 'text/javascript',
        '.css': 'text/css',
        '.json': 'application/json',
        '.png': 'image/png',
        '.jpg': 'image/jpeg',
        '.svg': 'image/svg+xml'
      };
      http.createServer((req, res) => {
        let reqPath = req.url.split('?')[0];
        if (reqPath === '/' || reqPath === '/index.html') reqPath = '/app_navegador.html';
        const filePath = path.join('/app', reqPath);
        if (fs.existsSync(filePath) && fs.statSync(filePath).isFile()) {
          const ext = path.extname(filePath);
          res.writeHead(200, { 'Content-Type': mimeTypes[ext] || 'text/plain', 'Access-Control-Allow-Origin': '*' });
          fs.createReadStream(filePath).pipe(res);
        } else {
          res.writeHead(404, { 'Content-Type': 'text/plain' });
          res.end('404 Not Found');
        }
      }).listen(3000, '0.0.0.0', () => console.log('Frontend React disponible en http://localhost:3000'));
      "

  # ==========================================================
  # SERVICIO 5: Auth REST API (Caso de Estudio AA5-EV01 / AA5-EV02)
  # ==========================================================
  auth-service:
    image: node:20-alpine
    container_name: sena-auth-service
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8083:8083"
    environment:
      PORT: 8083
    volumes:
      - ./Evidencias/PET-023_GA7-220501096-AA5-EV02_Testing_API_Postman/auth-service-caso:/app
    networks:
      - sena-net
    command: ["node", "server.js"]

  # ==========================================================
  # SERVICIO 6: Base de Datos NoSQL MongoDB (Proyecto Pizzería)
  # ==========================================================
  mongodb:
    image: mongo:6-jammy
    container_name: sena-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: pizzeria_db
    volumes:
      - ./docker/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - sena_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 4s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - sena-net

  # ==========================================================
  # SERVICIO 7: Backend REST API Go + Fiber v2 (Proyecto Pizzería)
  # ==========================================================
  backend-go:
    image: golang:1.22-alpine
    container_name: sena-backend-go
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8085:8085"
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: pizzeria_db
      PORT: 8085
      JWT_SECRET: SENA_ADSO_3186681_BELLA_ITALIA_GO_FIBER_2026
    volumes:
      - ./PizzeriaBackendGo:/app
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - sena-net
    command: ["./server"]

  # ==========================================================
  # SERVICIO 8: Frontend Web Vite + Tailwind (Proyecto Pizzería)
  # ==========================================================
  frontend-vite:
    image: node:20-alpine
    container_name: sena-frontend-vite
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./PizzeriaFrontendVite:/app
    depends_on:
      - backend-go
    networks:
      - sena-net
    command: ["npm", "run", "preview"]

  # ==========================================================
  # SERVICIO 9: Ejecutor de Pruebas Automatizadas TDD
  # ==========================================================
  test-runner:
    image: node:20-alpine
    container_name: sena-test-runner
    working_dir: /sena/CDE
    environment:
      SENA_ROOT: /sena
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - /home/danilo/Escritorio/Karen/SENA:/sena
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sena-net

volumes:
  pizzeria_db_data:
    name: sena_pizzeria_db_data
  maven_m2_cache:
    name: sena_maven_m2_cache
  sena_mongo_data:
    name: sena_mongo_data

networks:
  sena-net:
    name: sena_network
    driver: bridge
