<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin:0; padding:0; box-sizing: border-box; }
    body {
      width: 900px;
      height: 550px;
      overflow: hidden;
      background: #FFFFFF;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body>

<svg width="900" height="550" viewBox="0 0 900 550" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="550" rx="20" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Top Title -->
  <rect x="30" y="25" width="840" height="75" rx="14" fill="#0F172A"/>
  <rect x="45" y="40" width="8" height="45" rx="4" fill="#00A86B"/>
  <text x="68" y="55" fill="#00A86B" font-size="12" font-weight="bold" letter-spacing="2">ARQUITECTURA DE CONTROL DE VERSIONES DISTRIBUIDO • SENA ADSO</text>
  <text x="68" y="82" fill="#FFFFFF" font-size="20" font-weight="900">LAS 4 ZONAS DE CONTROL: FLUJO BIDIRECCIONAL GIT LOCAL Y REMOTO</text>

  <!-- Group: LOCAL ZONE (Covering Zones 1, 2, 3) -->
  <rect x="30" y="115" width="605" height="345" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="45" y="125" width="230" height="26" rx="6" fill="#2563EB"/>
  <text x="55" y="142" fill="#FFFFFF" font-size="11.5" font-weight="bold">💻 ENTORNO GIT LOCAL (OFFLINE)</text>

  <!-- Zone 1: Working Directory -->
  <g transform="translate(45, 165)">
    <rect width="180" height="280" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="12" width="40" height="40" rx="8" fill="#FEE2E2"/>
    <text x="23" y="38" fill="#DC2626" font-size="18" font-weight="900">1</text>
    <text x="60" y="28" fill="#0F172A" font-size="12" font-weight="bold">Working Dir</text>
    <text x="60" y="44" fill="#64748B" font-size="10.5">Espacio Trabajo</text>
    
    <text x="12" y="75" fill="#334155" font-size="10" font-weight="600">Archivos en disco:</text>
    <rect x="10" y="85" width="160" height="55" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="16" y="103" fill="#DC2626" font-family="monospace" font-size="10">• Untracked (Nuevos)</text>
    <text x="16" y="122" fill="#D97706" font-family="monospace" font-size="10">• Modified (Editados)</text>

    <text x="12" y="160" fill="#64748B" font-size="9.5">Edición en IDE (VS Code)</text>
    <text x="12" y="175" fill="#64748B" font-size="9.5">Cambios aún no registrados.</text>

    <rect x="10" y="200" width="160" height="65" rx="6" fill="#0F172A"/>
    <text x="16" y="220" fill="#38BDF8" font-family="monospace" font-size="10">git status</text>
    <text x="16" y="238" fill="#38BDF8" font-family="monospace" font-size="10">git diff</text>
    <text x="16" y="254" fill="#34D399" font-family="monospace" font-size="9.5">Inspecciona cambios</text>
  </g>

  <!-- Command Arrow 1 -> 2: git add -->
  <g transform="translate(230, 240)">
    <path d="M0 0 L20 0 M15 -5 L20 0 L15 5" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="-10" y="-28" width="40" height="20" rx="4" fill="#2563EB"/>
    <text x="-6" y="-14" fill="#FFFFFF" font-family="monospace" font-size="9" font-weight="bold">add</text>
  </g>

  <!-- Zone 2: Staging Area / Index -->
  <g transform="translate(255, 165)">
    <rect width="180" height="280" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="12" width="40" height="40" rx="8" fill="#FEF3C7"/>
    <text x="23" y="38" fill="#D97706" font-size="18" font-weight="900">2</text>
    <text x="60" y="28" fill="#0F172A" font-size="12" font-weight="bold">Staging Area</text>
    <text x="60" y="44" fill="#64748B" font-size="10.5">Área Preparación</text>

    <text x="12" y="75" fill="#334155" font-size="10" font-weight="600">Estado de preparación:</text>
    <rect x="10" y="85" width="160" height="55" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="16" y="103" fill="#059669" font-family="monospace" font-size="10">• Staged (Indexados)</text>
    <text x="16" y="122" fill="#2563EB" font-family="monospace" font-size="10">Snapshot en memoria</text>

    <text x="12" y="160" fill="#64748B" font-size="9.5">Selección atómica de</text>
    <text x="12" y="175" fill="#64748B" font-size="9.5">archivos listos para commit.</text>

    <rect x="10" y="200" width="160" height="65" rx="6" fill="#0F172A"/>
    <text x="16" y="220" fill="#FBBF24" font-family="monospace" font-size="10">git add &lt;file&gt;</text>
    <text x="16" y="238" fill="#FBBF24" font-family="monospace" font-size="10">git reset &lt;file&gt;</text>
    <text x="16" y="254" fill="#34D399" font-family="monospace" font-size="9.5">Prepara confirmación</text>
  </g>

  <!-- Command Arrow 2 -> 3: git commit -->
  <g transform="translate(440, 240)">
    <path d="M0 0 L20 0 M15 -5 L20 0 L15 5" stroke="#00A86B" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="-15" y="-28" width="50" height="20" rx="4" fill="#00A86B"/>
    <text x="-10" y="-14" fill="#FFFFFF" font-family="monospace" font-size="9" font-weight="bold">commit</text>
  </g>

  <!-- Zone 3: Local Repository -->
  <g transform="translate(465, 165)">
    <rect width="160" height="280" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="12" width="40" height="40" rx="8" fill="#DCFCE7"/>
    <text x="23" y="38" fill="#059669" font-size="18" font-weight="900">3</text>
    <text x="60" y="28" fill="#0F172A" font-size="11.5" font-weight="bold">Local Repo</text>
    <text x="60" y="44" fill="#64748B" font-size="10">Carpeta .git</text>

    <text x="12" y="75" fill="#334155" font-size="10" font-weight="600">Historial Inmutable:</text>
    <rect x="10" y="85" width="140" height="55" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="16" y="103" fill="#059669" font-family="monospace" font-size="10">• Commits SHA-1</text>
    <text x="16" y="122" fill="#4F46E5" font-family="monospace" font-size="10">• Ramas Locales</text>

    <text x="12" y="160" fill="#64748B" font-size="9.5">Base de datos interna</text>
    <text x="12" y="175" fill="#64748B" font-size="9.5">con historial completo.</text>

    <rect x="10" y="200" width="140" height="65" rx="6" fill="#0F172A"/>
    <text x="16" y="220" fill="#34D399" font-family="monospace" font-size="9.5">git commit -m</text>
    <text x="16" y="238" fill="#34D399" font-family="monospace" font-size="9.5">git log --oneline</text>
    <text x="16" y="254" fill="#A5B4FC" font-family="monospace" font-size="9">Crea snapshot local</text>
  </g>

  <!-- Bidirectional Bridge between Local & Remote -->
  <!-- Arrow Local -> Remote: git push -->
  <g transform="translate(640, 205)">
    <path d="M0 0 L25 0 M20 -5 L25 0 L20 5" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="-15" y="-22" width="55" height="18" rx="4" fill="#7C3AED"/>
    <text x="-8" y="-9" fill="#FFFFFF" font-family="monospace" font-size="8.5" font-weight="bold">git push</text>
  </g>

  <!-- Arrow Remote -> Local: git pull / fetch -->
  <g transform="translate(640, 295)">
    <path d="M25 0 L0 0 M5 -5 L0 0 L5 5" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="-15" y="6" width="55" height="18" rx="4" fill="#2563EB"/>
    <text x="-8" y="19" fill="#FFFFFF" font-family="monospace" font-size="8.5" font-weight="bold">git pull</text>
  </g>

  <!-- Group: REMOTE ZONE (Zone 4) -->
  <rect x="670" y="115" width="200" height="345" rx="14" fill="#FAF5FF" stroke="#C084FC" stroke-width="2"/>
  <rect x="685" y="125" width="170" height="26" rx="6" fill="#7C3AED"/>
  <text x="695" y="142" fill="#FFFFFF" font-size="11" font-weight="bold">☁️ GIT REMOTO (ONLINE)</text>

  <!-- Zone 4: Remote Repository -->
  <g transform="translate(685, 165)">
    <rect width="170" height="280" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="12" y="12" width="40" height="40" rx="8" fill="#F3E8FF"/>
    <text x="23" y="38" fill="#7C3AED" font-size="18" font-weight="900">4</text>
    <text x="60" y="28" fill="#0F172A" font-size="12" font-weight="bold">Remote Repo</text>
    <text x="60" y="44" fill="#7C3AED" font-size="10.5">GitHub / GitLab</text>

    <text x="12" y="75" fill="#334155" font-size="10" font-weight="600">Servidor en la Nube:</text>
    <rect x="10" y="85" width="150" height="55" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="16" y="103" fill="#7C3AED" font-family="monospace" font-size="10">• origin/main</text>
    <text x="16" y="122" fill="#059669" font-family="monospace" font-size="10">• origin/develop</text>

    <text x="12" y="160" fill="#64748B" font-size="9.5">Colaboración multi-usuario,</text>
    <text x="12" y="175" fill="#64748B" font-size="9.5">Pull Requests y CI/CD.</text>

    <rect x="10" y="200" width="150" height="65" rx="6" fill="#0F172A"/>
    <text x="16" y="220" fill="#C084FC" font-family="monospace" font-size="9.5">git clone &lt;url&gt;</text>
    <text x="16" y="238" fill="#C084FC" font-family="monospace" font-size="9.5">git fetch origin</text>
    <text x="16" y="254" fill="#38BDF8" font-family="monospace" font-size="9">Respaldo y trabajo en red</text>
  </g>

  <!-- Bottom Banner -->
  <rect x="30" y="480" width="840" height="48" rx="10" fill="#0F172A"/>
  <text x="50" y="510" fill="#00A86B" font-size="13" font-weight="bold">💡 PRINCIPIO FUNDAMENTAL:</text>
  <text x="245" y="510" fill="#F8FAFC" font-size="13" font-weight="500">"Git Local te otorga autonomía y velocidad absoluta; Git Remoto te brinda colaboración y respaldo seguro."</text>
</svg>

</body>
</html>
