<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin:0; padding:0; box-sizing: border-box; }
    body {
      width: 900px;
      height: 550px;
      overflow: hidden;
      background: #FFFFFF;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body>

<svg width="900" height="550" viewBox="0 0 900 550" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="550" rx="20" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Top Title -->
  <rect x="30" y="25" width="840" height="75" rx="14" fill="#0F172A"/>
  <rect x="45" y="40" width="8" height="45" rx="4" fill="#00A86B"/>
  <text x="68" y="55" fill="#00A86B" font-size="12" font-weight="bold" letter-spacing="2">GUÍA OPERATIVA DE REFERENCIA RÁPIDA • COMANDOS BÁSICOS</text>
  <text x="68" y="82" fill="#FFFFFF" font-size="20" font-weight="900">CATÁLOGO TAXONÓMICO DE COMANDOS GIT LOCAL Y REMOTO</text>

  <!-- 4 Command Panels (2x2 Grid) -->
  <!-- Panel 1: Inicialización & Configuración -->
  <g transform="translate(30, 115)">
    <rect width="405" height="170" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="15" y="12" width="160" height="26" rx="6" fill="#EFF6FF"/>
    <text x="25" y="29" fill="#2563EB" font-size="11.5" font-weight="800">1. INICIALIZACIÓN</text>
    <text x="185" y="29" fill="#64748B" font-size="11" font-weight="bold">Local &amp; Configuración</text>

    <rect x="15" y="48" width="375" height="108" rx="8" fill="#0F172A"/>
    <text x="25" y="70" fill="#38BDF8" font-family="monospace" font-size="11">git init</text>
    <text x="110" y="70" fill="#94A3B8" font-size="10.5">➔ Inicializa nuevo repositorio local (.git)</text>
    
    <text x="25" y="93" fill="#38BDF8" font-family="monospace" font-size="11">git clone &lt;url&gt;</text>
    <text x="160" y="93" fill="#94A3B8" font-size="10.5">➔ Clona repositorio remoto completo</text>

    <text x="25" y="116" fill="#38BDF8" font-family="monospace" font-size="11">git config --global</text>
    <text x="180" y="116" fill="#94A3B8" font-size="10.5">➔ Configura user.name y user.email</text>

    <text x="25" y="139" fill="#38BDF8" font-family="monospace" font-size="11">git status</text>
    <text x="115" y="139" fill="#94A3B8" font-size="10.5">➔ Estado de archivos (staged / untracked)</text>
  </g>

  <!-- Panel 2: Ciclo de Cambios Locales -->
  <g transform="translate(465, 115)">
    <rect width="405" height="170" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="15" y="12" width="170" height="26" rx="6" fill="#ECFDF5"/>
    <text x="25" y="29" fill="#059669" font-size="11.5" font-weight="800">2. CICLO LOCAL</text>
    <text x="195" y="29" fill="#64748B" font-size="11" font-weight="bold">Confirmaciones &amp; Diff</text>

    <rect x="15" y="48" width="375" height="108" rx="8" fill="#0F172A"/>
    <text x="25" y="70" fill="#34D399" font-family="monospace" font-size="11">git add &lt;file&gt; / .</text>
    <text x="160" y="70" fill="#94A3B8" font-size="10.5">➔ Pasa cambios al Staging Area</text>

    <text x="25" y="93" fill="#34D399" font-family="monospace" font-size="11">git commit -m "..."</text>
    <text x="175" y="93" fill="#94A3B8" font-size="10.5">➔ Registra snapshot con Conventional Commit</text>

    <text x="25" y="116" fill="#34D399" font-family="monospace" font-size="11">git diff</text>
    <text x="100" y="116" fill="#94A3B8" font-size="10.5">➔ Compara cambios entre Working Dir y Staging</text>

    <text x="25" y="139" fill="#34D399" font-family="monospace" font-size="11">git log --oneline</text>
    <text x="170" y="139" fill="#94A3B8" font-size="10.5">➔ Muestra historial condensado de commits</text>
  </g>

  <!-- Panel 3: Ramas & Integración Local -->
  <g transform="translate(30, 300)">
    <rect width="405" height="165" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="15" y="12" width="170" height="26" rx="6" fill="#FEF3C7"/>
    <text x="25" y="29" fill="#D97706" font-size="11.5" font-weight="800">3. RAMIFICACIÓN</text>
    <text x="195" y="29" fill="#64748B" font-size="11" font-weight="bold">Branching &amp; Merge</text>

    <rect x="15" y="48" width="375" height="102" rx="8" fill="#0F172A"/>
    <text x="25" y="70" fill="#FBBF24" font-family="monospace" font-size="11">git branch &lt;name&gt;</text>
    <text x="170" y="70" fill="#94A3B8" font-size="10.5">➔ Crea una nueva rama local aislada</text>

    <text x="25" y="93" fill="#FBBF24" font-family="monospace" font-size="11">git switch / checkout</text>
    <text x="185" y="93" fill="#94A3B8" font-size="10.5">➔ Cambia el puntero HEAD de rama</text>

    <text x="25" y="116" fill="#FBBF24" font-family="monospace" font-size="11">git merge &lt;branch&gt;</text>
    <text x="175" y="116" fill="#94A3B8" font-size="10.5">➔ Fusiona cambios de otra rama a la actual</text>

    <text x="25" y="139" fill="#FBBF24" font-family="monospace" font-size="11">git stash</text>
    <text x="110" y="139" fill="#94A3B8" font-size="10.5">➔ Guarda temporalmente cambios sin confirmar</text>
  </g>

  <!-- Panel 4: Comandos de Sincronización Remota -->
  <g transform="translate(465, 300)">
    <rect width="405" height="165" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="15" y="12" width="180" height="26" rx="6" fill="#FAF5FF"/>
    <text x="25" y="29" fill="#7C3AED" font-size="11.5" font-weight="800">4. REMOTO &amp; SYNC</text>
    <text x="205" y="29" fill="#64748B" font-size="11" font-weight="bold">GitHub Sincronización</text>

    <rect x="15" y="48" width="375" height="102" rx="8" fill="#0F172A"/>
    <text x="25" y="70" fill="#C084FC" font-family="monospace" font-size="11">git remote add origin</text>
    <text x="195" y="70" fill="#94A3B8" font-size="10.5">➔ Vincula repositorio con servidor remoto</text>

    <text x="25" y="93" fill="#C084FC" font-family="monospace" font-size="11">git push -u origin &lt;b&gt;</text>
    <text x="200" y="93" fill="#94A3B8" font-size="10.5">➔ Sube commits locales a la rama remota</text>

    <text x="25" y="116" fill="#C084FC" font-family="monospace" font-size="11">git fetch origin</text>
    <text x="165" y="116" fill="#94A3B8" font-size="10.5">➔ Descarga cambios remotos sin fusionar</text>

    <text x="25" y="139" fill="#C084FC" font-family="monospace" font-size="11">git pull origin &lt;b&gt;</text>
    <text x="180" y="139" fill="#94A3B8" font-size="10.5">➔ Descarga y fusiona (fetch + merge auto)</text>
  </g>

  <!-- Bottom Banner -->
  <rect x="30" y="480" width="840" height="48" rx="10" fill="#00A86B"/>
  <text x="50" y="510" fill="#FFFFFF" font-size="13" font-weight="bold">⚡ FLUJO TÍPICO DE TRABAJO:</text>
  <text x="270" y="510" fill="#F8FAFC" font-size="12.5" font-weight="500">git pull ➔ git checkout -b feature/x ➔ git add . ➔ git commit -m "..." ➔ git push</text>
</svg>

</body>
</html>
