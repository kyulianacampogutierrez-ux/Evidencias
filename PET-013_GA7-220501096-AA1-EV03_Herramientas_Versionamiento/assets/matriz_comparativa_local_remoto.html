<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin:0; padding:0; box-sizing: border-box; }
    body {
      width: 900px;
      height: 550px;
      overflow: hidden;
      background: #FFFFFF;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body>

<svg width="900" height="550" viewBox="0 0 900 550" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="550" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Top Title -->
  <rect x="30" y="25" width="840" height="75" rx="14" fill="#0F172A"/>
  <rect x="45" y="40" width="8" height="45" rx="4" fill="#2563EB"/>
  <text x="68" y="55" fill="#60A5FA" font-size="12" font-weight="bold" letter-spacing="2">EVALUACIÓN COMPARATIVA • COMPONENTE FORMATIVO INTEGRACIÓN CONTINUA</text>
  <text x="68" y="82" fill="#FFFFFF" font-size="20" font-weight="900">MATRIZ DIFERENCIAL Y CARACTERÍSTICAS: GIT LOCAL VS. GIT REMOTO</text>

  <!-- 2 Big Columns -->
  <!-- Left Column: Git Local -->
  <g transform="translate(30, 115)">
    <rect width="405" height="350" rx="14" fill="#F8FAFC" stroke="#93C5FD" stroke-width="2"/>
    <rect x="15" y="15" width="375" height="45" rx="10" fill="#EFF6FF"/>
    <text x="30" y="43" fill="#1D4ED8" font-size="16" font-weight="900">💻 SISTEMA GIT LOCAL</text>
    
    <!-- Table Rows -->
    <g transform="translate(15, 75)">
      <!-- Row 1 -->
      <rect width="375" height="45" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="12" y="20" fill="#64748B" font-size="10" font-weight="bold">UBICACIÓN FÍSICA</text>
      <text x="12" y="37" fill="#0F172A" font-size="12" font-weight="700">Máquina del desarrollador (carpeta .git)</text>

      <!-- Row 2 -->
      <rect y="52" width="375" height="45" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="12" y="72" fill="#64748B" font-size="10" font-weight="bold">CONECTIVIDAD A INTERNET</text>
      <text x="12" y="89" fill="#059669" font-size="12" font-weight="700">100% Offline (Sin conexión a red)</text>

      <!-- Row 3 -->
      <rect y="104" width="375" height="45" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="12" y="124" fill="#64748B" font-size="10" font-weight="bold">VELOCIDAD Y LATENCIA</text>
      <text x="12" y="141" fill="#059669" font-size="12" font-weight="700">Instantánea (&lt; 10 ms por operación en SSD)</text>

      <!-- Row 4 -->
      <rect y="156" width="375" height="45" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="12" y="176" fill="#64748B" font-size="10" font-weight="bold">PROPÓSITO PRIMARIO</text>
      <text x="12" y="193" fill="#0F172A" font-size="12" font-weight="700">Control granular de cambios y ramas locales</text>

      <!-- Row 5 -->
      <rect y="208" width="375" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="12" y="228" fill="#64748B" font-size="10" font-weight="bold">RIESGO ANTE FALLO DE HARDWARE</text>
      <text x="12" y="246" fill="#DC2626" font-size="12" font-weight="700">Alto (Si se daña el disco duro local, se pierde)</text>
    </g>
  </g>

  <!-- Right Column: Git Remoto -->
  <g transform="translate(465, 115)">
    <rect width="405" height="350" rx="14" fill="#F8FAFC" stroke="#C084FC" stroke-width="2"/>
    <rect x="15" y="15" width="375" height="45" rx="10" fill="#FAF5FF"/>
    <text x="30" y="43" fill="#7C3AED" font-size="16" font-weight="900">☁️ SISTEMA GIT REMOTO</text>

    <!-- Table Rows -->
    <g transform="translate(15, 75)">
      <!-- Row 1 -->
      <rect width="375" height="45" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="12" y="20" fill="#64748B" font-size="10" font-weight="bold">UBICACIÓN FÍSICA</text>
      <text x="12" y="37" fill="#0F172A" font-size="12" font-weight="700">Servidores en la Nube (GitHub, GitLab, Bitbucket)</text>

      <!-- Row 2 -->
      <rect y="52" width="375" height="45" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="12" y="72" fill="#64748B" font-size="10" font-weight="bold">CONECTIVIDAD A INTERNET</text>
      <text x="12" y="89" fill="#2563EB" font-size="12" font-weight="700">Obligatoria (Requiere conexión HTTPS / SSH)</text>

      <!-- Row 3 -->
      <rect y="104" width="375" height="45" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="12" y="124" fill="#64748B" font-size="10" font-weight="bold">VELOCIDAD Y LATENCIA</text>
      <text x="12" y="141" fill="#D97706" font-size="12" font-weight="700">Dependiente de ancho de banda (~200ms - 2s)</text>

      <!-- Row 4 -->
      <rect y="156" width="375" height="45" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="12" y="176" fill="#64748B" font-size="10" font-weight="bold">PROPÓSITO PRIMARIO</text>
      <text x="12" y="193" fill="#0F172A" font-size="12" font-weight="700">Colaboración, Pull Requests, Code Review &amp; CI/CD</text>

      <!-- Row 5 -->
      <rect y="208" width="375" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="12" y="228" fill="#64748B" font-size="10" font-weight="bold">RIESGO ANTE FALLO DE HARDWARE</text>
      <text x="12" y="246" fill="#059669" font-size="12" font-weight="700">Nulo (Respaldo distribuido y redundante)</text>
    </g>
  </g>

  <!-- Bottom Banner -->
  <rect x="30" y="480" width="840" height="48" rx="10" fill="#0F172A"/>
  <text x="50" y="510" fill="#38BDF8" font-size="13" font-weight="bold">🎯 CONCLUSIÓN TÉCNICA:</text>
  <text x="245" y="510" fill="#F8FAFC" font-size="13" font-weight="500">"No son tecnologías rivales sino simbióticas: Git Local es el motor de trabajo, Git Remoto es el centro de colaboración."</text>
</svg>

</body>
</html>
