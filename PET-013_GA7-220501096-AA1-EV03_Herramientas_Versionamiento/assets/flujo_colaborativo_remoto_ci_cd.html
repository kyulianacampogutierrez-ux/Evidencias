<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin:0; padding:0; box-sizing: border-box; }
    body {
      width: 900px;
      height: 550px;
      overflow: hidden;
      background: #FFFFFF;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body>

<svg width="900" height="550" viewBox="0 0 900 550" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="550" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Top Title -->
  <rect x="30" y="25" width="840" height="75" rx="14" fill="#0F172A"/>
  <rect x="45" y="40" width="8" height="45" rx="4" fill="#7C3AED"/>
  <text x="68" y="55" fill="#C084FC" font-size="12" font-weight="bold" letter-spacing="2">INTEGRACIÓN CONTINUA &amp; COLABORACIÓN EN EQUIPO</text>
  <text x="68" y="82" fill="#FFFFFF" font-size="20" font-weight="900">CICLO DE VIDA DE UN PULL REQUEST: DE POPAYÁN A PRODUCCIÓN</text>

  <!-- 5 Stage Flow -->
  <!-- Stage 1: Local Dev Popayán -->
  <g transform="translate(30, 120)">
    <rect width="150" height="230" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="18" fill="#2563EB"/>
    <text x="30" y="41" fill="#FFFFFF" font-size="16" font-weight="bold">1</text>
    <text x="15" y="75" fill="#0F172A" font-size="13" font-weight="bold">Desarrollo Local</text>
    <text x="15" y="92" fill="#2563EB" font-size="11" font-weight="600">Karen en Popayán</text>

    <text x="15" y="120" fill="#475569" font-size="10.5">Crea rama local:</text>
    <rect x="10" y="130" width="130" height="26" rx="5" fill="#0F172A"/>
    <text x="15" y="147" fill="#38BDF8" font-family="monospace" font-size="9.5">git switch -c feat/x</text>

    <text x="15" y="175" fill="#475569" font-size="10.5">Commits atómicos TDD.</text>
    <rect x="10" y="185" width="130" height="26" rx="5" fill="#0F172A"/>
    <text x="15" y="202" fill="#34D399" font-family="monospace" font-size="9.5">git push origin feat/x</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M185 235 L200 235 M195 230 L200 235 L195 240" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Stage 2: GitHub Pull Request -->
  <g transform="translate(205, 120)">
    <rect width="150" height="230" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="18" fill="#7C3AED"/>
    <text x="30" y="41" fill="#FFFFFF" font-size="16" font-weight="bold">2</text>
    <text x="15" y="75" fill="#0F172A" font-size="13" font-weight="bold">Pull Request</text>
    <text x="15" y="92" fill="#7C3AED" font-size="11" font-weight="600">GitHub Remote</text>

    <text x="15" y="120" fill="#475569" font-size="10.5">Apertura formal de PR</text>
    <text x="15" y="135" fill="#475569" font-size="10.5">hacia rama develop.</text>

    <rect x="10" y="150" width="130" height="30" rx="6" fill="#F5F3FF"/>
    <text x="15" y="170" fill="#6D28D9" font-size="10" font-weight="bold">Diff transparente</text>

    <text x="15" y="200" fill="#64748B" font-size="10">Vinculado a issue #12</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M360 235 L375 235 M370 230 L375 235 L370 240" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Stage 3: CI Automation -->
  <g transform="translate(380, 120)">
    <rect width="150" height="230" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="18" fill="#F59E0B"/>
    <text x="30" y="41" fill="#FFFFFF" font-size="16" font-weight="bold">3</text>
    <text x="15" y="75" fill="#0F172A" font-size="13" font-weight="bold">GitHub Actions</text>
    <text x="15" y="92" fill="#D97706" font-size="11" font-weight="600">Pipeline CI</text>

    <text x="15" y="120" fill="#475569" font-size="10.5">Compuertas auto:</text>
    <text x="15" y="140" fill="#059669" font-size="10" font-weight="bold">✔ ESLint sintaxis</text>
    <text x="15" y="158" fill="#059669" font-size="10" font-weight="bold">✔ 86 Pruebas TDD</text>
    <text x="15" y="176" fill="#059669" font-size="10" font-weight="bold">✔ Audit de seguridad</text>

    <rect x="10" y="190" width="130" height="24" rx="5" fill="#FEF3C7"/>
    <text x="15" y="206" fill="#B45309" font-size="9.5" font-weight="bold">Cero fallos</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M535 235 L550 235 M545 230 L550 235 L545 240" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Stage 4: Code Review -->
  <g transform="translate(555, 120)">
    <rect width="150" height="230" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="18" fill="#10B981"/>
    <text x="30" y="41" fill="#FFFFFF" font-size="16" font-weight="bold">4</text>
    <text x="15" y="75" fill="#0F172A" font-size="13" font-weight="bold">Code Review</text>
    <text x="15" y="92" fill="#059669" font-size="11" font-weight="600">Revisión por Pares</text>

    <text x="15" y="120" fill="#475569" font-size="10.5">Inspección de calidad,</text>
    <text x="15" y="135" fill="#475569" font-size="10.5">legibilidad y SOLID.</text>

    <rect x="10" y="155" width="130" height="28" rx="6" fill="#ECFDF5"/>
    <text x="15" y="174" fill="#047857" font-size="10" font-weight="bold">✔ Aprobado por Lead</text>

    <text x="15" y="205" fill="#64748B" font-size="10">Branch Protection Rule</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M710 235 L725 235 M720 230 L725 235 L720 240" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Stage 5: Merge & Deploy -->
  <g transform="translate(730, 120)">
    <rect width="140" height="230" rx="12" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
    <circle cx="35" cy="35" r="18" fill="#00A86B"/>
    <text x="30" y="41" fill="#FFFFFF" font-size="16" font-weight="bold">5</text>
    <text x="15" y="75" fill="#065F46" font-size="13" font-weight="bold">Merge &amp; CD</text>
    <text x="15" y="92" fill="#047857" font-size="11" font-weight="600">Integración</text>

    <text x="15" y="120" fill="#14532D" font-size="10.5">Fusión a develop/main</text>
    <rect x="10" y="135" width="120" height="26" rx="5" fill="#00A86B"/>
    <text x="15" y="152" fill="#FFFFFF" font-size="10" font-weight="bold">Squash &amp; Merge</text>

    <text x="15" y="180" fill="#14532D" font-size="10">Despliegue automático</text>
    <text x="15" y="200" fill="#047857" font-size="9.5" font-weight="bold">SemVer 2.0.0 Tag</text>
  </g>

  <!-- Bottom Comparison Card -->
  <rect x="30" y="375" width="840" height="145" rx="14" fill="#0F172A"/>
  <text x="50" y="405" fill="#00A86B" font-size="14" font-weight="bold">🛡️ MECANISMOS DE SEGURIDAD EN GIT REMOTO (GITHUB ENTERPRISE / CLOUD):</text>
  
  <rect x="50" y="420" width="245" height="85" rx="8" fill="#1E293B"/>
  <text x="65" y="445" fill="#38BDF8" font-size="13" font-weight="bold">Branch Protection</text>
  <text x="65" y="465" fill="#94A3B8" font-size="11">• Prohíbe git push directo a main</text>
  <text x="65" y="480" fill="#94A3B8" font-size="11">• Exige mínimo 1 aprobación PR</text>
  <text x="65" y="495" fill="#94A3B8" font-size="11">• Obliga pasar checks de CI</text>

  <rect x="315" y="420" width="245" height="85" rx="8" fill="#1E293B"/>
  <text x="330" y="445" fill="#F472B6" font-size="13" font-weight="bold">Control de Acceso (RBAC)</text>
  <text x="330" y="465" fill="#94A3B8" font-size="11">• Roles: Read, Triage, Write, Admin</text>
  <text x="330" y="480" fill="#94A3B8" font-size="11">• Llaves SSH y Tokens PAT 2FA</text>
  <text x="330" y="495" fill="#94A3B8" font-size="11">• Firma criptográfica GPG</text>

  <rect x="580" y="420" width="270" height="85" rx="8" fill="#1E293B"/>
  <text x="595" y="445" fill="#34D399" font-size="13" font-weight="bold">Respaldo Georredundante</text>
  <text x="595" y="465" fill="#94A3B8" font-size="11">• Replicación en múltiples data centers</text>
  <text x="595" y="480" fill="#94A3B8" font-size="11">• Disponibilidad &gt; 99.95%</text>
  <text x="595" y="495" fill="#94A3B8" font-size="11">• Trazabilidad de auditoría SOC 2</text>
</svg>

</body>
</html>
