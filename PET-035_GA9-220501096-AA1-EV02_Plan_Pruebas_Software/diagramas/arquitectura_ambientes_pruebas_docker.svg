  <!-- SERVICIO 3: BASE DE DATOS MONGODB -->
  <g filter="url(#shadow2)">
    <rect x="810" y="170" width="320" height="190" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
