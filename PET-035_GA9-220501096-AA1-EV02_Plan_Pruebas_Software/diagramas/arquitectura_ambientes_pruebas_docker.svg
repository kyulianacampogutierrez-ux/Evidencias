    <text x="100" y="290" font-size="11" fill="#334155">• <strong>Volumen:</strong> /sena/CDE montado</text>
    <text x="100" y="310" font-size="11" fill="#334155">• <strong>Ejecución:</strong> TDD unitario &amp; integración</text>
    <text x="100" y="335" font-size="11" font-weight="bold" fill="#059669">ESTADO: HEALTHY (Tiempo: 156 ms)</text>
  </g>

  <!-- SERVICIO 2: BACKEND GO FIBER -->
  <g filter="url(#shadow2)">
    <rect x="440" y="170" width="320" height="190" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="440" y="170" width="320" height="35" rx="10" fill="#0284c7"/>
