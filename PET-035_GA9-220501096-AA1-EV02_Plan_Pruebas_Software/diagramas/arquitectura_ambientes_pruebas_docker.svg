  <text x="330" y="411" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">CLIENTE WEB &amp; FRONTEND (React + Vite - Puerto 5173)</text>
  <text x="100" y="445" font-size="11" fill="#475569">• <strong>Pruebas de Componentes:</strong> Carrito de compras, catálogo reactivo</text>
  <text x="100" y="470" font-size="11" fill="#475569">• <strong>Pruebas de Integración Web:</strong> Axios interceptors, JWT localStorage</text>
  <text x="100" y="495" font-size="11" fill="#475569">• <strong>Responsive Testing:</strong> Visualización fluida en escritorio y tablet</text>
  <text x="100" y="520" font-size="11" fill="#475569">• <strong>Saneamiento XSS:</strong> React DOM escaping nativo validado</text>

  <rect x="630" y="390" width="500" height="190" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow2)"/>
  <rect x="630" y="390" width="500" height="30" rx="10" fill="#4338ca"/>
  <text x="880" y="411" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">CLIENTE MÓVIL (React Native Android 14+ - APK)</text>
  <text x="650" y="445" font-size="11" fill="#475569">• <strong>Entorno Móvil:</strong> Emulador y APK Release probada en Android API 34</text>
  <text x="650" y="470" font-size="11" fill="#475569">• <strong>Módulos Probados:</strong> Selección de ingredientes, geolocalización Popayán</text>
  <text x="650" y="495" font-size="11" fill="#475569">• <strong>Offline Mode:</strong> Manejo de conectividad intermitente en despacho</text>
