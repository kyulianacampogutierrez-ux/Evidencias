  <text x="1150" y="55" font-size="12" font-weight="bold" fill="#64748b" text-anchor="end">SENA CTPI • ADSO 3186681</text>

  <!-- CONTENEDOR PRINCIPAL DOCKER COMPOSE -->
  <rect x="40" y="100" width="1120" height="510" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="60" y="115" width="280" height="32" rx="6" fill="#0284c7"/>
  <text x="200" y="136" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">🐳 RED DOCKER AISLADA (sena-net)</text>

